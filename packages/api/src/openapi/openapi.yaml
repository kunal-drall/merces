                indexingRule: { type: string, enum: [none, cpi-annual] }
                termsSalt: { $ref: '#/components/schemas/FieldDecimal' }
      responses: { '200': { description: The commitment, content: { application/json: { schema: { type: object, properties: { commitment: { $ref: '#/components/schemas/Hash32' }, scheme: { type: string, const: poseidon5-v1 } } } } } }, '422': { description: The fields cannot form a commitment (unsupported currency, unknown indexing rule, out of range, salt not a field element) } }
