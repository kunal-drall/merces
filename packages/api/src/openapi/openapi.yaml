    post:
      operationId: computeCommitment
      x-access: public
      tags: [terms]
      description: 'Stage 1''s terms commitment, Poseidon(5)(θ, r, ISO-4217 numeric currency, indexing rule code, terms salt) (SPEC §1.5), over the fields the terms vault discloses (scheme poseidon5-v1). The whole disclosed payload may be posted; other fields are ignored.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshold, ratePerUnitWad, reportingCurrency, indexingRule, termsSalt]
              additionalProperties: true
              properties:
                threshold: { type: string, pattern: '^\d+$', description: 'θ in the reporting currency at 6 decimals, below 2^64' }
                ratePerUnitWad: { type: string, pattern: '^\d+$', description: r per unit (WAD), below 2^64 }
                reportingCurrency: { type: string, description: ISO-4217 alpha code Stage 1 lists (CURRENCY_CODES) }
                indexingRule: { type: string, enum: [none, cpi-annual] }
                termsSalt: { $ref: '#/components/schemas/FieldDecimal' }
      responses: { '200': { description: The commitment, content: { application/json: { schema: { type: object, properties: { commitment: { $ref: '#/components/schemas/Hash32' }, scheme: { type: string, const: poseidon5-v1 } } } } } }, '422': { description: The fields cannot form a commitment (unsupported currency, unknown indexing rule, out of range, salt not a field element) } }
