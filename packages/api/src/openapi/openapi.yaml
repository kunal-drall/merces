openapi: 3.1.0
info:
  title: Merces API
  version: 0.1.0
  description: |
    One chain-neutral API over every chain Merces runs on. Money is always a decimal string in stablecoin base
    units; ratios are decimal strings in 1e18 fixed point (WAD); timestamps are unix seconds.
    Every operation carries `x-access`: public | account | backer | holder | issuer | attestor | admin |
    holder-or-issuer | issuer-or-attestor. Writes accept an `Idempotency-Key` header.
servers:
  - url: http://localhost:3000
tags:
  - { name: public }
  - { name: me }
  - { name: auth, description: Wallet sign-in (E2) }
  - { name: applications, description: Issuer and backer onboarding (E2) }
  - { name: drafts, description: Series drafts, terms vault and contract signing (E3, E4) }
  - { name: terms, description: Terms validation, disclosure and amendments (E4) }
  - { name: tx, description: Relay of user-signed transactions }
  - { name: reporting, description: ProofOfIncome (E5) }
  - { name: bids, description: Sealed-bid auction service (E6) }
  - { name: admin }
  - { name: attestor }
  - { name: dev, description: Mock-mode only (simulator) }
components:
  securitySchemes:
    session: { type: http, scheme: bearer }
  parameters:
    seriesId: { name: seriesId, in: path, required: true, schema: { type: string }, description: "<chain>:<address>" }
    issuerId: { name: issuerId, in: path, required: true, schema: { type: string }, description: "<chain>:<address>" }
    limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    offset: { name: offset, in: query, schema: { type: integer, minimum: 0, default: 0 } }
    chainQuery: { name: chain, in: query, schema: { type: string } }
  schemas:
    Money: { type: string, pattern: '^\d+$', description: base units }
    Wad: { type: string, pattern: '^\d+$', description: 1e18 fixed point }
    Error:
      type: object
      required: [error, message]
      properties:
        error: { type: string }
        message: { type: string, description: 'human text; never an income figure, salt, opening or document (Stage 1 messages that can embed values are replaced)' }
        detail:
          type: [object, 'null']
          description: 'Structured detail. A refusal on a Stage 1 path carries `stage1`: Stage 1''s canonical error name (SPEC §11), beside the chain-neutral `error` code; other keys are public facts only (ids, periods, public amounts).'
          properties:
            stage1: { $ref: '#/components/schemas/Stage1ErrorName' }
          additionalProperties: true
    Stage1ErrorName:
      type: string
      description: 'A Stage 1 error name (SPEC v1.1.2 §11, `@merces/sdk` ERRORS), e.g. WrongPeriod, PaymentOutstanding, ReportTooEarly, TierNotEnabled, InvalidProof, SeriesLate, LockupActive, UnreportedPeriods, NothingDue, HolderNotRegistered, TerminalStatus, RaiseNotSettled, MintNotFinalized, UnfavourableAmendment, PauseTooLong, InsufficientEscrow, AmountOutOfRange. The sealed-bid raise and its settlement (SPEC §5.1–§5.2): NotIssuer, RaiseNotDraft, ContractHashMissing, NotAllowlisted, NewRaisesPaused, RaiseNotOpen, BidsExist, CommitPhaseClosed, BidExists, ZeroEscrow, RevealNotStarted, RevealPhaseClosed, AlreadyRevealed, CommitmentMismatch, BidNotFound, SettlementNotReady, TallyInProgress, NotSettling, TallyIncomplete, AlreadyProcessed, NotProcessed, AlreadyDelivered. The claims (S3): NotRedeemed, NoRedeemedUnits, HolderNotRegistered, TerminalStatus, NotAllowlisted (a registration).'
      pattern: '^[A-Z][A-Za-z0-9]+$'
    ChainHealth:
      type: object
      properties:
        chain: { type: string }
        family: { type: string, enum: [solana, evm] }
        mode: { type: string, enum: [mock, live] }
        ok: { type: boolean }
        detail: { type: string }
        cursor: { type: [string, 'null'] }
        lastSeq: { type: integer }
    Health:
      type: object
      properties:
        ok: { type: boolean }
        chains: { type: array, items: { $ref: '#/components/schemas/ChainHealth' } }
        stage1: { type: [object, 'null'] }
    ChainCatalogue:
      type: object
      properties:
        chains:
          type: array
          items:
            type: object
            properties:
              chain: { type: string }
              family: { type: string }
              mode: { type: string }
              network: { type: string }
              stablecoins: { type: array, items: { type: object, properties: { symbol: { type: string }, mint: { type: string }, decimals: { type: integer } } } }
              raiseStyles: { type: array, items: { type: string, enum: [sealed, curve] } }
              signing: { oneOf: [{ $ref: '#/components/schemas/SigningDomain' }, { type: 'null' }], description: "The deployment's signing domain (S4), derived on every read; null while the chain's adapter cannot read it (the live adapters until S5), and signing flows on that chain answer 409 (detail.reason signing-domain-unknown)" }
    SigningDomain:
      type: object
      description: "A deployment's signing domain (Stage 1 SPEC §1.3): what every MERCES_*_V1 signed message binds first. A simulator chain signs under Stage 1's local ids (Solana localnet cluster tag 104, EVM chain id 31337) with a registry derived from its chain key, so no simulator signature is valid on a real deployment; signers never sign for a mainnet."
      required: [chainKind, chainId, registry, domain]
      additionalProperties: false
      properties:
        chainKind: { type: integer, enum: [1, 2], description: 'Stage 1 ChainKind: 1 Solana, 2 EVM' }
        chainId: { type: string, pattern: '^(0|[1-9]\d{0,19})$', description: 'u64 decimal: a Solana cluster tag (101 mainnet-beta, 102 testnet, 103 devnet, 104 localnet) or an EVM chain id' }
        registry: { type: string, pattern: '^0x[0-9a-f]{64}$', description: "the registry's 32-byte wallet form: the merces_registry program id on Solana, the MercesRegistry address left-padded on the EVM" }
        domain: { type: string, pattern: '^0x[0-9a-f]{64}$', description: 'keccak256(chain_kind_u8 ‖ chain_id_u64 ‖ registry_32)' }
    ReleaseTranche:
      type: object
      properties: { afterSeconds: { type: integer }, bps: { type: integer } }
    SeriesTerms:
      type: object
      properties:
        routerTerms: { $ref: '#/components/schemas/RouterTerms' }
        fxPairId: { type: [string, 'null'], pattern: '^0x[0-9a-f]{64}$', default: null, description: 'Registered Stage 1 FX pair. Required for non-USD draft terms; forbidden for tier 1.' }
        unitsOffered: { type: string }
        reservePrice: { $ref: '#/components/schemas/Money' }
        minimumRaise: { $ref: '#/components/schemas/Money' }
        capMultipleWad: { $ref: '#/components/schemas/Wad' }
        lockupSeconds: { type: integer, description: 0 on a curve-mode series (Stage 1 requires 0) }
        releaseSchedule: { type: array, items: { $ref: '#/components/schemas/ReleaseTranche' } }
        auctionFeeBps: { type: integer }
        payoutFeeBps: { type: integer }
        hurdleWad: { $ref: '#/components/schemas/Wad' }
        payoutMultipleK: { type: integer }
        windowCommitDuration: { type: [integer, 'null'], minimum: 3600, maximum: 1209600, default: 259200 }
        windowRevealDuration: { type: [integer, 'null'], minimum: 3600, maximum: 604800, default: 86400 }
        windowFeeBps: { type: [integer, 'null'], minimum: 0, maximum: 1000, default: 100 }
        walletCapBps: { type: integer, description: "the sealed-bid raise's wallet cap in bps of the units offered (a bid above it is invalid at reveal). 0 on a curve-mode series, which has no wallet cap at any stage (the series' noCap): 0 there never means a cap" }
        dueDays: { type: integer }
        graceDays: { type: integer }
        formalNoticeDays: { type: integer }
        contractHash: { type: string }
        termsCommitment: { type: string }
        tierFlags: { type: object, properties: { tier1: { type: boolean }, tier2: { type: boolean }, tier3: { type: boolean }, tier4: { type: boolean } } }
        reportingCurrency: { type: string }
        commitDurationSeconds: { type: [integer, 'null'], description: "the sealed raise's commit phase (Stage 1 commit_duration; 1 hour–30 days): openRaise sets the commit end to now + this. 0 on a curve-mode series (no auction). Null on a row indexed before S2" }
        revealDurationSeconds: { type: [integer, 'null'], description: "the sealed raise's reveal phase (Stage 1 reveal_duration; 1 hour–7 days), after the commit end. 0 on a curve-mode series. Null on a row indexed before S2" }
        nonRevealChargeBps: { type: [integer, 'null'], description: "the series' own non-reveal charge, frozen at creation (Stage 1 non_reveal_charge_bps; 0–1000 bps): when the raise settles, a bid committed and never revealed pays floor(deposit × nonRevealChargeBps / 10000) to the protocol fee collector and is refunded the rest; a failed raise and a revealed bid are never charged. New series take the operator's setting (the owner's decision); issuers cannot choose it. Series created under the S2 hold record 0. Null on a row indexed before S2" }
    SeriesAuction:
      type: object
      description: "A sealed raise's settlement as indexed (public onchain state): the current round and how it ended, and what finalizeSettlement wrote. A failed raise keeps its price and its would-be units and proceeds here, with the reason; the series' issuePrice stays null."
      properties:
        round: { type: integer, description: 'the settlement round (Stage 1 tally_round): 0 before the first proposal' }
        roundRejected: { type: boolean }
        rejectionReason: { oneOf: [{ $ref: '#/components/schemas/SettlementRejection' }, { type: 'null' }] }
        clearingPrice: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'null before finalization and when no bid was valid' }
        unitsSold: { type: string }
        proceeds: { $ref: '#/components/schemas/Money' }
        failureReason: { oneOf: [{ $ref: '#/components/schemas/RaiseFailure' }, { type: 'null' }] }
        finalizedAt: { type: [integer, 'null'], description: when the raise settled or failed }
    RaisePhase:
      type: string
      enum: [Draft, Open, Reveal, Settling, Settled, Failed, Cancelled]
      description: "For display: an Open raise is shown as Open during its commit phase and Reveal from its commit end until settlement begins (on the series row, which the indexer keeps, it stays Open); Settling between the first proposal and finalization"
    RaiseState:
      type: string
      enum: [Draft, Open, Settling, Settled, Failed, Cancelled]
      description: "Stage 1's stored raise state, never time-derived (what settlement planning reads, with the phase ends)"
    RaiseFailure: { type: string, enum: [NoValidBids, MinRaise], description: 'why finalizeSettlement failed the raise: no valid bid, or the proceeds (or the units sold) fell short of the minimum raise' }
    SettlementRejection: { type: string, enum: [ClaimMismatch, InvalidClearingPrice], description: why a settlement round's proposal was rejected at finalization }
    SettlementStage:
      type: string
      enum: [draft, commit, reveal, awaiting-proposal, tallying, awaiting-finalize, processing, delivering, complete, failed-complete, cancelled]
      description: "Where a raise stands in Stage 1's settlement (a derived label, not chain state): awaiting-proposal covers an Open raise past its reveal end and a Settling raise whose round was rejected; processing a finalized raise with bids to process (the mint is not final); delivering a final mint with a processed bid not yet delivered; failed-complete a failed raise with every deposit delivered back"
    AuctionState:
      type: object
      description: "A sealed raise's auction record as the chain holds it (Stage 1 SPEC §5.1–§5.2). Every amount is public onchain: the escrow, the current round's proposal and running tally, and the results finalizeSettlement wrote (for a MinRaise failure, the would-be price, units and proceeds)."
      properties:
        seriesId: { type: string }
        phase: { $ref: '#/components/schemas/RaisePhase' }
        raiseState: { $ref: '#/components/schemas/RaiseState' }
        stage: { $ref: '#/components/schemas/SettlementStage' }
        now: { type: integer, description: chain time }
        phaseEndsAt: { type: [integer, 'null'], description: 'the end of the current time-bound phase: the commit end while Open, the reveal end while Reveal; null otherwise (settlement steps have no deadline)' }
        commitEndsAt: { type: [integer, 'null'] }
        revealEndsAt: { type: [integer, 'null'] }
        bidCount: { type: integer }
        revealedCount: { type: integer }
        validCount: { type: integer, description: "revealed bids valid under Stage 1's rule (fixed at reveal)" }
        escrowTotal: { $ref: '#/components/schemas/Money', description: 'stablecoin the auction holds: the deposits, less what processing moved out, less the refunds delivered' }
        escrowUnits: { type: string, description: units allocated to winners and not yet delivered }
        round: { type: integer, description: 'Stage 1 tally_round: 0 before the first proposal' }
        roundRejected: { type: boolean }
        rejectionReason: { oneOf: [{ $ref: '#/components/schemas/SettlementRejection' }, { type: 'null' }] }
        proposal:
          type: [object, 'null']
          description: "the current round's proposal (the rejected one while roundRejected); null before the first"
          properties: { clearingPrice: { $ref: '#/components/schemas/Money' }, qAboveClaim: { type: string }, qAtClaim: { type: string }, rClaim: { type: string } }
        tally:
          type: object
          description: "the current round's running tally"
          properties: { talliedCount: { type: integer }, qAbove: { type: string }, qAt: { type: string }, allocSum: { type: string }, minValidPrice: { type: [string, 'null'] } }
        clearingPrice: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'the price finalizeSettlement cleared (kept on a MinRaise failure); null before it and when no bid was valid' }
        qAbove: { type: string }
        qAt: { type: string }
        R: { type: string, description: 'units for the bids exactly at the clearing price (r_claim of the accepted round; 0 when failed)' }
        unitsSold: { type: string }
        proceeds: { $ref: '#/components/schemas/Money' }
        finalizedAt: { type: [integer, 'null'] }
        failureReason: { oneOf: [{ $ref: '#/components/schemas/RaiseFailure' }, { type: 'null' }] }
        bidsProcessed: { type: integer }
        unitsMinted: { type: string }
        mintFinalized: { type: boolean, description: 'the last bid is processed: the money paths open (Stage 1 MintNotFinalized until then)' }
    Bid:
      type: object
      description: "One of the caller's bids. Its settlement fields come from one source, never a mix (source): the chain's read of the bid, or, when the chain has no read of it, the indexed row as a whole. A processed bid is owed pendingUnits and pendingRefund until it is delivered; the keepers deliver every bid, and POST /series/{seriesId}/bids/build-deliver delivers it sooner."
      properties:
        seriesId: { type: string }
        chain: { type: string }
        bidder: { type: string }
        phase: { type: string, description: "the series' phase, as indexed" }
        deposit: { $ref: '#/components/schemas/Money', description: the escrow the commit locked }
        source: { type: string, enum: [chain, index], description: "where revealed, valid, processed, delivered, allocatedUnits, pendingUnits, pendingRefund, refundable and nonRevealCharge come from: the chain's read of the bid, or the indexed row (when the chain has no read of it; it may lag the chain by an indexer pass)" }
        revealed: { type: [object, 'null'], properties: { pricePerUnit: { $ref: '#/components/schemas/Money' }, quantity: { type: string } }, description: null until revealed }
        valid: { type: [boolean, 'null'], description: "fixed at reveal (Stage 1 isBidValid: reserve, 1 ≤ quantity ≤ the wallet cap, escrow ≥ the required escrow); an invalid bid is refunded in full. Null until revealed" }
        processed: { type: boolean }
        delivered: { type: boolean }
        allocatedUnits: { type: string, description: units allocated when processed }
        pendingUnits: { type: string, description: 'units a processed bid is owed until delivered; "0" otherwise' }
        pendingRefund: { $ref: '#/components/schemas/Money', description: 'the refund a processed bid is owed until delivered (Stage 1 pendingRefund); "0" otherwise' }
        refundable: { $ref: '#/components/schemas/Money', description: 'the same refund as pendingRefund' }
        nonRevealCharge: { $ref: '#/components/schemas/Money', description: 'the non-reveal charge the bid paid when it was processed (Stage 1 process_bid: a bid never revealed, on a settled raise; floor(deposit × the series'' nonRevealChargeBps / 10000), to the protocol fee collector); "0" for every other bid, before processing and on a failed raise. Kept after delivery' }
        refunded: { oneOf: [{ $ref: '#/components/schemas/Money' }, { type: 'null' }], description: 'the refund delivered, as indexed (only the delivery event carries it): "0" while the bid is undelivered; null while the chain shows the bid delivered and the indexer has not projected the delivery yet (an indexer pass)' }
    SettlementStep:
      type: object
      description: The next settlement step, built for the signer to sign and relay with POST /tx/send. Every step is permissionless.
      required: [stage, command, tx]
      properties:
        stage: { $ref: '#/components/schemas/SettlementStage' }
        command:
          type: object
          description: 'the step: beginSettlement {clearingPrice, qAboveClaim, qAtClaim} (the honest proposal, from the revealed bids with Stage 1''s math), tallyBids {maxBids} (one page; the chain''s page limit), finalizeSettlement, processBid {bidder} or deliverBid {bidder}'
          required: [kind, seriesId]
          properties:
            kind: { type: string, enum: [beginSettlement, tallyBids, finalizeSettlement, processBid, deliverBid] }
            seriesId: { type: string }
          additionalProperties: true
        tx: { $ref: '#/components/schemas/UnsignedTx' }
    SettlementStepRefusal:
      type: object
      description: 'Why there is no step to build (409 detail): wait (the reveal phase has not ended; until), done (every bid is delivered, or the raise is cancelled or still a draft), or the planner''s stuck code (ValidityMismatch, NoClearingPrice, ProposalRejected, ProposalAlreadyRejected, NoRevealEnd, NothingToProcess: an operator matter, never retried by itself)'
      properties:
        stage: { oneOf: [{ $ref: '#/components/schemas/SettlementStage' }, { type: 'null' }] }
        reason: { type: string }
        until: { type: integer }
    Series:
      type: object
      properties:
        seriesId: { type: string }
        chain: { type: string }
        issuer: { type: string }
        stablecoin: { type: string, enum: [USDC, USDG] }
        raiseStyle: { type: string, enum: [sealed, curve] }
        unitScale: { type: string, enum: ['1', '1000000'], description: "accounting units per whole unit (Stage 1's unit_scale, fixed by the raise style): 1 for a sealed-bid series, 1000000 for a curve series, whose units are counted in base lamports. unitsSold, unitsOutstanding, position units and paidPerUnitWad are per accounting unit; issuePrice, capPerUnit and redemption prices per whole unit" }
        noCap: { type: boolean, description: "true on a curve-mode series: it has no wallet cap at any stage, before or after the curve fills (terms.walletCapBps is Stage 1's 0). false on a sealed-bid series, whose auction caps each wallet at terms.walletCapBps" }
        noCapStatement: { type: [string, 'null'], description: the one no-cap statement on a curve-mode series; null on a sealed-bid series }
        phase: { $ref: '#/components/schemas/RaisePhase' }
        status: { type: string, enum: [OnTime, InGrace, Late, Paused, Retired, Redeemed, Extinguished] }
        terms: { $ref: '#/components/schemas/SeriesTerms' }
        createdAt: { type: integer }
        openedAt: { type: [integer, 'null'] }
        commitEndsAt: { type: [integer, 'null'] }
        revealEndsAt: { type: [integer, 'null'] }
        settledAt: { type: [integer, 'null'] }
        lockupEndsAt: { type: [integer, 'null'] }
        issuePrice: { type: [string, 'null'] }
        unitsSold: { type: string }
        unitsOutstanding: { type: string, description: 'accounting units; on a curve series the count of the last census (syncCurveUnits, or redeem''s own)' }
        stakedTotal: { type: string, pattern: '^\d+$', description: 'curve staking: the units staked (base lamports); "0" on a sealed-bid series' }
        tenderedTotal: { type: string, pattern: '^\d+$', description: 'curve staking: the units tendered at the redemption so far (base lamports); "0" on a sealed-bid series' }
        unitsSyncedAt: { type: [integer, 'null'], description: when the last census of a curve series was taken; null before the first and on a sealed-bid series }
        capPerUnit: { type: [string, 'null'] }
        paidPerUnitWad: { type: string }
        releasesPaused: { type: boolean }
        redeemedAt: { type: [integer, 'null'] }
        extinguishedAt: { type: [integer, 'null'] }
        firstPeriod: { type: [string, 'null'], description: "Stage 1's reporting ledger (indexed): the settlement quarter, the first period to report" }
        nextExpectedPeriod: { type: [string, 'null'], description: the only period a report may be submitted for next (reports are sequential); null before settlement }
        lastAcceptedPeriod: { type: [string, 'null'] }
        lastPaidPeriod: { type: [string, 'null'] }
        openDuePeriod: { type: [string, 'null'], description: 'the reported period whose due is unpaid (one at a time); the next report is refused (PaymentOutstanding) until it is paid' }
        paymentOutstanding: { type: boolean, description: 'a reported due is unpaid; its amount is served at the holder-or-issuer tier (GET /series/{seriesId}/periods, reporting.openDueAmount)' }
        formalNoticeEmittedFor: { type: [string, 'null'], description: the period whose formal notice the chain recorded (period end + 90 days of unpaused time) }
        mintFinalized: { type: boolean, description: "Stage 1's mint gate: a sealed raise's last bid is processed (or a curve completed, completeCurve). Payments, reports, releases, redemption, extinguishment and transfer windows wait for it (MintNotFinalized)" }
        auction: { oneOf: [{ $ref: '#/components/schemas/SeriesAuction' }, { type: 'null' }], description: null for a curve-mode series }
    SeriesReporting:
      type: object
      description: "Stage 1's reporting ledger of a series, as indexed from its events (holder-or-issuer tier: it carries the open due's amount)"
      properties:
        firstPeriod: { type: [string, 'null'] }
        nextExpectedPeriod: { type: [string, 'null'] }
        lastAcceptedPeriod: { type: [string, 'null'] }
        lastPaidPeriod: { type: [string, 'null'] }
        openDuePeriod: { type: [string, 'null'] }
        openDueAmount: { $ref: '#/components/schemas/Money', description: "the open due as reported, before lateness accrual (the open period's live paymentDue adds the accrual to date); 0 when nothing is due" }
        formalNoticeEmittedFor: { type: [string, 'null'] }
    SeriesDetail:
      allOf:
        - $ref: '#/components/schemas/Series'
        - type: object
          properties:
            holderCount: { type: integer }
            curve: { oneOf: [{ $ref: '#/components/schemas/SeriesCurve' }, { type: 'null' }], description: "a curve series' curve as indexed; null on a sealed-bid series" }
    Activity:
      type: object
      description: Public activity never carries an amount.
      properties:
        chain: { type: string }
        seq: { type: integer }
        seriesId: { type: [string, 'null'] }
        kind: { type: string }
        summary: { type: string }
        at: { type: integer }
    Period:
      type: object
      properties:
        seriesId: { type: string }
        periodId: { type: string }
        dueAt: { type: integer, description: "last OnTime instant: period end + 30 days of unpaused time (Stage 1's countdown, inclusive)" }
        graceEndsAt: { type: integer, description: last InGrace instant (period end + 45 days unpaused); one second later the period is Late }
        formalNoticeAt: { type: integer, description: 'first instant a formal notice is due: period end + 90 days unpaused (Stage 1 formalNoticeDue); a pause approved later moves it' }
        reportAccepted: { type: boolean }
        tier: { type: [integer, 'null'] }
        paymentStable: { $ref: '#/components/schemas/Money', description: "the accepted report's payment figure (Stage 1's Report.payment_usd, before any router credit); '0' until reported. Stage 1 bounds a negative true-up by the year's sum of it (S4 WP13)" }
        paymentDue: { $ref: '#/components/schemas/Money', description: 'while the period holds the open due: the live amount payIn must carry now (the due plus lateness accrual to date; a tail due without accrual); once paid: the due and accrual recomputed at payment' }
        accrual: { $ref: '#/components/schemas/Money' }
        paid: { $ref: '#/components/schemas/Money' }
        splitReceived: { $ref: '#/components/schemas/Money' }
        settled: { type: boolean }
        standing: { type: string, enum: [NotDue, OnTime, InGrace, Late, FormalNoticeDue, Deferred] }
        incomeCommitment: { type: [string, 'null'] }
        priorIncomeCommitment: { type: [string, 'null'], description: 'the income commitment the report chained from (Stage 1 prior chain; Poseidon(0, 0) at a year start); null until reported' }
        liquidityEvent: { type: boolean }
        fxBasis: { type: [string, 'null'] }
        fxAvgWad: { type: [string, 'null'] }
        formalNoticeIssued: { type: boolean }
    Holding:
      type: object
      properties:
        seriesId: { type: string }
        chain: { type: string }
        wallet: { type: string }
        stablecoin: { type: string }
        phase: { type: string }
        status: { type: string }
        raiseStyle: { type: string, enum: [sealed, curve] }
        unitScale: { type: string, enum: ['1', '1000000'], description: 'accounting units per whole unit: unit counts are per accounting unit (base lamports on a curve series), per-unit figures per whole unit' }
        units: { type: string, description: 'the accrual weight (on a curve series the stake)' }
        stakedUnits: { type: string, description: 'curve: the units in the stake vault ("0" on a sealed-bid series)' }
        walletUnits: { type: string, description: 'the units in the wallet (on a curve series they earn nothing until staked)' }
        redeemedUnits: { type: string }
        burnedUnits: { type: string }
        issuePrice: { type: [string, 'null'] }
        capPerUnit: { type: [string, 'null'] }
        grossPaidPerUnit: { type: string, description: 'gross paid per WHOLE unit: floor(paidPerUnitWad × unitScale / 1e18)' }
        claimedTotal: { $ref: '#/components/schemas/Money' }
        claimable: { $ref: '#/components/schemas/Money', description: "what claimPayout (Stage 1's claim) pays now: the net payout only; excludes the redemption, the tail and the final pool" }
        pending: { $ref: '#/components/schemas/Money', description: 'the part of claimable already settled into the holder''s balance (Stage 1 pending); the rest accrued since the holder''s vault cursor' }
        redemptionClaimable: { $ref: '#/components/schemas/Money', description: 'what the redemption pays now beside the pending payout (claimRedemption, or the redemption claimTail or claimFinal runs first): the redemption price on the units not yet redeemed plus their tail catch-up; 0 unless the series redeemed' }
        tailClaimable: { $ref: '#/components/schemas/Money', description: "what claimTail pays (Stage 1's claimableTail view): the tail since the holder's tail cursor on its redeemed units or, before it redeems, on the units its redemption would redeem (claimTail redeems first)" }
        finalClaimable: { $ref: '#/components/schemas/Money', description: "the final-pool share claimFinal pays after an extinguishment (claimFinal also pays the net payout, claimable)" }
        realisedYieldBps: { type: integer, description: 'claimedTotal / cost basis in basis points; the cost basis is issuePrice × (the units held + burnedUnits) / unitScale, the units held being units on a sealed-bid row and stakedUnits + walletUnits on a curve row (whose units is its stake), so staking or unstaking does not move it' }
        lockupEndsAt: { type: [integer, 'null'] }
        redemptionPrice: { type: [string, 'null'] }
    PositionView:
      type: object
      description: "A holder's live position, read from the chain (S3: Stage 1's claim family). Each claimable figure is what one claim pays now; nothing is counted twice."
      required: [seriesId, wallet, units, stakedUnits, walletUnits, undeliveredUnits, escrowedUnits, claimable, pending, redemptionClaimable, tailClaimable, finalClaimable, claimedTotal, redeemedUnits, registered]
      properties:
        seriesId: { type: string }
        wallet: { type: string }
        units: { type: string, description: "the holder's accrual weight (Stage 1 accrual_units): its balance, its auction units not yet delivered and the units held for a window ask. On a curve series only staked units earn: its stake (stakedUnits), base lamports" }
        stakedUnits: { type: string, description: "curve mode: the holder's units in the series' stake vault (Stage 1 staked_units, base lamports), the only units that earn; 0 on a sealed-bid series (S3 WP10)" }
        walletUnits: { type: string, description: "the units in the holder's wallet: on a curve series its base lamports of the unit mint, which earn nothing until staked (a wallet holding units without registering reads registered false); on a sealed-bid series its own balance, units − undeliveredUnits − escrowedUnits" }
        undeliveredUnits: { type: string, description: auction units allocated and not yet delivered (part of units) }
        escrowedUnits: { type: string, description: "units held for the holder's window ask (part of units); the holder's own balance is units − undeliveredUnits − escrowedUnits" }
        claimable: { $ref: '#/components/schemas/Money', description: "what claimPayout (Stage 1's claim) pays now: pending plus what accrued since the holder's vault cursor; the net payout only" }
        pending: { $ref: '#/components/schemas/Money', description: "the part of claimable already settled into the holder's balance (Stage 1 pending)" }
        redemptionClaimable: { $ref: '#/components/schemas/Money', description: "what claimRedemption pays now beside the pending payout: the redemption price on the units not yet redeemed plus their tail catch-up; 0 unless the series redeemed. On a curve series what a tender (tenderUnits) of the holder's stake and the wallet units that fit the tender quota would pay as principal" }
        tailClaimable: { $ref: '#/components/schemas/Money', description: "what claimTail pays as TailClaimed (Stage 1's claimableTail view); claimTail redeems a holder that has redeemed nothing first (on a curve series it redeems nothing: the tail on tendered units only)" }
        finalClaimable: { $ref: '#/components/schemas/Money', description: "the final-pool share claimFinal pays once after an extinguishment (beside the pending payout). On a curve series that did not redeem the stake's share is in claimable (any claim pays it) and this is 0" }
        claimedTotal: { $ref: '#/components/schemas/Money' }
        redeemedUnits: { type: string }
        registered: { type: boolean, description: 'a Stage 1 registered holder: payouts accrue to registered holders only, and every claim needs it' }
        lastAccWad: { $ref: '#/components/schemas/Wad', description: "the vault accumulator at the holder's last settlement (its claim cursor)" }
    Hash32: { type: string, pattern: '^0x[0-9a-f]{64}$', description: 'a 32-byte value as 0x + 64 lowercase hex digits (a BN254 field element for Poseidon commitments)' }
    FieldDecimal: { type: string, pattern: '^\d{1,78}$', description: a field element or u64 as a decimal string (snarkjs encoding) }
    Groth16Proof:
      type: object
      description: A snarkjs Groth16 proof over BN254 (Stage 1's ProofOfIncome circuit); chain adapters encode it for the EVM or Solana verifier.
      required: [pi_a, pi_b, pi_c, protocol, curve]
      additionalProperties: false
      properties:
        pi_a: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/FieldDecimal' } }
        pi_b: { type: array, minItems: 3, maxItems: 3, items: { type: array, minItems: 2, maxItems: 2, items: { $ref: '#/components/schemas/FieldDecimal' } } }
        pi_c: { type: array, minItems: 3, maxItems: 3, items: { $ref: '#/components/schemas/FieldDecimal' } }
        protocol: { type: string, const: groth16 }
        curve: { type: string, const: bn128 }
    ReportPublicInputs:
      type: array
      minItems: 6
      maxItems: 6
      items: { $ref: '#/components/schemas/FieldDecimal' }
      description: 'Stage 1''s six public signals, in order: terms_commitment, units_outstanding, fx_avg_wad, prior_income_commitment, income_commitment, payment_usd'
    ReportProof:
      description: 'The report proof: Stage 1''s Groth16 proof, or (simulator-only processes started with MERCES_PROOF_SYSTEM=mock) the mock digest over the public inputs. GET /prover/artifacts lists the systems the API accepts.'
      oneOf:
        - type: object
          required: [system, proof, publicInputs]
          additionalProperties: false
          properties: { system: { type: string, const: groth16-bn254 }, proof: { $ref: '#/components/schemas/Groth16Proof' }, publicInputs: { $ref: '#/components/schemas/ReportPublicInputs' } }
        - type: object
          required: [system, proof, publicInputs]
          additionalProperties: false
          properties: { system: { type: string, const: mock }, proof: { type: string }, publicInputs: { $ref: '#/components/schemas/ReportPublicInputs' } }
      discriminator: { propertyName: system }
    Attestation:
      type: object
      description: "One key's Stage 1 signature over one MERCES_*_V1 message, as a command carries it (S4: nobody co-signs). `signer` is the key's 20-byte address; `signature` is 65 bytes r ‖ s ‖ v (low s, v 27 or 28) over the raw keccak256 digest of the message (no EIP-191 prefix). The digest is never supplied: whoever checks it rebuilds it from the chain's signing domain, the series key and the command's own fields."
      required: [signer, signature]
      additionalProperties: false
      properties:
        signer: { type: string, pattern: '^0x[0-9a-f]{40}$' }
        signature: { type: string, pattern: '^0x[0-9a-f]{130}$' }
    ReportAttestationRecord:
      type: object
      description: "What the report verifier's POST /attest returns for a tier-2 report (served by the isolated report verifier, not this API; S4 WP6): its secp256k1 key's Stage 1 signature over MERCES_REPORT_V1 (the series' chain's signing domain, the series key, the period, the prior and income commitments, tier 2, the liquidity flag), the fields it signed and the digest. The device sends its signer and signature as the report's `attestation` and keeps the whole record as the next quarter's prior attestation. Names no income source and carries no figure."
      required: [signer, signature, digest, chain, seriesId, periodId, priorIncomeCommitment, incomeCommitment, tier, liquidityEvent]
      additionalProperties: false
      properties:
        signer: { type: string, pattern: '^0x[0-9a-f]{40}$' }
        signature: { type: string, pattern: '^0x[0-9a-f]{130}$' }
        digest: { $ref: '#/components/schemas/Hash32' }
        chain: { type: string }
        seriesId: { type: string }
        periodId: { type: string, pattern: '^\d{4}Q[1-4]$' }
        priorIncomeCommitment: { $ref: '#/components/schemas/Hash32' }
        incomeCommitment: { $ref: '#/components/schemas/Hash32' }
        tier: { type: integer, const: 2 }
        liquidityEvent: { type: boolean }
    SignerKeyRecord:
      type: object
      description: "A key as a chain's registry holds it (Stage 1's attestor or verifier key record): public onchain data."
      required: [address, active, revokedAt, graceUntil]
      additionalProperties: false
      properties:
        address: { type: string, pattern: '^0x[0-9a-f]{40}$' }
        active: { type: boolean }
        revokedAt: { type: [integer, 'null'], description: unix seconds of its forward-only revocation; null for a key never revoked or registered again since }
        graceUntil: { type: [integer, 'null'], description: 'revokedAt + 45 days: report and FX signatures of periods that ended by revokedAt stay valid onchain until then' }
    SignerKeyLink:
      type: object
      description: "An attestor key linked to the caller's account (S4 WP7), with its indexed registration on every chain that has one. Visible to the account and admins only."
      required: [address, linkedAt, registrations]
      properties:
        address: { type: string, pattern: '^0x[0-9a-f]{40}$' }
        linkedAt: { type: string }
        registrations:
          type: array
          items:
            type: object
            required: [chain, active, registeredAt, revokedAt, graceUntil]
            properties:
              chain: { type: string }
              active: { type: boolean }
              registeredAt: { type: [integer, 'null'] }
              revokedAt: { type: [integer, 'null'] }
              graceUntil: { type: [integer, 'null'] }
    SignerKeyLinkResult:
      type: object
      required: [key, created, token]
      properties:
        key: { $ref: '#/components/schemas/SignerKeyLink' }
        created: { type: boolean }
        token: { type: string, description: a refreshed session token (its roles are informational; access is read live) }
    AttestorIdentityCheck:
      type: object
      description: "The account's attestor identity check (A-SIG-7): the provider's check id and status only, never documents or extracted data. Every field but status is null while the account has none (status not_started)."
      required: [provider, checkId, status, startedAt, updatedAt]
      properties:
        provider: { type: [string, 'null'], description: the identity provider }
        checkId: { type: [string, 'null'], description: "the provider's reference for the check" }
        redirectUrl: { type: [string, 'null'], description: "where the account completes a check just started (POST only); null when an existing check is returned" }
        status: { type: string, enum: [not_started, pending, passed, failed] }
        startedAt: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'], description: when the stored status last changed }
    SyntheticIncomeInfo:
      type: object
      required: [testOnly, notice]
      properties:
        testOnly: { type: boolean, const: true }
        notice: { type: string }
    ReportVerifierInfo:
      type: object
      description: "The report verifier a device talks to (S4 WP6): its URL, the 20-byte address of its secp256k1 key (the address each chain registers as a verifier key; GET /chains and the chains' registries are public) and the chains it signs for, each with the signing domain it holds (the device can compare it with GET /chains). Public data."
      required: [url, address, chains]
      properties:
        transport: { type: object, additionalProperties: true, description: 'Optional encrypted local-operator transport and signed encryption public key' }
        url: { type: string }
        address: { type: string, pattern: '^0x[0-9a-f]{40}$' }
        syntheticIncome: { $ref: '#/components/schemas/SyntheticIncomeInfo' }
        chains: { type: array, items: { type: object, required: [chain, domain], properties: { chain: { type: string }, domain: { $ref: '#/components/schemas/SigningDomain' } } } }
  responses:
    Unauthorized: { description: No or invalid session, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    Forbidden: { description: Session lacks the required tier, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    NotFound: { description: Not found, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
paths:
  /health:
    get:
      operationId: getHealth
      x-access: public
      tags: [public]
      parameters:
        - { name: chain, in: query, required: false, description: Check only this configured chain; omitted checks all chains., schema: { type: string } }
      responses: { '200': { description: Health, content: { application/json: { schema: { $ref: '#/components/schemas/Health' } } } } }
  /chains:
    get:
      operationId: listChains
      x-access: public
      tags: [public]
      parameters:
        - { name: chain, in: query, required: false, description: Return only this configured chain; omitted returns all chains., schema: { type: string } }
      responses: { '200': { description: Chain catalogue, content: { application/json: { schema: { $ref: '#/components/schemas/ChainCatalogue' } } } } }
  /chains/{chain}/signer-keys:
    get:
      operationId: listChainSignerKeys
      x-access: public
      tags: [public, signing]
      parameters:
        - { name: chain, in: path, required: true, schema: { type: string } }
        - { name: kind, in: query, required: true, schema: { type: string, enum: [attestor, verifier] } }
      description: "The chain's key registry for one kind of key (Stage 1's attestor and report verifier keys, S4 WP5-WP7), read live from the chain: each key's 20-byte address, whether it is active, its forward-only revocation time and the end of its grace for report and FX signatures. Public onchain data; never the account a key is linked to."
      responses:
        '200':
          description: The keys
          content:
            application/json:
              schema:
                type: object
                required: [chain, kind, keys]
                properties:
                  chain: { type: string }
                  kind: { type: string, enum: [attestor, verifier] }
                  keys: { type: array, items: { $ref: '#/components/schemas/SignerKeyRecord' } }
        '400': { description: 'kind is missing or not attestor or verifier', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '404': { $ref: '#/components/responses/NotFound' }
  /issuers:
    get:
      operationId: listIssuers
      x-access: public
      tags: [public]
      parameters: [{ $ref: '#/components/parameters/chainQuery' }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' }]
      responses: { '200': { description: Issuers, content: { application/json: { schema: { type: object, properties: { issuers: { type: array, items: { type: object } } } } } } } }
  /issuers/{issuerId}:
    get:
      operationId: getIssuer
      x-access: public
      tags: [public]
      parameters: [{ $ref: '#/components/parameters/issuerId' }]
      responses: { '200': { description: Issuer with series, content: { application/json: { schema: { type: object } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /series:
    get:
      operationId: listSeries
      x-access: public
      tags: [public]
      parameters: [{ $ref: '#/components/parameters/chainQuery' }, { name: status, in: query, schema: { type: string } }, { name: issuer, in: query, schema: { type: string } }, { $ref: '#/components/parameters/limit' }, { $ref: '#/components/parameters/offset' }]
      responses: { '200': { description: Series list, content: { application/json: { schema: { type: object, properties: { series: { type: array, items: { $ref: '#/components/schemas/Series' } } } } } } } }
  /series/{seriesId}:
    get:
      operationId: getSeries
      x-access: public
      tags: [public]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Series, content: { application/json: { schema: { $ref: '#/components/schemas/SeriesDetail' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /series/{seriesId}/auction:
    get:
      operationId: getAuction
      x-access: public
      tags: [public]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: "The chain's auction record: Stage 1's stored raise state beside the display phase, the counts, the current settlement round and its running tally, the results once finalized, where the settlement stands (stage) and the end of the current time-bound phase (null while Settling)."
      responses: { '200': { description: The auction record, content: { application/json: { schema: { $ref: '#/components/schemas/AuctionState' } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /series/{seriesId}/status:
    get:
      operationId: getSeriesStatus
      x-access: public
      tags: [public]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Status, period standings and history without amounts, content: { application/json: { schema: { type: object } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /series/{seriesId}/activity:
    get:
      operationId: getSeriesActivity
      x-access: public
      tags: [public]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { $ref: '#/components/parameters/limit' }, { name: before, in: query, schema: { type: integer } }]
      responses: { '200': { description: Activity without amounts, content: { application/json: { schema: { type: object, properties: { activity: { type: array, items: { $ref: '#/components/schemas/Activity' } } } } } } } }
  /activity:
    get:
      operationId: getActivity
      x-access: public
      tags: [public]
      parameters: [{ $ref: '#/components/parameters/chainQuery' }, { $ref: '#/components/parameters/limit' }]
      responses: { '200': { description: Global activity without amounts, content: { application/json: { schema: { type: object, properties: { activity: { type: array, items: { $ref: '#/components/schemas/Activity' } } } } } } } }
  /arena:
    get:
      operationId: getArena
      x-access: public
      tags: [public]
      responses: { '200': { description: 'Live series ranked for the landing page (raises taking bids or settling, and settled series), no amounts', content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/periods:
    get:
      operationId: getSeriesPeriods
      x-access: holder-or-issuer
      tags: [public]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Periods with amounts and the series' reporting ledger, content: { application/json: { schema: { type: object, properties: { periods: { type: array, items: { $ref: '#/components/schemas/Period' } }, reporting: { oneOf: [{ $ref: '#/components/schemas/SeriesReporting' }, { type: 'null' }] } } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /series/{seriesId}/treasury:
    get:
      operationId: getTreasury
      x-access: issuer
      tags: [public]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Treasury schedule and balances, content: { application/json: { schema: { type: object } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /series/{seriesId}/vault:
    get:
      operationId: getVault
      x-access: holder-or-issuer
      tags: [public]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: "Vault balances; dust is what the vault holds beyond every holder's claim (net payout, redemption with its tail catch-up, the tail owed including holders that have not redeemed yet, the final pool)", content: { application/json: { schema: { type: object } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /series/{seriesId}/holders:
    get:
      operationId: getHolders
      x-access: holder-or-issuer
      tags: [public]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Holder positions, content: { application/json: { schema: { type: object } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /series/{seriesId}/payouts:
    get:
      operationId: getSeriesPayouts
      x-access: holder
      tags: [public]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Payout history for the caller's wallets plus series-level payments, content: { application/json: { schema: { type: object } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /series/{seriesId}/position:
    get:
      operationId: getPosition
      x-access: holder
      tags: [public]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: "The live position of each of the caller's wallets on the series' chain, read from the chain: what each claim pays now, apart (claimable and pending for claimPayout, redemptionClaimable, tailClaimable, finalClaimable)", content: { application/json: { schema: { type: object, required: [positions], properties: { positions: { type: array, items: { $ref: '#/components/schemas/PositionView' } } } } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '403': { $ref: '#/components/responses/Forbidden' } }
  /me:
    get:
      operationId: getMe
      x-access: account
      tags: [me]
      security: [{ session: [] }]
      responses: { '200': { description: The signed-in account, content: { application/json: { schema: { type: object } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /me/holdings:
    get:
      operationId: getMyHoldings
      x-access: account
      tags: [me]
      security: [{ session: [] }]
      responses: { '200': { description: Holdings with payout history and yield only (R20), content: { application/json: { schema: { type: object, properties: { holdings: { type: array, items: { $ref: '#/components/schemas/Holding' } } } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /me/payouts:
    get:
      operationId: getMyPayouts
      x-access: account
      tags: [me]
      security: [{ session: [] }]
      responses: { '200': { description: Payouts to the caller's wallets, content: { application/json: { schema: { type: object } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /me/bids:
    get:
      operationId: getMyBids
      x-access: account
      tags: [me]
      security: [{ session: [] }]
      responses: { '200': { description: "The caller's bids with their settlement and delivery, as the chain holds them (each bid from one source: the chain's read, or the indexed row when the chain has no read of it)", content: { application/json: { schema: { type: object, properties: { bids: { type: array, items: { $ref: '#/components/schemas/Bid' } } } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /dev/time:
    get:
      operationId: devGetTime
      x-access: public
      x-dev-only: true
      tags: [dev]
      responses: { '200': { description: Simulator clocks, content: { application/json: { schema: { type: object } } } } }
  /dev/advance-time:
    post:
      operationId: devAdvanceTime
      x-access: public
      x-dev-only: true
      tags: [dev]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [seconds], properties: { seconds: { type: integer } } } } } }
      responses: { '200': { description: New simulator clocks, content: { application/json: { schema: { type: object } } } } }
  /dev/faucet:
    post:
      operationId: devFaucet
      x-access: public
      x-dev-only: true
      tags: [dev]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [chain, wallet, stablecoin, amount], properties: { chain: { type: string }, wallet: { type: string }, stablecoin: { type: string, enum: [USDC, USDG] }, amount: { $ref: '#/components/schemas/Money' } } } } } }
      responses: { '200': { description: New balance, content: { application/json: { schema: { type: object } } } } }

  # ---- E2 identity, sign-in, onboarding
  /auth/nonce:
    post:
      operationId: authNonce
      x-access: public
      tags: [auth]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [chain, address], properties: { chain: { type: string }, address: { type: string } } } } } }
      responses: { '200': { description: A nonce and the exact message to sign, content: { application/json: { schema: { type: object, properties: { nonce: { type: string }, message: { type: string }, expiresAt: { type: string } } } } } } }
  /auth/verify:
    post:
      operationId: authVerify
      x-access: public
      tags: [auth]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [chain, address, message, signature], properties: { chain: { type: string }, address: { type: string }, message: { type: string }, signature: { type: string } } } } } }
      description: "Sign in with a wallet: the message and nonce from POST /auth/nonce, signed by the wallet. Only a sign-in nonce is accepted (a key-link challenge is refused: 401). A sign-in never links an attestor key, even an EVM wallet at a key's address (POST /me/signer-keys does)."
      responses: { '200': { description: Session token, content: { application/json: { schema: { type: object, properties: { token: { type: string }, account: { type: object }, created: { type: boolean } } } } } }, '401': { $ref: '#/components/responses/Unauthorized' } }
  /me/wallets/link:
    post:
      operationId: linkWallet
      x-access: account
      tags: [auth]
      security: [{ session: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [chain, address, message, signature], properties: { chain: { type: string }, address: { type: string }, message: { type: string }, signature: { type: string } } } } } }
      responses: { '200': { description: Updated session token, content: { application/json: { schema: { type: object } } } }, '401': { $ref: '#/components/responses/Unauthorized' }, '409': { description: Wallet belongs to another account } }
  /me/signer-keys/challenge:
    post:
      operationId: signerKeyChallenge
      x-access: account
      tags: [auth]
      security: [{ session: [] }]
      description: "Step one of linking an attestor key to the account (S4 WP7, D4): a one-time EIP-191 text bound to this host, the account, the key (shown EIP-55), the nonce and the issue time, which says it links a key and is not an attestation and moves no funds. Chain-neutral (a key is the attestor on every chain that registers it), valid 10 minutes, for the link route only: sign-in refuses it. Says nothing about the key."
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [address], properties: { address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "the key's 20-byte address (any case)" } } } } } }
      responses:
        '200': { description: The challenge, content: { application/json: { schema: { type: object, required: [nonce, message, expiresAt], properties: { nonce: { type: string, pattern: '^[0-9a-f]{32}$' }, message: { type: string, description: the exact text to sign with personal_sign (EIP-191) }, expiresAt: { type: string } } } } } }
        '400': { description: Not a 20-byte address, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The session's account does not exist, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'The zero address (detail.reason zero-address)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /me/signer-keys:
    post:
      operationId: linkSignerKey
      x-access: account
      tags: [auth]
      security: [{ session: [] }]
      description: "Step two: the key's EIP-191 signature (personal_sign: MetaMask, a hardware wallet, `cast wallet sign`, the Merces attestor tool) of the challenge links the key to the account. Checked with viem's verifyMessage; a simulator (sim:) signature is never accepted, in any mode. The challenge must be a key-link challenge (a sign-in nonce is refused) issued to this account for this key, unexpired and unused, and is spent once. A key belongs to one account. Linking grants nothing by itself: attestor access needs the key registered and indexed on the item's chain (A-M5-2). The link is visible to the account and to admins only."
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [address, nonce, signature], properties: { address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }, nonce: { type: string, pattern: '^[0-9a-f]{32}$' }, signature: { type: string, description: 65 bytes r ‖ s ‖ v as 0x hex (EIP-191) } } } } } }
      responses:
        '200': { description: 'The key was already linked to this account: nothing changed (created false)', content: { application/json: { schema: { $ref: '#/components/schemas/SignerKeyLinkResult' } } } }
        '201': { description: 'Linked (created true): the key with its registrations and a refreshed session token', content: { application/json: { schema: { $ref: '#/components/schemas/SignerKeyLinkResult' } } } }
        '400': { description: Malformed body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { description: 'The challenge was already used (detail.reason challenge-used: a replay), or the key is linked to another account (detail.reason key-linked-to-another-account)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'No such key-link challenge for this account and key, a sign-in nonce included (detail.reason unknown-challenge); expired (challenge-expired); or not the key''s EIP-191 signature of it (bad-signature)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: listMySignerKeys
      x-access: account
      tags: [auth]
      security: [{ session: [] }]
      responses:
        '200': { description: "The attestor keys linked to the caller's account, each with its indexed registration on every chain that has one", content: { application/json: { schema: { type: object, required: [keys], properties: { keys: { type: array, items: { $ref: '#/components/schemas/SignerKeyLink' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/signer-keys/{address}:
    delete:
      operationId: unlinkSignerKey
      x-access: account
      tags: [auth]
      security: [{ session: [] }]
      parameters: [{ name: address, in: path, required: true, schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' } }]
      description: "Unlink one of the account's keys: the account's attestor access through it ends at once. Refused while work addressed to the key is open."
      responses:
        '200': { description: Unlinked, content: { application/json: { schema: { type: object, required: [address, unlinked], properties: { address: { type: string }, unlinked: { type: boolean, const: true } } } } } }
        '400': { description: Not a 20-byte address, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The key is not linked to this account, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: 'Work addressed to the key is open (detail.reason open-work, detail.openWork the counts: pending hardship requests, open tier-3 cases and annual attestations, open extinguishment requests naming it (collecting signatures or awaiting the relay; S4 WP12), attested amendments not landed)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /me/attestor/identity-check:
    post:
      operationId: startAttestorIdentityCheck
      x-access: account
      tags: [auth]
      security: [{ session: [] }]
      description: "Start the caller's attestor identity check with the identity provider (the owner's decision, A-SIG-7: an attestor key is registered only for a separately verified account). Returns the provider's check id, the URL to complete it at and its status. Idempotent: an account with a passed check gets it back (redirectUrl null), one with a pending check gets its refreshed status (redirectUrl null), one with a failed check starts again. Only the provider's check id and status are stored, never documents or extracted data. The admin's POST /admin/attestors and /admin/attestors/rotate of a key linked to the account answer 409 identity-not-verified until the status is passed."
      responses:
        '200': { description: The check (status passed, pending or failed), content: { application/json: { schema: { $ref: '#/components/schemas/AttestorIdentityCheck' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: The session's account does not exist, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: getAttestorIdentityCheck
      x-access: account
      tags: [auth]
      security: [{ session: [] }]
      description: "The caller's attestor identity check as the provider reports it now (a pending one is refreshed on read), or status not_started with every other field null. Visible to the account; an admin sees the status beside each key in GET /admin/attestors."
      responses:
        '200': { description: The check, or not_started, content: { application/json: { schema: { $ref: '#/components/schemas/AttestorIdentityCheck' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
