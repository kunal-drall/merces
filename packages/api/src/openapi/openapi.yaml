  /attestor/amendments/{amendmentId}/message:
    get:
      operationId: amendmentSigningRequest
      x-access: attestor
      tags: [attestor, signing]
      security: [{ session: [] }]
      parameters:
        - { name: amendmentId, in: path, required: true, schema: { type: string } }
        - { name: attestor, in: query, required: true, schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }, description: "the attestor key that will sign (a secp256k1 key's 20-byte address, linked to the caller's account and active on the series' chain)" }
      description: "The signing request for the amendment's AMEND signature (S4 WP11): Stage 1's MERCES_AMEND_V1 over the chain's signing domain (ChainInfo.signing), the series key (SeriesState.seriesKey), the series' live amendment nonce (SeriesState.nonces.amendment), the new terms commitment and the new cap multiple, addressed to the key, only for a proposed amendment that is issuer-favourable on the private terms and that the chain would take now (not terminal; the cap a u64, not above the live cap, within [2, 3]). The attestor signs it on their own device with the Merces attestor tool, which rebuilds and checks it first; the API never signs. An admin may read it (public data only: the domain, the series key, the nonce, the commitment and the cap) but never decides."
      responses:
        '200': { description: The AMEND signing request, content: { application/json: { schema: { $ref: '#/components/schemas/SigningRequest' } } } }
        '400': { description: A missing or malformed query field }
        '403': { description: "The key is not linked to the caller's account (an admin reads any)" }
        '404': { description: Unknown amendment or series }
        '409': { description: "The amendment is not proposed (attested, built, applied or rejected); the series is terminal (detail.stage1 AmendmentAfterTerminal); the chain's signing domain is not known yet (detail.reason signing-domain-unknown) or is not one a signer may sign for (detail.reason signing-network-refused)" }
        '422': { description: "Not issuer-favourable; the key is not a registered attestor on the series' chain; the cap above the live cap or outside [2, 3] (detail.stage1 UnfavourableAmendment)" }
  /attestor/amendments/{amendmentId}/attest:
    post:
      operationId: attestAmendment
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      parameters: [{ name: amendmentId, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [approve, amendmentNonce, attestation]
                  properties:
                    approve: { type: boolean, enum: [true] }
                    amendmentNonce: { type: string, pattern: '^(0|[1-9][0-9]{0,19})$', description: "the nonce the signature binds: the signing request's fields.amendmentNonce" }
                    attestation: { $ref: '#/components/schemas/DeviceSignature' }
                - type: object
                  additionalProperties: false
                  required: [approve, attestor]
                  properties:
                    approve: { type: boolean, enum: [false] }
                    attestor: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "the attestor key the attestor acts with (linked to the caller's account and active on the series' chain)" }
                    decisionCode: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$', description: rejection code (never free text) }
      description: "Only the account holding an attestor key registered on the series' chain decides (an admin never does; A-M5-3). An approval carries the key's Stage 1 AMEND signature, made on the attestor's own device from GET /attestor/amendments/{amendmentId}/message (S4 WP11; was {attestor, approve} with the key co-signing the issuer's transaction). The API checks, in order: the amendment is proposed and the key (attestation.signer) acts for the caller; the new private terms are issuer-favourable (θ rises, r does not); the chain's own checks on the live series (not terminal; the cap a u64, not above the live cap and within [2, 3]); the signature over the AMEND message it rebuilds from the chain's reads with the signed nonce (a digest sent must equal it) recovers to the key, an active attestor key (no grace); the series' amendment nonce read again is still the one signed. The amendment then records the key, the nonce, the digest and the signature for the issuer's amendTerms; the signature appears in the issuer's built transaction only (never in a list, the feed, a notification or the audit log). A rejection needs no signature."
      responses: { '200': { description: 'Attested: {amendmentId, state attested, favourable, attestor, amendmentNonce, digest}. Rejected: {amendmentId, state rejected, favourable, attestor, decisionCode}', content: { application/json: { schema: { type: object } } } }, '400': { description: 'Malformed or unknown fields (the earlier {attestor, approve} approval and the attestorWallet field included)' }, '403': { description: "The attestor key is not linked to the caller's account" }, '409': { description: "Already decided; the series is terminal (detail.stage1 AmendmentAfterTerminal); the series' amendment nonce moved since the signature was made, by another amendment (detail.reason stale-nonce, with detail.liveAmendmentNonce and detail.request, the fresh signing request); the chain's signing domain unknown (detail.reason signing-domain-unknown)" }, '422': { description: "Not issuer-favourable, or the key is not a registered attestor on the series' chain; the cap above the live cap or outside [2, 3] (detail.stage1 UnfavourableAmendment); the signature not the key's AMEND signature over this nonce, commitment and cap on this chain, or the key not active (detail.stage1 InvalidAttestorSignature)" } }
  /amendments/{amendmentId}/build:
    post:
      operationId: buildAmendTerms
      x-access: issuer
      tags: [terms]
      security: [{ session: [] }]
      parameters: [{ name: amendmentId, in: path, required: true, schema: { type: string } }]
      description: "The issuer's amendTerms for an attested amendment (S4 WP11): Stage 1's amend_terms carrying the attestor key's AMEND signature as an argument; the issuer signs it alone (nobody co-signs). Built again while it is built and not yet landed. Before building it reads the chain: an amendment that already landed is 409 already-amended; a terminal series 409 AmendmentAfterTerminal; a series' amendment nonce that moved since the signature (another amendment landed) or a key no longer active makes the signature dead, and the amendment goes back to awaiting an attestor (state proposed, decisionCode stale-nonce or attestor-key-inactive)."
      responses: { '200': { description: Unsigned amendTerms transaction (the issuer signs; its command carries the attestor key and its AMEND signature), content: { application/json: { schema: { type: object } } } }, '403': { description: Not the issuer's amendment }, '409': { description: "Not attested yet; already landed (detail.reason already-amended: apply it); the series is terminal (detail.stage1 AmendmentAfterTerminal); the signature is dead: detail.reason stale-nonce (with detail.liveAmendmentNonce) or attestor-key-inactive (detail.stage1 InvalidAttestorSignature), and the amendment awaits an attestor again" } }
  /amendments/{amendmentId}/apply:
    post:
      operationId: applyAmendment
      x-access: issuer
      tags: [terms]
      security: [{ session: [] }]
      parameters: [{ name: amendmentId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Vault rotated to the new terms once the chain carries the new commitment, content: { application/json: { schema: { type: object } } } }, '409': { description: Chain does not carry the new commitment yet } }
  /tx/send:
    post:
      operationId: sendSignedTx
      x-access: account
      tags: [tx]
      security: [{ session: [] }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [tx, signatures], properties: { tx: { type: object }, signatures: { type: object } } } } } }
      responses: { '200': { description: Transaction result with the canonical events it emitted, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Forbidden' }, '422': { description: Chain rejected the transaction } }

  # ---- E5 ProofOfIncome
  /prover/artifacts:
    get:
      operationId: getProverArtifacts
      x-access: public
      tags: [reporting]
      responses: { '200': { description: 'Stage 1''s ProofOfIncome circuit: the public input layout, the verification key, the wasm and zkey URLs with their sha256 (checked against the Stage 1 build manifest), the proof systems this API accepts, and the warning that the zkey comes from a development trusted setup (never mainnet)', content: { application/json: { schema: { type: object } } } } }
  /prover/report.wasm:
    get:
      operationId: getProverWasm
      x-access: public
      tags: [reporting]
      responses: { '200': { description: 'The circuit''s witness calculator (Stage 1 build); header x-content-sha256 carries its sha256', content: { application/wasm: { schema: { type: string, format: binary } } } } }
  /prover/report.zkey:
    get:
      operationId: getProverZkey
      x-access: public
      tags: [reporting]
      responses: { '200': { description: 'The proving key (Stage 1 development trusted setup; never mainnet); header x-content-sha256 carries its sha256', content: { application/octet-stream: { schema: { type: string, format: binary } } } } }
  /income-sources:
    get:
      operationId: listIncomeSources
      x-access: public
      tags: [reporting]
      responses: { '200': { description: Supported tier-2 sources and their zkTLS provider definitions (Stripe, Deel, DistroKid), content: { application/json: { schema: { type: object } } } } }
  /reporting/verifier:
    get:
      operationId: getReportVerifier
      x-access: public
      tags: [reporting]
      responses: { '200': { description: "Where devices send zkTLS proofs, the verifier key's address and the chains it signs for", content: { application/json: { schema: { $ref: '#/components/schemas/ReportVerifierInfo' } } } } }
  /series/{seriesId}/reporting/schedule:
    get:
      operationId: getReportingSchedule
      x-access: issuer
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Reportable quarters with deadlines, standings and next steps, content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/reporting/prior:
    get:
      operationId: getReportingPrior
      x-access: public
      tags: [reporting]
      description: 'The prior income commitment the chain will require for a period''s report (SPEC §6.2 step 5), from the series'' public reporting ledger: chained (the previous quarter''s income commitment, same year), year-start (ZERO = Poseidon(2)(0, 0)), or first-report-outside-q1 (A25: the chain accepts the prior as given; the verifier attestation binds it). Commitments only.'
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: periodId, in: query, required: false, schema: { type: string, pattern: '^\d{4}Q[1-4]$' }, description: defaults to the next expected period }]
      responses:
        '200':
          description: The expected prior
          content:
            application/json:
              schema:
                type: object
                properties:
                  seriesId: { type: string }
                  periodId: { type: string }
                  nextExpectedPeriod: { type: [string, 'null'] }
                  rule: { type: string, enum: [chained, year-start, first-report-outside-q1] }
                  expectedPriorIncomeCommitment: { oneOf: [{ $ref: '#/components/schemas/Hash32' }, { type: 'null' }] }
                  acceptsSuppliedPrior: { type: boolean }
                  chainedFrom: { type: [string, 'null'] }
                  note: { type: string }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The raise has not settled }
  /series/{seriesId}/reporting/fx/{periodId}:
    get:
      operationId: getReportingFx
      x-access: issuer
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: periodId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: FX basis for the quarter (unity, accumulator average, or attestor fallback), content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/reporting/zktls-session:
    post:
      operationId: createZkTlsSession
      x-access: issuer
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [periodId, source], properties: { periodId: { type: string }, source: { type: string, enum: [stripe, deel, distrokid] } } } } } }
      responses: { '200': { description: zkTLS request URL; the proof goes straight to the report verifier, content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/reports:
    post:
      operationId: assembleReport
      x-access: issuer
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      description: 'The device''s assembled report: commitments, the payment and the proof (never an income figure, a salt or an opening; unknown fields are refused). The API checks what the chain will check: the next expected period, no unpaid due, on a curve series a census taken after the period ended (the proof is over it), the prior chain, the six public inputs against the series'' live terms commitment, units and FX basis, the proof (Stage 1 Groth16), the tier-2 verifier attestation (Stage 1''s REPORT signature rebuilt from the chain''s signing domain and the series key, recovered to its signer, a verifier key the chain holds usable for the period: active, or revoked after the period ended within the 45-day grace; S4 WP6), or for tier 3 the chosen attestor''s signed case, whose Stage 1 REPORT signature (tier 3, an attestor key usable for the period with the same grace) the service carries into the report itself (S4 WP9). When the FX fallback is in force the service carries this series'' stored FX signature (an attestor key''s Stage 1 FX signature over the series key, the period and the rate, GET /series/{seriesId}/reporting/fx-fallback/{periodId}) and the rate it signed. Nobody co-signs: the issuer sends the report alone.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [periodId, tier, source, paymentStable, priorIncomeCommitment, incomeCommitment, proof]
              additionalProperties: false
              properties:
                seriesId: { type: string, description: optional; must be the series in the path }
                periodId: { type: string, pattern: '^\d{4}Q[1-4]$' }
                tier: { type: integer, enum: [1, 2, 3, 4] }
                source: { type: string, description: the income source (kept offchain; shown to the issuer only) }
                paymentStable: { $ref: '#/components/schemas/Money' }
                priorIncomeCommitment: { $ref: '#/components/schemas/Hash32' }
                incomeCommitment: { $ref: '#/components/schemas/Hash32' }
                proof: { $ref: '#/components/schemas/ReportProof' }
                attestation: { oneOf: [{ $ref: '#/components/schemas/Attestation' }, { type: 'null' }], description: "tier 2: the signer and signature of the report verifier's record (ReportAttestationRecord). Tier 3: optional; the service carries the attestor's signature stored with the signed case, and one sent must be that one (S4 WP9). Ignored for tiers 1 and 4" }
                liquidityEvent: { type: boolean }
      responses: { '201': { description: Report verified offchain and stored (commitments, amounts, proof), with the unsigned submitReport transaction, content: { application/json: { schema: { type: object } } } }, '400': { description: Malformed or unknown fields }, '409': { description: 'Period not ended, already reported, not the next expected period (detail.stage1 WrongPeriod), a previous due unpaid (detail.stage1 PaymentOutstanding); on a curve series a census older than the period end (detail.stage1 CurveUnitsNotSynced, detail.next the sync step) or a proof over another count than the census (detail.reason census-changed: prove again); a tier-2 or tier-3 report, or an FX fallback, on a chain whose signing domain is not known yet (detail.reason signing-domain-unknown)' }, '422': { description: 'Proof, attestation (detail.stage1 InvalidVerifierSignature for tier 2, InvalidAttestorSignature for tier 3), prior, public inputs or FX basis rejected; no signed tier-3 case for these commitments; the FX fallback in force with no FX signature stored for this series, or one the chain would refuse (detail.stage1 InvalidAttestorSignature)' } }
    get:
      operationId: listReports
      x-access: holder-or-issuer
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Reports (commitments, amounts, statuses), content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/reporting/splits/{periodId}:
    get:
      operationId: getSplitReceipts
      x-access: issuer
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: periodId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Tier-1 router receipts indexed for the period, content: { application/json: { schema: { type: object } } } } }
  /reports/{reportId}:
    get:
      operationId: getReport
      x-access: account
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ name: reportId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: Report, content: { application/json: { schema: { type: object } } } }, '403': { $ref: '#/components/responses/Forbidden' } }
  /reports/{reportId}/build-submit:
    post:
      operationId: buildSubmitReport
      x-access: account
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ name: reportId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'Unsigned submitReport transaction for the issuer alone, carrying the stored signatures (the tier-2 or tier-3 attestation, the FX fallback); nobody co-signs (S4 WP9)', content: { application/json: { schema: { type: object } } } }, '409': { description: 'On a curve series the census is older than the period end (detail.stage1 CurveUnitsNotSynced: sync first) or changed since the report was assembled (detail.reason census-changed: prove again and re-assemble); the chain would refuse the transaction; a report assembled before S4 WP6 or WP9 with an attestation or FX rate the chains no longer take (detail.reason attestation-superseded: assemble it again)' } }
  /reports/{reportId}/submitted:
    post:
      operationId: markReportSubmitted
      x-access: account
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ name: reportId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [txId], properties: { txId: { type: string } } } } } }
      responses: { '200': { description: Report state refreshed from the chain, content: { application/json: { schema: { type: object } } } } }
  /reports/{reportId}/build-payin:
    post:
      operationId: buildPayIn
      x-access: account
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ name: reportId, in: path, required: true, schema: { type: string } }]
      responses:
        '200':
          description: "Unsigned payIn of the series' open due (Stage 1 pay: periodId = openDuePeriod) for the live amount the chain demands now: the open due plus Stage 1's lateness accrual on a regular period, the due as reported on a tail period. Accrual grows by whole late days, so rebuild a transaction that was not sent the same day."
          content:
            application/json:
              schema:
                type: object
                required: [tx, periodId, amount, accrual]
                properties:
                  tx: { type: object }
                  periodId: { type: string, pattern: '^\d{4}Q[1-4]$' }
                  amount: { $ref: '#/components/schemas/Money' }
                  accrual: { $ref: '#/components/schemas/Money' }
        '409': { description: 'Not accepted onchain yet, already paid, or nothing due (detail.stage1 NothingDue)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /reports/{reportId}/paid:
    post:
      operationId: markReportPaid
      x-access: account
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ name: reportId, in: path, required: true, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [txId], properties: { txId: { type: string } } } } } }
      responses: { '200': { description: Report marked paid once the chain shows the period settled, content: { application/json: { schema: { type: object } } } } }

  # ---- E6 auction service
  /series/{seriesId}/bids/precheck:
    post:
      operationId: precheckBid
      x-access: backer
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bidder, pricePerUnit, quantity], properties: { bidder: { type: string }, pricePerUnit: { $ref: '#/components/schemas/Money' }, quantity: { type: string } } } } } }
      description: "Checks a bid before it is built: the commit phase, the allowlist, one bid per wallet, Stage 1's validity rule (reserve, 1 ≤ quantity ≤ the wallet cap; a bid that breaks it can be committed but is invalid at reveal and refunded in full), the u64 range and the balance; returns the deposit a commit locks (Stage 1 requiredEscrow: price × quantity plus the auction fee on it) and what the bid pays if it is never revealed and the raise settles: the series' non-reveal charge on that deposit (nonRevealChargeBps, nonRevealCharge = floor(deposit × nonRevealChargeBps / 10000), Stage 1 processBid; nothing if the raise fails)."
      responses: { '200': { description: 'The issues (empty = ok), the deposit, the wallet cap in units, the fee, the non-reveal charge (rate and amount on this deposit) and the phase ends', content: { application/json: { schema: { type: object } } } }, '409': { description: 'A curve-mode series runs no sealed-bid raise (detail.stage1 NotSealedBid)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /series/{seriesId}/bids/commitment:
    post:
      operationId: computeBidCommitment
      x-access: backer
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: "Stage 1's bid commitment, keccak256(price_u64 ‖ quantity_u64 ‖ salt_32 ‖ wallet_32) (SPEC §1.3; S4, A-SIG-8), the wallet being the bidder's 32-byte form (a Solana pubkey as-is, an EVM address left-padded). It binds neither the series nor the raise: draw a fresh 32-byte salt for every bid. Nothing is stored; prefer computing it client-side."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bidder, pricePerUnit, quantity, salt], properties: { bidder: { type: string, description: "an address of the series' chain" }, pricePerUnit: { type: string }, quantity: { type: string }, salt: { type: string, description: '32 bytes as 0x + 64 hex, fresh for every bid' } } } } } }
      responses: { '200': { description: The commitment hash (nothing stored; prefer computing it client-side), content: { application/json: { schema: { type: object } } } }, '400': { description: "The bidder is not an address of the series' chain" }, '422': { description: 'The salt is not 32 bytes, or the price or quantity is outside u64 (detail.stage1 AmountOutOfRange); no value is named' } }
  /series/{seriesId}/bids/build-commit:
    post:
      operationId: buildCommitBid
      x-access: backer
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bidder, commitment, deposit], properties: { bidder: { type: string }, commitment: { type: string }, deposit: { $ref: '#/components/schemas/Money' } } } } } }
      responses: { '200': { description: Unsigned commitBid transaction, content: { application/json: { schema: { type: object } } } }, '409': { description: 'A curve-mode series runs no sealed-bid raise (detail.stage1 NotSealedBid)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /series/{seriesId}/bids/build-reveal:
    post:
      operationId: buildRevealBid
      x-access: backer
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bidder, pricePerUnit, quantity, salt], properties: { bidder: { type: string }, pricePerUnit: { type: string }, quantity: { type: string }, salt: { type: string } } } } } }
      responses: { '200': { description: Unsigned revealBid transaction (values checked against the commitment), content: { application/json: { schema: { type: object } } } }, '422': { description: Values do not match the committed bid }, '409': { description: 'A curve-mode series runs no sealed-bid raise (detail.stage1 NotSealedBid)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
  /series/{seriesId}/bids/build-deliver:
    post:
      operationId: buildDeliverBid
      x-access: account
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: "Builds Stage 1's deliver_bid for a processed, undelivered bid: it pays the bidder its refund and its units. The keepers deliver every bid; this is the bidder's \"deliver now\", or anyone's when the keepers stall (delivery is permissionless and always pays the bidder). `signer` defaults to the bidder and must be one of the caller's wallets."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bidder], properties: { bidder: { type: string }, signer: { type: string, description: 'the wallet that signs and sends it (default: the bidder)' } } } } } }
      responses:
        '200': { description: The unsigned deliverBid and what it delivers, content: { application/json: { schema: { type: object, properties: { tx: { $ref: '#/components/schemas/UnsignedTx' }, pendingUnits: { type: string }, pendingRefund: { $ref: '#/components/schemas/Money' } } } } } }
        '403': { description: The signer is not one of the caller's wallets }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The bid is not processed yet (detail.stage1 NotProcessed) or already delivered (AlreadyDelivered); a curve-mode series (NotSealedBid)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /series/{seriesId}/auction/build-step:
    post:
      operationId: buildSettlementStep
      x-access: account
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: "Builds the next step of a sealed raise's settlement for `signer` (one of the caller's wallets), with the planner the keepers use: after the reveal end the honest proposal (beginSettlement), the tally pages, finalizeSettlement, a processBid per bid, then a deliverBid per bid. Every step is permissionless; sign it, relay it with POST /tx/send and ask again. Use it when the keepers stall, or to settle a raise with no bid before the keepers' 24-hour grace ends."
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [signer], properties: { signer: { type: string } } } } } }
      responses:
        '200': { description: The next step, content: { application/json: { schema: { $ref: '#/components/schemas/SettlementStep' } } } }
        '403': { description: The signer is not one of the caller's wallets }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'No step to build: detail is a SettlementStepRefusal (wait, done or a stuck code); a curve-mode series, which has no auction, is refused with detail.stage1 NotSealedBid', content: { application/json: { schema: { allOf: [{ $ref: '#/components/schemas/Error' }, { type: object, properties: { detail: { oneOf: [{ $ref: '#/components/schemas/SettlementStepRefusal' }, { type: object, properties: { stage1: { type: string, const: NotSealedBid } } }] } } }] } } } }
  /series/{seriesId}/raise/build-open:
    post:
      operationId: buildOpenRaise
      x-access: issuer
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: "Builds the issuer's openRaise (Stage 1 open_raise, or activate_curve for a native Solana curve with a configured pool). The chain sets the commit end to now + the series' commit duration and the reveal end to the commit end + its reveal duration. Stage 1's checks run first, in its order."
      responses:
        '200': { description: The unsigned openRaise and the phase durations it will apply, content: { application/json: { schema: { type: object, properties: { tx: { $ref: '#/components/schemas/UnsignedTx' }, commitDurationSeconds: { type: integer }, revealDurationSeconds: { type: integer } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Refused, with detail.stage1: RaiseNotDraft, ContractHashMissing, NotAllowlisted (the issuer) or NewRaisesPaused', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /series/{seriesId}/raise/build-cancel:
    post:
      operationId: buildCancelRaise
      x-access: issuer
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: "Builds the issuer's cancelRaise (Stage 1 cancel_raise): an Open sealed raise that has no bid, at any time (also after its reveal end). A curve raise has no cancel (no failure and no deadline either): 409 NotSealedBid."
      responses:
        '200': { description: The unsigned cancelRaise, content: { application/json: { schema: { type: object, properties: { tx: { $ref: '#/components/schemas/UnsignedTx' } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'Refused, with detail.stage1: NotSealedBid (a curve-mode series), RaiseNotOpen or BidsExist', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /series/{seriesId}/bids/backup:
    put:
      operationId: putBidBackup
      x-access: backer
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [bidder, ciphertext], properties: { bidder: { type: string }, ciphertext: { type: string }, keyHint: { type: [string, 'null'] } } } } } }
      responses: { '200': { description: Client-encrypted reveal backup stored (the server cannot read it), content: { application/json: { schema: { type: object } } } }, '400': { description: Plaintext bid fields detected } }
  /series/{seriesId}/bids/backup/{bidder}:
    get:
      operationId: getBidBackup
      x-access: account
      tags: [bids]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: bidder, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: The backup ciphertext, content: { application/json: { schema: { type: object } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /series/{seriesId}/auction/preview:
    get:
      operationId: getAuctionPreview
      x-access: public
      tags: [bids]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: "The settlement Stage 1 would reach on the revealed bids (public onchain once revealed), with Stage 1's math: the honest proposal, the outcome (a raise that would sell no unit fails, as SPEC and both chains do) and each revealed bid's processing. Every revealed bid counts, its bidder still allowlisted or not, as the settlement does. Projected while the raise is Open or Settling; null when no single clearing price exists. `stage` is where the settlement stands; `settleDue` is stage = awaiting-proposal."
      responses: { '200': { description: 'The stage, the counts, the projection (or null) and the settled result', content: { application/json: { schema: { type: object, properties: { seriesId: { type: string }, phase: { type: string }, stage: { $ref: '#/components/schemas/SettlementStage' }, bidCount: { type: integer }, revealedCount: { type: integer }, validCount: { type: integer }, settleDue: { type: boolean }, projected: { type: [object, 'null'] }, settled: { type: [object, 'null'] } } } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: 'A curve-mode series runs no sealed-bid raise (detail.stage1 NotSealedBid)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } } }
