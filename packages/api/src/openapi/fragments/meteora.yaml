tags:
  - { name: curve, description: Meteora curve-mode raises (E14, Solana only) }
paths:
  /series/{seriesId}/curve:
    get:
      operationId: getCurveStatus
      x-access: public
      tags: [curve]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: 'Curve progress, spot price, graduation state, no cap (a curve raise has no wallet cap at any stage) and the plain notice', content: { application/json: { schema: { $ref: '#/components/schemas/CurveNoCap' } } } }, '404': { $ref: '#/components/responses/NotFound' }, '409': { description: Not a curve-mode series } }
  /series/{seriesId}/curve/configure:
    post:
      operationId: configureCurve
      x-access: issuer
      tags: [curve]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Config generated through the Meteora port (Stage 1's oracle-driven generator) and stored, with no cap and the notice, content: { application/json: { schema: { $ref: '#/components/schemas/CurveNoCap' } } } } }
  /series/{seriesId}/curve/build-buy:
    post:
      operationId: buildCurveBuy
      x-access: backer
      tags: [curve]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [buyer, amountIn], properties: { buyer: { type: string }, amountIn: { $ref: '#/components/schemas/Money' }, payIn: { type: string, enum: [USDC, USDG] }, slippageBps: { type: integer } } } } } }
      responses:
        '200': { description: 'Curve quote, minimum units out, an unsigned buy transaction and, when paying in USDG, the swap route to sign first; no cap (a wallet buys any amount, whatever it holds) and the notice', content: { application/json: { schema: { $ref: '#/components/schemas/CurveNoCap' } } } }
        '403': { description: Not an eligible backer, the wallet is not linked to the caller, or it is not on the chain's allowlist }
        '409': { description: 'The curve graduated (buy on the DEX pool), or the series or raise is closed' }
        '422': { description: 'Not a Solana series; stablecoin unavailable' }
  /admin/curves/monitor:
    post:
      operationId: monitorCurves
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      responses: { '200': { description: Graduation check across curve-mode series; cranks graduation when the threshold is crossed, content: { application/json: { schema: { type: object } } } } }
components:
  schemas:
    CurveNoCap:
      type: object
      description: 'What every curve read and builder response says about the cap: a curve raise has no wallet cap at any stage, before or after the curve fills (owner direction; Stage 1 stores the curve series'' wallet cap as 0 and enforces none). The other fields depend on the operation.'
      required: [walletCap, noCap, noCapStatement, notice]
      additionalProperties: true
      properties:
        walletCap: { type: 'null', description: 'always null (there is no wallet cap)' }
        noCap: { type: boolean, const: true }
        noCapStatement: { type: string, description: the one no-cap statement }
        notice: { type: string, description: the plain-language notice for curve buyers }
