# Request fields accepted by services/src/terms/service.ts publicTermsSchema.
# These describe existing validation; no protocol or service behaviour changes here.
components:
  schemas:
    PublicDraftTerms:
      type: object
      required: [stablecoin, unitsOffered, reservePrice, minimumRaise, tierFlags, reportingCurrency, country]
      properties:
        routerPublicConsent: { type: boolean, default: false, description: 'Required true for tier 1: publishes the threshold, share rate and routed receipts onchain.' }
        fxPairId: { type: [string, 'null'], pattern: '^0x[0-9a-f]{64}$', default: null }
        stablecoin: { type: string, enum: [USDC, USDG] }
        unitsOffered: { type: string, pattern: '^\d+$' }
        reservePrice: { type: string, pattern: '^\d+$' }
        minimumRaise: { type: string, pattern: '^\d+$' }
        capMultiple: { type: string, pattern: '^\d+(\.\d{1,18})?$' }
        lockupSeconds: { type: integer, minimum: 0 }
        releaseSchedule:
          type: array
          minItems: 1
          items: { type: object, required: [afterSeconds, bps], properties: { afterSeconds: { type: integer, minimum: 0 }, bps: { type: integer, minimum: 1 } } }
        hurdle: { type: string, pattern: '^\d+(\.\d{1,18})?$' }
        payoutMultipleK: { type: integer, minimum: 1 }
        windowCommitDuration: { type: integer, minimum: 0 }
        windowRevealDuration: { type: integer, minimum: 0 }
        windowFeeBps: { type: integer, minimum: 0 }
        tierFlags:
          type: object
          required: [tier1, tier2, tier3]
          properties: { tier1: { type: boolean }, tier2: { type: boolean }, tier3: { type: boolean }, tier4: { type: boolean, default: false } }
        reportingCurrency: { type: string, pattern: '^[A-Z]{3}$' }
        raiseStyle: { type: string, enum: [sealed, curve], default: sealed }
        country: { type: string, minLength: 2, maxLength: 2 }
