# E12 notifications: per-account inbox and preferences (statuses, never reasons); admin visibility of the outbox and the mock email channel.
tags:
  - { name: notifications, description: Inbox and notification preferences (E12). Bodies carry statuses, dates, series and period ids only. }
components:
  schemas:
    Notification:
      type: object
      required: [notificationId, kind, subject, body, data, createdAt, readAt]
      properties:
        notificationId: { type: string }
        kind: { type: string, description: the outbox payload kind, e.g. reporting.report-due }
        subject: { type: string }
        body: { type: string, description: statuses, dates, series ids and period ids only; never a reason or an amount }
        data: { type: object, description: whitelisted payload keys (ids, statuses, unix-second dates), additionalProperties: { type: [string, integer] } }
        createdAt: { type: string, format: date-time }
        readAt: { type: [string, 'null'], format: date-time }
    NotificationList:
      type: object
      required: [notifications, unreadCount]
      properties:
        notifications: { type: array, items: { $ref: '#/components/schemas/Notification' } }
        unreadCount: { type: integer }
    NotificationPreferences:
      type: object
      required: [email, mutedKinds, emailAddress, channel, knownKinds]
      properties:
        email: { type: boolean, description: send emails for notifications that are not muted }
        mutedKinds: { type: array, items: { type: string } }
        emailAddress: { type: [string, 'null'], format: email, description: the account's own address (accounts.email); never shown to other users }
        channel: { type: string, description: the configured channel, e.g. mock-email }
        updatedAt: { type: [string, 'null'], format: date-time }
        knownKinds: { type: array, items: { type: string }, description: kinds with a dedicated template }
    NotificationPreferencesUpdate:
      type: object
      required: [email, mutedKinds]
      properties:
        email: { type: boolean }
        mutedKinds: { type: array, maxItems: 200, items: { type: string, minLength: 1, maxLength: 64 } }
        emailAddress: { type: [string, 'null'], format: email, maxLength: 320, description: omitted leaves the stored address unchanged; null clears it }
    OutboxRow:
      type: object
      required: [id, topic, kind, attempts, lastError, createdAt]
      properties:
        id: { type: integer }
        topic: { type: string }
        kind: { type: [string, 'null'] }
        payload: { type: object, description: the raw outbox payload (admin-only; may carry amounts owed to issuers or holders) }
        attempts: { type: integer }
        lastError: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        dispatchedAt: { type: [string, 'null'], format: date-time }
    OutboxBacklog:
      type: object
      required: [counts, failed, recent]
      properties:
        counts:
          type: object
          required: [pending, failed, dispatched]
          properties: { pending: { type: integer }, failed: { type: integer, description: pending rows whose last attempt failed }, dispatched: { type: integer } }
        failed: { type: array, items: { $ref: '#/components/schemas/OutboxRow' }, description: up to 50 pending rows with a last_error }
        recent: { type: array, items: { $ref: '#/components/schemas/OutboxRow' }, description: the last 50 rows }
    EmailOutboxRow:
      type: object
      required: [emailId, to, subject, body, createdAt]
      properties:
        emailId: { type: string }
        to: { type: string }
        subject: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
paths:
  /me/notifications:
    get:
      operationId: listMyNotifications
      x-access: account
      tags: [notifications, me]
      security: [{ session: [] }]
      parameters:
        - { name: unread, in: query, schema: { type: string, enum: ['true', 'false'] }, description: only unread rows }
        - { $ref: '#/components/parameters/limit' }
      responses:
        '200': { description: The newest notifications for the signed-in account, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationList' } } } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /me/notifications/read:
    post:
      operationId: markNotificationsRead
      x-access: account
      tags: [notifications, me]
      security: [{ session: [] }]
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [ids], properties: { ids: { type: array, minItems: 1, maxItems: 200, items: { type: string } } } } } } }
      responses:
        '200': { description: The ids marked read now (ids of other accounts or already-read rows are ignored) and the remaining unread count, content: { application/json: { schema: { type: object, required: [read, unreadCount], properties: { read: { type: array, items: { type: string } }, unreadCount: { type: integer } } } } } }
        '400': { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Idempotency key reused with a different body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /me/notification-preferences:
    get:
      operationId: getNotificationPreferences
      x-access: account
      tags: [notifications, me]
      security: [{ session: [] }]
      responses:
        '200': { description: Email on/off, muted kinds and the account's own address, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    put:
      operationId: setNotificationPreferences
      x-access: account
      tags: [notifications, me]
      security: [{ session: [] }]
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferencesUpdate' } } } }
      responses:
        '200': { description: The stored preferences, content: { application/json: { schema: { $ref: '#/components/schemas/NotificationPreferences' } } } }
        '400': { description: Validation failed, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: Idempotency key reused with a different body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/notifications/outbox:
    get:
      operationId: adminNotificationsOutbox
      x-access: admin
      tags: [admin, notifications]
      security: [{ session: [] }]
      responses:
        '200': { description: Backlog counts (pending, failed with last_error) and the last 50 outbox rows. Payloads may carry amounts owed; the view is audited., content: { application/json: { schema: { $ref: '#/components/schemas/OutboxBacklog' } } } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not an admin, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/notifications/emails:
    get:
      operationId: adminNotificationsEmails
      x-access: admin
      tags: [admin, notifications]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/limit' }]
      responses:
        '200': { description: The mock email channel's outbox (dev visibility); the view is audited, content: { application/json: { schema: { type: object, required: [channel, emails], properties: { channel: { type: string }, emails: { type: array, items: { $ref: '#/components/schemas/EmailOutboxRow' } } } } } } }
        '401': { description: Not signed in, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '403': { description: Not an admin, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
