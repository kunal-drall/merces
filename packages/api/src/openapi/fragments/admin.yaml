# E13 admin API with an append-only audit log. Every operation is admin-tier. Admins have no path to user funds or
# raw income: chain actions are UnsignedTx objects built for the protocol multisig and tracked as tx requests until
# the chain itself shows the effect. Offchain actions (flags, role grants, audit sampling) are audited.
tags:
  - { name: admin, description: Operations console (E13) — overview, flags, audit log, multisig requests, keepers }
components:
  schemas:
    AdminFlag:
      type: object
      required: [name, enabled, locked]
      properties:
        name: { type: string, enum: [tier4, transfer_windows, early_draws, secondary_trading, private_payouts] }
        enabled: { type: boolean }
        locked: { type: boolean, description: true for flags that cannot be enabled from the API (private_payouts is "coming soon") }
    AdminFlagSet:
      type: object
      required: [enabled]
      properties: { enabled: { type: boolean } }
    AdminFlagResult:
      allOf:
        - $ref: '#/components/schemas/AdminFlag'
        - type: object
          required: [changed]
          properties: { changed: { type: boolean, description: false when the flag already had this value } }
    AdminAuditEntry:
      type: object
      required: [id, at, actor, actorRole, action, detail]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string, description: account id of the admin or attestor }
        actorRole: { type: string }
        action: { type: string, description: dotted action name, e.g. flag.set, attestor.register, application.approved }
        target: { type: [string, 'null'] }
        detail: { type: object, description: codes, ids and booleans only — never a figure, document or reason }
    AdminTxRequest:
      type: object
      description: A multisig action proposed by an admin. The backend never signs it; `state` moves to confirmed only when the chain shows the effect.
      required: [requestId, kind, chain, command, state, txId, createdBy, meta, createdAt]
      properties:
        requestId: { type: string }
        kind: { type: string, enum: [registerAttestor, revokeAttestor, rotateAttestor, registerVerifierKey, revokeVerifierKey, rotateVerifierKey, pauseNewRaises, setFeeCollector, registerSplitRouter] }
        chain: { type: string }
        command: { type: object, description: the canonical AdminCommand as built }
        state: { type: string, enum: [proposed, sent, confirmed] }
        txId: { type: [string, 'null'] }
        createdBy: { type: string, description: admin account id }
        meta: { type: object, description: "registerAttestor: {accountId (the account the key is linked to), jurisdiction, kind}; rotateAttestor: {accountId}" }
        createdAt: { type: string, format: date-time }
        sentAt: { type: [string, 'null'], format: date-time }
        confirmedAt: { type: [string, 'null'], format: date-time }
    AdminTxProposal:
      type: object
      required: [request, tx]
      properties:
        request: { $ref: '#/components/schemas/AdminTxRequest' }
        tx: { $ref: '#/components/schemas/UnsignedTx' }
    AdminTxSent:
      type: object
      required: [txId]
      properties: { txId: { type: string, description: the transaction id the multisig broadcast } }
    AdminRegisterAttestor:
      type: object
      description: "Propose an attestor key for Stage 1's registerAttestor (S4 WP7): a secp256k1 key's 20-byte address, the attestor on every chain that registers it, linked by its own EIP-191 proof (POST /me/signer-keys) to the account that will act with it. Revocation and rotation have their own routes."
      required: [chain, attestor]
      additionalProperties: false
      properties:
        chain: { type: string }
        attestor: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "the attestor key's 20-byte address (any case; stored lowercase). A chain wallet address is no key (400)" }
        accountId: { type: string, description: "the Merces account proposed as attestor: the key must be linked to it (422 key-not-linked otherwise); omitted, the account the key is linked to. It gains attestor access only once the key's registration is onchain and indexed" }
        jurisdiction: { type: string, minLength: 2, maxLength: 2, description: ISO 3166-1 alpha-2 }
        kind: { type: string, enum: [CA, CPA] }
    AdminRevokeAttestor:
      type: object
      description: "Revoke an attestor key with Stage 1's revokeAttestor (forward-only: report and FX signatures of periods that ended by the revocation stay valid onchain for 45 days; offchain access ends once the revocation is indexed). Needs no account link: a revocation grants nothing."
      required: [chain, attestor]
      additionalProperties: false
      properties:
        chain: { type: string }
        attestor: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
    AdminRotateAttestor:
      type: object
      description: "Replace attestor key `from` by `to` in one transaction (Stage 1's rotateAttestor on the EVM; Solana's register_attestor(to) and revoke_attestor(from) in one transaction, S5). `to` must be linked to the account `from` is linked to. PAUSE, AMEND, EXTINGUISH and TRUEUP signatures by `from` are dead once it lands and are signed again with `to`."
      required: [chain, from, to]
      additionalProperties: false
      properties:
        chain: { type: string }
        from: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        to: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
    AdminRegisterVerifierKey:
      type: object
      description: "A report verifier key: a secp256k1 key's 20-byte address (S4 WP6), the address of the report verifier's own key (REPORT_VERIFIER_ADDRESS, which the verifier checks at startup). Registering builds Stage 1's registerVerifierKey; revoking (POST /admin/verifier-keys/revoke) its revokeVerifierKey (forward-only: tier-2 attestations of periods that ended by the revocation stay valid onchain for 45 days)."
      required: [chain, address]
      additionalProperties: false
      properties:
        chain: { type: string }
        address: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: 'any case; stored lowercase' }
    AdminRotateVerifierKey:
      type: object
      description: "Stage 1's rotateVerifierKey: register `to` and revoke `from` in one transaction (the EVM's own call; two instructions of one transaction on Solana)."
      required: [chain, from, to]
      additionalProperties: false
      properties:
        chain: { type: string }
        from: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        to: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
    AdminPauseRaises:
      type: object
      required: [chain, paused]
      properties: { chain: { type: string }, paused: { type: boolean } }
    AdminVerifierKeys:
      type: object
      required: [chain, keys]
      properties:
        chain: { type: string }
        keys:
          type: array
          description: "the chain's verifier key records (Stage 1 VerifierKey / EVM KeyInfo), active and revoked"
          items:
            type: object
            required: [kind, address, active, revokedAt, graceUntil]
            properties:
              kind: { type: string, const: verifier }
              address: { type: string, pattern: '^0x[0-9a-f]{40}$' }
              active: { type: boolean }
              revokedAt: { type: [integer, 'null'], description: unix seconds of the forward-only revocation }
              graceUntil: { type: [integer, 'null'], description: 'revokedAt + 3,888,000 s: tier-2 attestations of periods that ended by revokedAt stay valid onchain until then' }
    AdminEligibilityRow:
      type: object
      required: [chain, wallet, accountId, kind, approvedAt, revokedAt, expectedAllowed, allowlistSyncedAt, allowlistTx, indexedAllowed, syncState]
      properties:
        chain: { type: string }
        wallet: { type: string }
        accountId: { type: string }
        kind: { type: string, enum: [issuer, backer] }
        approvedAt: { type: string, format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        expectedAllowed: { type: boolean, description: what the allowlist should say (not revoked) }
        allowlistSyncedAt: { type: [string, 'null'], format: date-time }
        allowlistTx: { type: [string, 'null'] }
        indexedAllowed: { type: [boolean, 'null'], description: the onchain allowlist as indexed; null when the indexer has not seen the wallet }
        syncState: { type: string, enum: [pending, unindexed, synced, diverged] }
    AdminAuditSample:
      type: object
      required: [sampleId, reportId, sampledAt, sampledBy, outcome]
      properties:
        sampleId: { type: string }
        reportId: { type: string }
        seriesId: { type: [string, 'null'] }
        periodId: { type: [string, 'null'] }
        tier: { type: [integer, 'null'] }
        reportState: { type: [string, 'null'] }
        sampledAt: { type: string, format: date-time }
        sampledBy: { type: string }
        outcome: { type: string, enum: [pending, passed, failed] }
    AdminAuditSamplesDraw:
      type: object
      required: [count]
      properties: { count: { type: integer, minimum: 1, maximum: 100 } }
    AdminAuditSamplesResult:
      type: object
      required: [sampled, samples]
      properties:
        sampled: { type: integer }
        samples: { type: array, items: { $ref: '#/components/schemas/AdminAuditSample' } }
        note: { type: string, description: present when the tier4 flag is off and nothing was sampled }
    AdminKeeperRun:
      type: object
      required: [id, job, startedAt, finishedAt, ok, actions]
      properties:
        id: { type: integer }
        job: { type: string }
        chain: { type: [string, 'null'] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        ok: { type: [boolean, 'null'], description: null while running }
        actions: { type: integer }
        detail: { type: [string, 'null'] }
    AdminChainOverview:
      type: object
      required: [chain, family, mode, network, admin, newRaisesPaused, health, indexer, series]
      properties:
        chain: { type: string }
        family: { type: string, enum: [solana, evm] }
        mode: { type: string, enum: [mock, live] }
        network: { type: string }
        admin: { type: string, description: the protocol multisig address every admin UnsignedTx is built for }
        newRaisesPaused: { type: boolean }
        health: { type: object, required: [ok, latencyMs, detail], properties: { ok: { type: boolean }, latencyMs: { type: number }, detail: { type: string } } }
        indexer: { type: [object, 'null'], properties: { cursor: { type: [string, 'null'] }, lastSeq: { type: integer }, updatedAt: { type: string, format: date-time } } }
        series: { type: object, required: [total, byStatus, byPhase], properties: { total: { type: integer }, byStatus: { type: object, additionalProperties: { type: integer } }, byPhase: { type: object, additionalProperties: { type: integer } } } }
    AdminOverview:
      type: object
      required: [at, chains, keepers, outbox, applications, txRequests, flags]
      properties:
        at: { type: string, format: date-time }
        chains: { type: array, items: { $ref: '#/components/schemas/AdminChainOverview' } }
        keepers:
          type: object
          required: [lastRuns, recentFailures]
          properties:
            lastRuns: { type: array, description: the most recent run of each job, items: { $ref: '#/components/schemas/AdminKeeperRun' } }
            recentFailures: { type: array, description: the last 20 failed runs, items: { $ref: '#/components/schemas/AdminKeeperRun' } }
        outbox: { type: object, required: [pending, failed], properties: { pending: { type: integer, description: rows not yet dispatched }, failed: { type: integer, description: pending rows whose last attempt errored } } }
        applications: { type: object, required: [open, submitted, inReview], properties: { open: { type: integer }, submitted: { type: integer }, inReview: { type: integer } } }
        txRequests: { type: object, required: [proposed, sent, confirmed], properties: { proposed: { type: integer }, sent: { type: integer }, confirmed: { type: integer } } }
        flags: { type: array, items: { $ref: '#/components/schemas/AdminFlag' } }
  parameters:
    adminFlagName: { name: name, in: path, required: true, schema: { type: string, enum: [tier4, transfer_windows, early_draws, secondary_trading, private_payouts] } }
    adminRequestId: { name: requestId, in: path, required: true, schema: { type: string } }
    adminLimit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    adminIdempotencyKey: { name: Idempotency-Key, in: header, schema: { type: string } }
paths:
  /admin/overview:
    get:
      operationId: adminOverview
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: Per-chain health, indexer cursor and series counts; keeper runs; outbox backlog; open applications; flags
      responses:
        '200': { description: Overview (counts, statuses and cursors only), content: { application/json: { schema: { $ref: '#/components/schemas/AdminOverview' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/flags:
    get:
      operationId: adminListFlags
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: Feature flags
      responses:
        '200': { description: Flags, content: { application/json: { schema: { type: object, required: [flags], properties: { flags: { type: array, items: { $ref: '#/components/schemas/AdminFlag' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/flags/{name}:
    put:
      operationId: adminSetFlag
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: Switch a feature flag; audited. private_payouts is "coming soon" and can never be enabled (409).
      parameters: [{ $ref: '#/components/parameters/adminFlagName' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminFlagSet' } } } }
      responses:
        '200': { description: The flag after the change, content: { application/json: { schema: { $ref: '#/components/schemas/AdminFlagResult' } } } }
        '400': { description: 'Body is not {enabled: boolean}', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: Not one of the known flags, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: The flag is locked (private_payouts cannot be enabled), content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/audit-log:
    get:
      operationId: adminAuditLog
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: The append-only audit log, newest first
      parameters:
        - $ref: '#/components/parameters/adminLimit'
        - { name: actor, in: query, schema: { type: string }, description: account id }
        - { name: action, in: query, schema: { type: string }, description: exact action, or a namespace prefix ("flag" matches "flag.set") }
        - { name: target, in: query, schema: { type: string } }
        - { name: before, in: query, schema: { type: integer }, description: entries with an id below this (paging) }
      responses:
        '200': { description: Entries, content: { application/json: { schema: { type: object, required: [entries], properties: { entries: { type: array, items: { $ref: '#/components/schemas/AdminAuditEntry' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/attestors:
    get:
      operationId: adminListAttestors
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: Attestor key proposals beside the indexed onchain registry, by key; only an indexed active registration of a key linked to an account gives that account attestor access
      responses:
        '200':
          description: One row per (chain, key) proposed or registered
          content:
            application/json:
              schema:
                type: object
                required: [attestors]
                properties:
                  attestors:
                    type: array
                    items:
                      type: object
                      required: [chain, attestor, status, onchainActive, registeredAt, revokedAt, graceUntil]
                      properties:
                        chain: { type: string }
                        attestor: { type: string, pattern: '^0x[0-9a-f]{40}$', description: "the attestor key's 20-byte address (S4 WP7; was `wallet`)" }
                        accountId: { type: [string, 'null'], description: 'the account the key is linked to now (the one that gets access); admin views only' }
                        status: { type: string, enum: [registered, pending-onchain, deactivation-pending, inactive] }
                        onchainActive: { type: boolean }
                        registeredAt: { type: [integer, 'null'], description: unix seconds the key last became active (indexed AttestorRegistered); null before it was indexed or for rows indexed before S4 }
                        revokedAt: { type: [integer, 'null'], description: unix seconds of its forward-only revocation (indexed AttestorRevoked); null while active }
                        graceUntil: { type: [integer, 'null'], description: "revokedAt + 45 days: until then report and FX signatures of periods that ended by revokedAt stay valid onchain (Stage 1's grace); attestor access ended at revokedAt" }
                        proposal: { type: [object, 'null'], description: 'the last proposal for the key on this chain: active (a registration, or the new key of a rotation) or not (a revocation, or the old key of a rotation), the account the key was linked to then, the tx request, who proposed it and when' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      operationId: adminRegisterAttestor
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: Build Stage 1's registerAttestor of a key linked to the account for the multisig and open a tx request; records the proposal but grants nothing (access starts when the registration is indexed, A-M5-2); the registry's rules are checked against the chain first; audited
      parameters: [{ $ref: '#/components/parameters/adminIdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRegisterAttestor' } } } }
      responses:
        '201': { description: The tracked request and the UnsignedTx for the multisig, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTxProposal' } } } }
        '400': { description: Unknown chain, an address that is not a 20-byte key, or an unknown field, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { description: The account does not exist, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '409': { description: "The registry refuses it on this chain, before anything is built (detail.reason key-already-active: the EVM reverts KeyAlreadyActive, Solana would re-emit), or the idempotency key was reused with a different body", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'The key is linked to no account, or to another account than the one named (detail.reason key-not-linked)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/attestors/revoke:
    post:
      operationId: adminRevokeAttestor
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: "Build Stage 1's revokeAttestor for the multisig (forward-only) and open a tx request; access ends once it is indexed; audited"
      parameters: [{ $ref: '#/components/parameters/adminIdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRevokeAttestor' } } } }
      responses:
        '201': { description: The tracked request and the UnsignedTx for the multisig, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTxProposal' } } } }
        '400': { description: Unknown chain or an address that is not a 20-byte key, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "The key is not active on the chain (detail.reason key-not-active: revoked or never registered; Solana KeyAlreadyRevoked or AccountNotInitialized, EVM KeyNotRegistered), it is the chain's last active attestor key (detail.reason last-active-key: rotate to a new key instead; Solana LastKeyOfKind, EVM LastActiveKey), or the idempotency key was reused with a different body", content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/attestors/rotate:
    post:
      operationId: adminRotateAttestor
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: "Build Stage 1's rotateAttestor{from, to} for the multisig (register to, revoke from, one transaction) and open a tx request; to must be linked to the account from is linked to; audited"
      parameters: [{ $ref: '#/components/parameters/adminIdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRotateAttestor' } } } }
      responses:
        '201': { description: The tracked request and the UnsignedTx for the multisig, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTxProposal' } } } }
        '400': { description: Unknown chain or an address that is not a 20-byte key, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'The new key is already active (detail.reason key-already-active), the key to replace is not active (key-not-active), or the idempotency key was reused with a different body', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '422': { description: 'from and to are the same key, or to is not linked to the account from is linked to (detail.reason key-not-linked)', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/tx-requests:
    get:
      operationId: adminListTxRequests
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: Multisig requests, newest first
      parameters:
        - { name: chain, in: query, schema: { type: string } }
        - { name: kind, in: query, schema: { type: string, enum: [registerAttestor, revokeAttestor, rotateAttestor, registerVerifierKey, revokeVerifierKey, rotateVerifierKey, pauseNewRaises, setFeeCollector, registerSplitRouter] } }
        - { name: state, in: query, schema: { type: string, enum: [proposed, sent, confirmed] } }
        - $ref: '#/components/parameters/adminLimit'
      responses:
        '200': { description: Requests, content: { application/json: { schema: { type: object, required: [requests], properties: { requests: { type: array, items: { $ref: '#/components/schemas/AdminTxRequest' } } } } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/tx-requests/{requestId}/sent:
    post:
      operationId: adminTxRequestSent
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: Record the multisig's tx id; the request becomes confirmed only when the chain shows the effect (getSignerKey for both key kinds, info); audited
      parameters: [{ $ref: '#/components/parameters/adminRequestId' }, { $ref: '#/components/parameters/adminIdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTxSent' } } } }
      responses:
        '200': { description: The request in state sent or confirmed, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTxRequest' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already confirmed with a different tx id, or idempotency key reused with a different body, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
  /admin/verifier-keys:
    post:
      operationId: adminRegisterVerifierKey
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: Build Stage 1's registerVerifierKey of a 20-byte address for the multisig and open a tx request; audited
      parameters: [{ $ref: '#/components/parameters/adminIdempotencyKey' }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/AdminRegisterVerifierKey' } } } }
      responses:
        '201': { description: The tracked request and the UnsignedTx for the multisig, content: { application/json: { schema: { $ref: '#/components/schemas/AdminTxProposal' } } } }
        '400': { description: Unknown chain or malformed address, content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: 'The key is already active on the chain (detail.reason key-already-active), or the idempotency key was reused with a different body', content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } } }
    get:
      operationId: adminListVerifierKeys
      x-access: admin
      tags: [admin]
      security: [{ session: [] }]
      summary: "The report verifier's keys per chain (the chain's own key records, active and revoked) and the address the report verifier signs with"
      parameters: [{ name: chain, in: query, schema: { type: string } }]
      responses:
