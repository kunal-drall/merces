# E10 attestor service: hardship pauses (private review), tier-3 cases and annual true-up, FX fallback, two-attestor extinguishment (two keys' Stage 1 EXTINGUISH signatures, relayed by the keeper since S4 WP12).
# Hardship and tier-3 documents travel as END-TO-END ciphertext for the attestor; the server never decrypts them.
tags:
  - name: attestor
    description: Attestor work queue and sign-offs (E10)
  - name: hardship
    description: Hardship pauses reviewed privately by an attestor (R16, C8)
  - name: tier3
    description: Tier-3 attestor cases and the annual true-up (R10, R26)
components:
  schemas:
    WorkWithdrawal:
      type: object
      required: [id, state]
      properties:
        id: { type: string }
        state: { type: string, const: withdrawn }
    ReaddressWork:
      type: object
      required: [chain, from, to]
      additionalProperties: false
      properties:
        chain: { type: string }
        from: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
        to: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }
    ReaddressedWork:
      type: object
      required: [hardship, tier3, annual, extinguishments]
      properties:
        hardship: { type: integer }
        tier3: { type: integer }
        annual: { type: integer }
        extinguishments: { type: integer }
    Ciphertext:
      type: string
      description: End-to-end ciphertext (base64, base64url or hex) encrypted on the client for the attestor's key. Plaintext, JSON, and any hex, base64 or base64url encoding of text, JSON or a document file are rejected (422).
    E2eEnvelope:
      type: string
      pattern: '^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$'
      description: 'A merces-e2e v1 envelope, in canonical base64 (standard alphabet, padded) of version 0x01 (1 byte) ‖ the sender''s ephemeral X25519 public key (32) ‖ the AES-GCM nonce (12) ‖ the AES-256-GCM ciphertext of the payload and its 16-byte tag. Key = HKDF-SHA256(X25519 shared secret, salt = ephemeral public key ‖ recipient public key, info = "merces/e2e/v1" ‖ 0x00 ‖ purpose); associated data = the 45 header bytes. The server holds no key and checks the shape only; anything that does not parse as an envelope of the payload''s size (the plaintext or an encoding of it included) is rejected (422). @merces/poi-device sealE2e / openE2e.'
    HardshipStatus:
      type: object
      description: What holders and the issuer see — statuses, requestOnchain boolean and dates only, never ciphertext or decision codes.
      properties:
        requestOnchain: { type: boolean, description: Whether the issuer request is currently pending onchain. }
        seriesId: { type: string }
        seriesStatus: { type: string }
        paused: { type: boolean }
        pausedUntil: { type: [integer, 'null'] }
        requests:
          type: array
          items:
            type: object
            properties:
              state: { type: string, enum: [pending, approved, rejected, withdrawn], description: 'withdrawn: the issuer withdrew the onchain request (S4 WP10)' }
              requestedUntil: { type: integer }
              approvedUntil: { type: [integer, 'null'] }
              requestedAt: { type: string }
              decidedAt: { type: [string, 'null'] }
    ExtinguishmentRequest:
      type: object
      description: "An extinguishment request (S4 WP12): the two named attestor keys (the opener's first; linked to two accounts, S4 D15), the keys that have signed Stage 1's EXTINGUISH message and the nonce they signed, and the keeper's relay. An unrelayed EXTINGUISH signature is a bearer authorisation and is never shown; once relayed (state sent) the two signatures are public onchain data."
      properties:
        requestId: { type: string }
        seriesId: { type: string }
        chain: { type: string }
        attestors: { type: array, minItems: 2, maxItems: 2, items: { type: string, pattern: '^0x[0-9a-f]{40}$' } }
        state: { type: string, enum: [collecting, ready, sent, withdrawn], description: 'collecting: fewer than two signatures; ready: both, the relay pending or refused (relayError); sent: the chain extinguished the series with them; withdrawn: it can no longer be completed (another extinguishment landed, or closed in S4)' }
        decisionCode: { type: [string, 'null'], description: 'why it last changed state: extinguished, stale-nonce, attestor-key-inactive, series-extinguished, resign-s4 (opened before S4 WP12: both keys sign again), superseded-s4' }
        keyHint: { type: [string, 'null'] }
        requestedBy: { type: string }
        createdAt: { type: string }
        extinguishNonce: { type: [string, 'null'], description: 'the extinguish nonce the stored signatures bind' }
        signers: { type: array, items: { type: string }, description: 'the named keys that have signed (never their signatures before the relay)' }
        relayTx: { type: [string, 'null'] }
        relayError: { type: [string, 'null'], description: "the Stage 1 name (or canonical code) of the chain's refusal of the last relay of a ready request" }
        signatures: { type: array, items: { type: object, properties: { signer: { type: string }, signature: { type: string }, digest: { type: string } } }, description: 'the two relayed signatures, once sent (named attestors and admins; public onchain)' }
        evidenceCiphertext: { $ref: '#/components/schemas/Ciphertext' }
    UnsignedTx:
      type: object
      description: "A transaction for one wallet (a user, a holder or the admin multisig) to sign; the backend never signs. It has one funding wallet. Native Meteora setup additionally requires signatures from the exact fresh config, base mint or position mint accounts named in the reviewed command; their private keys stay on the signing device. An attestor's or the report verifier's approval is a Stage 1 signature the command carries as an argument, never a transaction signature."
      properties:
        chain: { type: string }
        family: { type: string, enum: [solana, evm] }
        signer: { type: string, description: 'the one signer (the fee payer on Solana, msg.sender on the EVM)' }
        command: { type: object, description: "the transaction's command; for a transaction of several commands, the first" }
        commands: { type: array, items: { type: object }, description: 'every command of a transaction built from an ordered list, in order: the chain executes them all or none (one transaction; the curve unstake builder returns [unstakeUnits, claimPayout]). Absent on a transaction of one command' }
        payload: { type: string }
        encoding: { type: string }
        summary: { type: string }
        expiresAt: { type: [integer, 'null'] }
        approvals:
          type: array
          description: Sign and confirm exact ERC-20 approvals in order, then rebuild the main transaction. A nonzero existing allowance may require approval of zero first.
          items:
            type: object
            required: [token, spender, amount, payload, encoding]
            properties:
              token: { type: string }
              spender: { type: string }
              amount: { type: string }
              payload: { type: string }
              encoding: { type: string, const: evm-json }
        preparations:
          type: array
          description: Confirm each protocol prerequisite, then rebuild the main transaction. These prerequisites do not perform the requested main action.
          items:
            type: object
            required: [summary, payload, encoding]
            properties:
              summary: { type: string }
              payload: { type: string }
              encoding: { type: string, enum: [evm-json, solana-base64] }
        afterCreate:
          type: object
          description: EVM creation cannot accept a contract hash. After confirmation, obtain the series id from SeriesCreated and call the signed draft's build-contract-hash route before opening the raise.
          required: [kind, contractHash]
          properties:
            kind: { type: string, const: setContractHash }
            contractHash: { type: string }

paths:
  /attestor/tier3/{caseId}/withdraw:
    post:
      operationId: withdrawTier3Case
      tags: [attestor]
      x-access: account
      summary: Withdraw pending work as its requester or an admin, even after key revocation
      description: Drops stored signatures. Already accepted reports and submitted true-ups cannot be withdrawn. An offchain withdrawal cannot invalidate a signature already held by a third party.
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkWithdrawal' }
        '403': { description: Only the requester or an admin can withdraw }
        '409': { description: Already submitted or onchain nonce moved }
  /attestor/tier3/annual/{annualId}/withdraw:
    post:
      operationId: withdrawAnnualAttestation
      tags: [attestor]
      x-access: account
      summary: Withdraw pending work as its requester or an admin, even after key revocation
      description: Drops stored signatures. Already accepted reports and submitted true-ups cannot be withdrawn. An offchain withdrawal cannot invalidate a signature already held by a third party.
      parameters:
        - name: annualId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkWithdrawal' }
        '403': { description: Only the requester or an admin can withdraw }
        '409': { description: Already submitted or onchain nonce moved }
  /attestor/extinguish/{requestId}/withdraw:
    post:
      operationId: withdrawExtinguishment
      tags: [attestor]
      x-access: account
      summary: Withdraw pending work as its requester or an admin, even after key revocation
      description: Drops stored signatures. Already accepted reports and submitted true-ups cannot be withdrawn. An offchain withdrawal cannot invalidate a signature already held by a third party.
      parameters:
        - name: requestId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkWithdrawal' }
        '403': { description: Only the requester or an admin can withdraw }
        '409': { description: Already submitted or onchain nonce moved }
  /me/signer-keys/readdress-work:
    post:
      operationId: readdressAttestorWork
      tags: [attestor]
      x-access: account
      summary: Readdress open work after a confirmed same-account key rotation
      description: The old key must be revoked and the replacement active. Preserves signed reports during their grace and reports already accepted onchain. Reopens expired unsigned work with its evidence confined to the same account. Both extinguishment signatures must be collected again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReaddressWork' }
      responses:
        '200':
          description: Counts of reassigned work
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReaddressedWork' }
        '403': { description: Keys must belong to the same account and the caller must own it or be an admin }
        '409': { description: Rotation is not confirmed onchain }
  /attestor/me:
    get:
      operationId: attestorMe
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      responses: { '200': { description: "The account's linked attestor keys, each on every chain with its indexed registration flag (`keys: [{chain, address, registeredOnchain}]`; S4 WP7: keys, not wallets), and open work counts", content: { application/json: { schema: { type: object } } } } }
  /attestor/queue:
    get:
      operationId: attestorQueue
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      responses: { '200': { description: 'Open work across both chains for the caller''s linked attestor keys, each on the chains where it is registered and indexed: hardship requests, tier-3 cases and annual attestations, extinguishment requests addressed to such a key there, and the FX fallback requests and amendments awaiting attestation of those chains (never ciphertext)', content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/hardship:
    post:
      operationId: requestHardship
      x-access: issuer
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [until, attestor, ciphertext], properties: { until: { type: integer, description: "requested pause end (unix seconds); advisory, as Stage 1's request_pause carries no end: the attestor approves the actual end within Stage 1's approve_pause bounds" }, attestor: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "an attestor key (a secp256k1 key's 20-byte address; S4 WP7) registered and indexed on the series' chain; a chain wallet address is no key (400)" }, ciphertext: { $ref: '#/components/schemas/Ciphertext' }, keyHint: { type: [string, 'null'] } } } } } }
      responses: { '201': { description: The hardship record (no ciphertext) and the unsigned requestPause transaction for the issuer, content: { application/json: { schema: { type: object } } } }, '409': { description: Series not settled, paused or terminal, or a request is already pending }, '400': { description: 'Malformed body: an attestor that is not a 20-byte key' }, '422': { description: "Plaintext-looking payload, an attestor key not registered on the series' chain, or an end date in the past; or no pause could be approved (detail.stage1 TooManyPauses: the series has used its 16 pauses; PauseTooLong: its two years in total are used)" } }
    get:
      operationId: hardshipStatus
      x-access: holder-or-issuer
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Statuses and dates only, content: { application/json: { schema: { $ref: '#/components/schemas/HardshipStatus' } } } } }
  /series/{seriesId}/hardship/build-request:
    post:
      operationId: rebuildHardshipRequest
      x-access: issuer
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: Refresh the original issuer's unsigned request for an existing pending private review. No new case or notification is created. Refuses an already onchain request, expired review, inactive attestor or ineligible series.
      responses:
        '200': { description: Fresh unsigned requestPause transaction, content: { application/json: { schema: { type: object, required: [seriesId, tx], properties: { seriesId: { type: string }, tx: { $ref: '#/components/schemas/UnsignedTx' } } } } } }
        '403': { description: Not the issuer or original review account }
        '409': { description: Review or chain state does not permit another request }
  /series/{seriesId}/hardship/build-end:
    post:
      operationId: buildEndPause
      x-access: issuer
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: End the active approved pause early. The unused duration returns to the lifetime pause allowance.
      responses:
        '200': { description: Unsigned endPause transaction, content: { application/json: { schema: { type: object, required: [seriesId, tx], properties: { seriesId: { type: string }, tx: { $ref: '#/components/schemas/UnsignedTx' } } } } } }
        '403': { description: Not the issuer }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: No active pause (detail.stage1 NotPaused) }
  /series/{seriesId}/hardship/build-withdraw:
    post:
      operationId: buildWithdrawPauseRequest
      x-access: issuer
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: "The issuer's withdrawPauseRequest transaction (Stage 1 withdraw_pause_request; S4 WP10) for the series' pending onchain pause request, to sign and send. Once it lands the series' pause nonce has advanced, so any PAUSE signature collected for the request is dead, and the indexer marks the pending hardship request withdrawn (PauseRequestWithdrawn). Also how an issuer clears an onchain request whose hardship request was rejected."
      responses: { '200': { description: 'The unsigned transaction for the issuer and the pause nonce of the request it withdraws (`{seriesId, pauseNonce, tx}`)', content: { application/json: { schema: { type: object } } } }, '403': { description: Not the series' issuer }, '404': { description: Unknown series }, '409': { description: 'No pause request is pending onchain (detail.stage1 PauseNotRequested)' } }
  /attestor/hardship/{hardshipId}:
    get:
      operationId: getHardship
      x-access: attestor
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ name: hardshipId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: "The request with its ciphertext (chosen attestor or admin only), the pause nonce of its onchain request (`pauseNonce`, from the indexed PauseRequested), the relayed approval once approved (`approval {signer, signature, digest, pauseNonce, pauseEnd}`, `relayTx`; stored only after the chain accepted it) and the series' onchain pause state: `livePauseNonce`, `pause` (the deprecated single-pause view) and `pauses` (Stage 1's record: pauses approved, seconds paused in total, a pending request, the running pause), which the approval bounds are checked against", content: { application/json: { schema: { type: object } } } }, '403': { description: "Addressed to another attestor key, or the caller's key is not linked to its account or not active on the item's chain" } }
  /attestor/hardship/{hardshipId}/message:
    get:
      operationId: hardshipSigningRequest
      x-access: attestor
      tags: [hardship, signing]
      security: [{ session: [] }]
      parameters:
        - { name: hardshipId, in: path, required: true, schema: { type: string } }
        - { name: pauseEnd, in: query, required: true, schema: { type: string, pattern: '^(0|[1-9][0-9]{0,77})$' }, description: 'the pause end to approve (unix seconds, a decimal string): at most the requested end' }
      description: "The signing request for the approval's PAUSE signature (S4 WP10): Stage 1's MERCES_PAUSE_V1 over the chain's signing domain (ChainInfo.signing), the series key (SeriesState.seriesKey), the series' live pause nonce (SeriesState.nonces.pause) and the end, addressed to the request's attestor key, only for an end the chain would take now (Stage 1's approve_pause bounds on the chain's pause record). The attestor signs it on their own device with the Merces attestor tool, which rebuilds and checks it first and warns that the signature cannot be recalled (anyone holding it can submit it until the nonce moves or the key is revoked); the API never signs. Public data only: the domain, the series key, the nonce and the end."
      responses:
        '200': { description: The PAUSE signing request, content: { application/json: { schema: { $ref: '#/components/schemas/SigningRequest' } } } }
        '400': { description: A missing or malformed query field }
        '403': { description: "Not the account holding the request's attestor key (or an admin), or the key is not active on the request's chain" }
        '404': { description: Unknown request or series }
        '409': { description: 'The request is decided or withdrawn; no request is pending onchain (detail.stage1 PauseNotRequested); a pause is running (detail.stage1 AlreadyPaused); the chain''s signing domain is not known yet (detail.reason signing-domain-unknown) or is not one a signer may sign for (detail.reason signing-network-refused)' }
        '422': { description: "The end after the requested end, beyond u64 (detail.stage1 AmountOutOfRange), or refused by Stage 1's bounds (detail.stage1 InvalidPauseEnd, PauseTooLong or TooManyPauses)" }
  /attestor/hardship/{hardshipId}/decide:
    post:
      operationId: decideHardship
      x-access: attestor
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ name: hardshipId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - type: object
                  additionalProperties: false
                  required: [approve, pauseEnd, pauseNonce, attestation]
                  properties:
                    approve: { type: boolean, enum: [true] }
                    pauseEnd: { type: string, pattern: '^(0|[1-9][0-9]{0,77})$', description: 'the approved end (unix seconds, a decimal string): at most the requested end' }
                    pauseNonce: { type: string, pattern: '^(0|[1-9][0-9]{0,19})$', description: "the nonce the signature binds: the signing request's fields.pauseNonce" }
                    attestation: { $ref: '#/components/schemas/DeviceSignature' }
                - type: object
                  additionalProperties: false
                  required: [approve]
                  properties:
                    approve: { type: boolean, enum: [false] }
                    decisionCode: { type: string, pattern: '^[a-z0-9][a-z0-9-]{0,63}$', description: rejection code (never free text) }
      description: "Only the account holding the request's attestor key decides (an admin never does; A-M5-3). An approval carries the key's Stage 1 PAUSE signature, made on the attestor's own device from GET /attestor/hardship/{hardshipId}/message (S4 WP10; was an approvePause transaction for the attestor's wallet). The API checks, in order: the request is pending; the end on the chain's pause record (u64, at most the requested end, a request pending onchain, Stage 1's approve_pause bounds: the end in the future, no running pause, at most 365 days, at most 730 days across the series' pauses, at most 16 pauses); the signature over the PAUSE message it rebuilds from the chain's own reads with the signed nonce (a digest sent must equal it) recovers to the request's key, an active attestor key (no grace); the series' pause nonce read again is still the one signed. Then the keeper relays approvePause (Stage 1's approve_pause is permissionless) and the request records the approval and the relay transaction. A refusal names Stage 1's rule in detail.stage1 (never a date) and leaves the request pending with nothing stored: an unrelayed PAUSE signature is never at rest. A rejection needs no signature."
      responses: { '200': { description: 'Approved: the record with its relayed approval and `relayTx` (the attestor sends nothing). Rejected: the record with its decision code and `relayTx` null', content: { application/json: { schema: { type: object } } } }, '400': { description: 'Malformed or unknown fields (the earlier `{approve, until}` shape included)' }, '403': { description: 'Not the account holding the chosen attestor key, or the key is not active on its chain' }, '409': { description: "Already decided or withdrawn; no request pending onchain (detail.stage1 PauseNotRequested); a pause is running (AlreadyPaused); the series' pause nonce moved since the signature was made, by a new request or a withdrawal (detail.reason stale-nonce, with detail.livePauseNonce and detail.request, the fresh signing request when a request is pending); the chain's signing domain unknown (detail.reason signing-domain-unknown)" }, '422': { description: "The approved end after the requested end, beyond u64 (detail.stage1 AmountOutOfRange), or refused by Stage 1's bounds (detail.stage1 InvalidPauseEnd, PauseTooLong or TooManyPauses); the signature not the request key's PAUSE signature over this nonce and end on this chain, or the key not active (detail.stage1 InvalidAttestorSignature); or the chain refused the relay (its canonical error with detail.stage1, e.g. PauseNotRequested when another copy of the approval landed first). The request stays pending" } }
  /series/{seriesId}/tier3/annual:
    post:
      operationId: openTier3Annual
      x-access: issuer
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [year, attestor, documentsCiphertext], properties: { year: { type: integer }, attestor: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "an attestor key registered on the series' chain (20-byte address)" }, documentsCiphertext: { $ref: '#/components/schemas/Ciphertext' }, keyHint: { type: [string, 'null'] } } } } } }
      responses: { '201': { description: The annual attestation (state open), content: { application/json: { schema: { type: object } } } }, '409': { description: Year not ended, tier 3 disabled or already opened (a withdrawn attestation does not hold its year) }, '422': { description: Plaintext-looking payload or an attestor key not registered on the series' chain } }
  /series/{seriesId}/tier3/{periodId}:
    post:
      operationId: openTier3Case
      x-access: issuer
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: periodId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      description: 'The issuer''s device proves the quarter; the documents and the income opening (merces/tier3-opening/v1: year-to-date figure and salt, and the prior''s) reach the attestor end to end encrypted. Both are opaque here. The opening must be a merces-e2e v1 envelope sealed for the attestor''s X25519 key with purpose merces/tier3-opening/v1 (64 to 4,096 payload bytes; @merces/poi-device sealTier3Opening); anything else is refused.'
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [attestor, documentsCiphertext, openingCiphertext, estimatePaymentStable], properties: { attestor: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "an attestor key registered on the series' chain (20-byte address)" }, documentsCiphertext: { $ref: '#/components/schemas/Ciphertext' }, openingCiphertext: { $ref: '#/components/schemas/E2eEnvelope' }, keyHint: { type: [string, 'null'] }, estimatePaymentStable: { $ref: '#/components/schemas/Money' } } } } } }
      responses: { '201': { description: The case (state open; no ciphertext), content: { application/json: { schema: { type: object } } } }, '409': { description: 'Period not ended, tier 3 disabled, a case already open/signed, or on a curve series a census older than the period end (detail.stage1 CurveUnitsNotSynced, detail.next the sync step)' }, '422': { description: 'Plaintext-looking documents, an opening that is not a merces-e2e v1 envelope, or an unknown attestor' } }
  /series/{seriesId}/tier3:
    get:
      operationId: listTier3
      x-access: issuer
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: The series' tier-3 cases and annual attestations (amounts and states; no ciphertext), content: { application/json: { schema: { type: object } } } } }
  /attestor/tier3/annual/{annualId}:
    get:
      operationId: getTier3Annual
      x-access: attestor
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ name: annualId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: The annual attestation with its ciphertext (chosen attestor or admin), content: { application/json: { schema: { type: object } } } }, '403': { description: "Addressed to another attestor key, or the caller's key is not linked to its account or not active on the item's chain" } }
  /attestor/tier3/annual/{annualId}/message:
    get:
      operationId: tier3AnnualSigningRequest
      x-access: attestor
      tags: [tier3, signing]
      security: [{ session: [] }]
      parameters:
        - { name: annualId, in: path, required: true, schema: { type: string } }
        - { name: totalPaymentStable, in: query, required: true, schema: { $ref: '#/components/schemas/Money' }, description: "the payment the attestor finds was owed for the year (base units); the adjustment is it less what was paid on estimate" }
      description: "The signing request for the annual attestation's TRUEUP signature (S4 WP13): Stage 1's MERCES_TRUEUP_V1 over the chain's signing domain (ChainInfo.signing), the series key (SeriesState.seriesKey), the series' live true-up nonce (SeriesState.nonces.trueup), the year, the signed adjustment (totalPaymentStable less the year's payments on estimate: positive is owed to holders, due 60 days after the attestation; negative is credited forward) and the attestation time (the chain's now). Only for a year and an adjustment Stage 1's submit_trueup would take (S4 amendment D13): the series settled with its mint final, not terminal, tier 3; the year ended and every quarter of it from the series' first period on reported; the adjustment in Stage 1's i64 range; a negative one no larger than the year's accepted report payments (PeriodState.paymentStable). The attestor signs it on their own device with the Merces attestor tool, which rebuilds and checks it first; the API never signs. Public data only: the domain, the series key, the nonce, the year, the adjustment (a payment figure Stage 1 publishes onchain) and the time."
      responses:
        '200': { description: The TRUEUP signing request, content: { application/json: { schema: { $ref: '#/components/schemas/SigningRequest' } } } }
        '400': { description: A missing, malformed or unknown query field }
        '403': { description: "Addressed to another attestor key (or the caller is no admin), or the caller's key is not linked to its account or not active on the item's chain" }
        '404': { description: Unknown attestation or series }
        '409': { description: "The attestation is signed or withdrawn; Stage 1's year rules (detail.stage1 the chain's name: TrueUpYearNotEnded or TrueUpYearIncomplete on Solana, TrueUpYearInvalid on the EVM), RaiseNotSettled, MintNotFinalized, TerminalStatus or TierNotEnabled; the chain's signing domain is not known yet (detail.reason signing-domain-unknown) or is not one a signer may sign for (detail.reason signing-network-refused)" }
        '422': { description: "The adjustment is out of Stage 1's i64 range (detail.stage1 AmountOutOfRange), or a credit exceeds the year's accepted report payments (detail.stage1 TrueUpExceedsYear on Solana, TrueUpAdjustmentTooLarge on the EVM); value-free" }
  /attestor/tier3/annual/{annualId}/sign:
    post:
      operationId: signTier3Annual
      x-access: attestor
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ name: annualId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      description: "The annual attestation (S4 WP13): the year's attested payment and the key's Stage 1 TRUEUP signature, made on its own device from GET .../message and posted as the attestor tool prints it, with the nonce and the time it signed. Only the account holding the key signs (an admin never does). The API checks Stage 1's year rules, the i64 range and the bound on a credit again (S4 amendment D13), the time (not after the chain's now, Stage 1's rule; not before the year ended), rebuilds the message from the chain's reads with the adjustment it derives from the posted payment (a digest sent must equal it), recovers the signer, checks the key is active (no grace) and reads the nonce again (409 stale-nonce with a fresh request). Stored with the amounts for the issuer's submit_trueup (S5); the signature is never shown by any read, the audit log, a notification or the feed (S4 amendment D2): views carry its signer, nonce, time, adjustment and digest (`trueUp`)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [totalPaymentStable, trueupNonce, attestationTs, attestation]
              properties:
                totalPaymentStable: { $ref: '#/components/schemas/Money' }
                trueupNonce: { type: string, pattern: '^(0|[1-9][0-9]{0,19})$', description: "the nonce the signature binds: the signing request's fields.trueupNonce" }
                attestationTs: { type: string, pattern: '^(0|[1-9][0-9]{0,19})$', description: "the attestation time the signature binds, unix seconds: the signing request's fields.attestationTs" }
                attestation: { $ref: '#/components/schemas/DeviceSignature' }
      responses:
        '200': { description: "The signed attestation: the amounts (estimated: the year's payments on estimate; an overpayment credited to the next period, or an underpayment due 60 days after the attestation time) and `trueUp` {signer, trueupNonce, attestationTs, adjustment, digest}", content: { application/json: { schema: { type: object } } } }
        '400': { description: Malformed body (the amounts-only body of before S4 WP13 included) }
        '403': { description: 'Not the account holding the chosen attestor key, or the key is not active on its chain' }
        '404': { description: Unknown attestation or series }
        '409': { description: "Already signed or withdrawn; Stage 1's year rules or the series' state (detail.stage1, as for the message); the nonce moved since the signature (detail.reason stale-nonce with detail.request, a fresh signing request)" }
        '422': { description: "The signature does not recover to the attestation's key over this TRUEUP message, or the key is not active (detail.stage1 InvalidAttestorSignature); the time is in the future (detail.stage1 TrueUpTimestampInFuture on Solana, AttestationInFuture on the EVM) or before the year ended; the adjustment out of range or a credit too large (as for the message)" }
  /attestor/tier3/{caseId}:
    get:
      operationId: getTier3Case
      x-access: attestor
