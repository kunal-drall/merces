      responses: { '200': { description: The case with its documents ciphertext and metadata (chosen attestor or admin), content: { application/json: { schema: { type: object } } } }, '403': { description: "Addressed to another attestor key, or the caller's key is not linked to its account or not active on the item's chain" } }
  /attestor/tier3/{caseId}/prefill-spec:
