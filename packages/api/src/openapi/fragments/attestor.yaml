# E10 attestor service: hardship pauses (private review), tier-3 cases and annual true-up, FX fallback, two-attestor extinguishment.
# Hardship and tier-3 documents travel as END-TO-END ciphertext for the attestor; the server never decrypts them.
tags:
  - name: attestor
    description: Attestor work queue and sign-offs (E10)
  - name: hardship
    description: Hardship pauses reviewed privately by an attestor (R16, C8)
  - name: tier3
    description: Tier-3 attestor cases and the annual true-up (R10, R26)
components:
  schemas:
    Ciphertext:
      type: string
      description: End-to-end ciphertext (base64, base64url or hex) encrypted on the client for the attestor's key. Plaintext and JSON are rejected (422).
    HardshipStatus:
      type: object
      description: What holders and the issuer see — statuses and dates only, never ciphertext or decision codes.
      properties:
        seriesId: { type: string }
        seriesStatus: { type: string }
        paused: { type: boolean }
        pausedUntil: { type: [integer, 'null'] }
        requests:
          type: array
          items:
            type: object
            properties:
              state: { type: string, enum: [pending, approved, rejected] }
              requestedUntil: { type: integer }
              approvedUntil: { type: [integer, 'null'] }
              requestedAt: { type: string }
              decidedAt: { type: [string, 'null'] }
    UnsignedTx:
      type: object
      description: A transaction for the user or attestor to sign; the backend never signs.
      properties:
        chain: { type: string }
        family: { type: string, enum: [solana, evm] }
        signer: { type: string }
        coSigners: { type: array, items: { type: string } }
        command: { type: object }
        payload: { type: string }
        encoding: { type: string }
        summary: { type: string }
        expiresAt: { type: [integer, 'null'] }
paths:
  /attestor/me:
    get:
      operationId: attestorMe
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      responses: { '200': { description: The attestor's wallets with their onchain registration flag per chain, and open work counts, content: { application/json: { schema: { type: object } } } } }
  /attestor/queue:
    get:
      operationId: attestorQueue
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      responses: { '200': { description: 'Open work across both chains for the caller''s registered attestor wallets: hardship requests, tier-3 cases and annual attestations, FX fallback requests, amendments awaiting attestation, extinguishment requests (never ciphertext)', content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/hardship:
    post:
      operationId: requestHardship
      x-access: issuer
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [until, attestor, ciphertext], properties: { until: { type: integer, description: requested pause end (unix seconds) }, attestor: { type: string, description: a registered attestor wallet on the series' chain }, ciphertext: { $ref: '#/components/schemas/Ciphertext' }, keyHint: { type: [string, 'null'] } } } } } }
      responses: { '201': { description: The hardship record (no ciphertext) and the unsigned requestPause transaction for the issuer, content: { application/json: { schema: { type: object } } } }, '409': { description: Series not settled, paused or terminal, or a request is already pending }, '422': { description: Plaintext-looking payload, unknown attestor or end date in the past } }
    get:
      operationId: hardshipStatus
      x-access: holder-or-issuer
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Statuses and dates only, content: { application/json: { schema: { $ref: '#/components/schemas/HardshipStatus' } } } } }
  /attestor/hardship/{hardshipId}:
    get:
      operationId: getHardship
      x-access: attestor
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ name: hardshipId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: The request with its ciphertext (chosen attestor or admin only) and the series' onchain pause state, content: { application/json: { schema: { type: object } } } }, '403': { description: Addressed to another attestor } }
  /attestor/hardship/{hardshipId}/decide:
    post:
      operationId: decideHardship
      x-access: attestor
      tags: [hardship]
      security: [{ session: [] }]
      parameters: [{ name: hardshipId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [approve], properties: { approve: { type: boolean }, until: { type: integer, description: approved end; defaults to the requested end and may not exceed it }, decisionCode: { type: string, description: rejection code (never free text) } } } } } }
      responses: { '200': { description: 'Approved: the record and the unsigned approvePause transaction for the attestor. Rejected: the record with its decision code and tx null', content: { application/json: { schema: { type: object } } } }, '403': { description: Not the chosen attestor }, '409': { description: Already decided, or the issuer has not sent requestPause onchain }, '422': { description: Approved end after the requested end or in the past } }
  /series/{seriesId}/tier3/annual:
    post:
      operationId: openTier3Annual
      x-access: issuer
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [year, attestor, documentsCiphertext], properties: { year: { type: integer }, attestor: { type: string }, documentsCiphertext: { $ref: '#/components/schemas/Ciphertext' }, keyHint: { type: [string, 'null'] } } } } } }
      responses: { '201': { description: The annual attestation (state open), content: { application/json: { schema: { type: object } } } }, '409': { description: Year not ended, tier 3 disabled or already opened }, '422': { description: Plaintext-looking payload or unknown attestor } }
  /series/{seriesId}/tier3/{periodId}:
    post:
      operationId: openTier3Case
      x-access: issuer
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: periodId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [attestor, documentsCiphertext, estimatePaymentStable], properties: { attestor: { type: string }, documentsCiphertext: { $ref: '#/components/schemas/Ciphertext' }, keyHint: { type: [string, 'null'] }, estimatePaymentStable: { $ref: '#/components/schemas/Money' } } } } } }
      responses: { '201': { description: The case (state open; no ciphertext), content: { application/json: { schema: { type: object } } } }, '409': { description: Period not ended, tier 3 disabled or a case already open/signed }, '422': { description: Plaintext-looking payload or unknown attestor } }
  /series/{seriesId}/tier3:
    get:
      operationId: listTier3
      x-access: issuer
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: The series' tier-3 cases and annual attestations (amounts and states; no ciphertext), content: { application/json: { schema: { type: object } } } } }
  /attestor/tier3/annual/{annualId}:
    get:
      operationId: getTier3Annual
      x-access: attestor
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ name: annualId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: The annual attestation with its ciphertext (chosen attestor or admin), content: { application/json: { schema: { type: object } } } }, '403': { description: Addressed to another attestor } }
  /attestor/tier3/annual/{annualId}/sign:
    post:
      operationId: signTier3Annual
      x-access: attestor
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ name: annualId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [totalPaymentStable], properties: { totalPaymentStable: { $ref: '#/components/schemas/Money' } } } } } }
      responses: { '200': { description: 'The true-up as amounts only: estimated (sum of the year''s accepted quarterly payments), overpayment credited to the next period, or underpayment due within 60 days with no accrual', content: { application/json: { schema: { type: object } } } }, '403': { description: Not the chosen attestor }, '409': { description: Already signed } }
  /attestor/tier3/{caseId}:
    get:
      operationId: getTier3Case
      x-access: attestor
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ name: caseId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: The case with its documents ciphertext and metadata (chosen attestor or admin), content: { application/json: { schema: { type: object } } } }, '403': { description: Addressed to another attestor } }
  /attestor/tier3/{caseId}/prefill-spec:
    get:
      operationId: tier3PrefillSpec
      x-access: attestor
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ name: caseId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'The CLIENT-SIDE extraction specification: which fields to pull from tax returns, W-2s, 1099s, royalty statements and accounting exports, the currency and the period. The server extracts nothing (R26)', content: { application/json: { schema: { type: object } } } } }
  /attestor/tier3/{caseId}/sign:
    post:
      operationId: signTier3Case
      x-access: attestor
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ name: caseId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [paymentStable, incomeCommitment], properties: { paymentStable: { $ref: '#/components/schemas/Money' }, incomeCommitment: { type: string }, liquidityEvent: { type: boolean } } } } } }
      responses: { '200': { description: 'The case marked signed with the attested payment; the issuer then assembles the tier-3 report (POST /series/{seriesId}/reports, tier 3) with this attestor as co-signer', content: { application/json: { schema: { type: object } } } }, '403': { description: Not the chosen attestor }, '409': { description: Already signed } }
  /attestor/fx-requests:
    get:
      operationId: listFxRequests
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      responses: { '200': { description: Open FX fallback requests (opened by the rate keeper, C9) on the caller's chains, content: { application/json: { schema: { type: object } } } } }
  /attestor/fx-requests/{requestId}/sign:
    post:
      operationId: signFxRequest
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [rateWad, attestorWallet, sourceNote, signature], properties: { rateWad: { $ref: '#/components/schemas/Wad' }, attestorWallet: { type: string }, sourceNote: { type: string, description: a code such as ecb-reference-rate }, signature: { type: string, description: 'the wallet''s signature over fxAttestationMessage({pair, periodId, rateWad}), made on the attestor''s device (sim: signatures in mock mode)' } } } } } }
      responses: { '200': { description: The request marked signed with the rate, attestor and signature, content: { application/json: { schema: { type: object } } } }, '403': { description: Wallet not linked to the account }, '409': { description: Not open }, '422': { description: Signature does not verify or wallet not a registered attestor } }
  /series/{seriesId}/reporting/fx-fallback/{periodId}:
    get:
      operationId: fxFallbackForSeries
      x-access: issuer
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: periodId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: 'The signed fallback rate for the series'' pair and period, if any, as `attestorRate` for report assembly', content: { application/json: { schema: { type: object } } } } }
  /attestor/extinguish:
    post:
      operationId: requestExtinguishment
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string } }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [seriesId, attestors, evidenceCiphertext], properties: { seriesId: { type: string }, attestors: { type: array, minItems: 2, maxItems: 2, items: { type: string }, description: two distinct registered attestors; both sign }, evidenceCiphertext: { $ref: '#/components/schemas/Ciphertext' }, keyHint: { type: [string, 'null'] } } } } } }
      responses: { '201': { description: The request and the unsigned extinguish transaction (signer = first attestor, co-signer = second), content: { application/json: { schema: { type: object, properties: { tx: { $ref: '#/components/schemas/UnsignedTx' } } } } } }, '403': { description: Neither attestor is linked to the account }, '409': { description: Already extinguished }, '422': { description: Attestors not distinct or not registered; plaintext-looking evidence } }
  /attestor/extinguish/{requestId}:
    get:
      operationId: getExtinguishment
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: The request with its evidence ciphertext (named attestors or admin) and the series' onchain status, content: { application/json: { schema: { type: object } } } }, '403': { description: Names other attestors } }
