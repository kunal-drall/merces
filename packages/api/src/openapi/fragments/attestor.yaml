        - { name: liquidityEvent, in: query, required: true, schema: { type: string, enum: ['true', 'false'] } }
      description: "The signing request for the case's tier-3 attestation (S4 WP9): Stage 1's MERCES_REPORT_V1 with tier 3 over the chain's signing domain (ChainInfo.signing) and the series key (SeriesState.seriesKey), for the commitments and liquidity flag the attestor checked on their device, addressed to the case's attestor key. The attestor signs it on their own device with the Merces attestor tool, which rebuilds and checks it first; the API never signs. Public data only."
      responses:
        '200': { description: The REPORT signing request (tier 3), content: { application/json: { schema: { $ref: '#/components/schemas/SigningRequest' } } } }
        '400': { description: A missing or malformed query field }
        '403': { description: "Not the account holding the case's attestor key (or an admin), or the key is not active on the case's chain" }
        '404': { description: Unknown case or series }
        '409': { description: 'The case is not open; the chain''s signing domain is not known yet (detail.reason signing-domain-unknown); the domain is not one a signer may sign for (detail.reason signing-network-refused)' }
        '422': { description: 'The prior is not the one the chain expects (detail.expectedPrior)' }
  /attestor/tier3/{caseId}/sign:
    post:
      operationId: signTier3Case
      x-access: attestor
      tags: [tier3]
      security: [{ session: [] }]
      parameters: [{ name: caseId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      description: 'The attestor''s device checked the decrypted opening against the documents (the commitments open to it, and its year-to-date figure is max(documented, prior)) and signed the case''s signing request (GET /attestor/tier3/{caseId}/message). The body carries commitments, the liquidity flag, the issuer''s proof and the signature only, never a figure, a salt or an opening (unknown fields are refused). The API checks the proof is over the series'' live terms commitment, units and the prior the chain expects, that it verifies, and that the attestation is Stage 1''s REPORT signature with tier 3 over the message it rebuilds from the chain''s own reads, recovering to the case''s attestor key, a key the chain holds usable for the quarter (S4 WP9; was an EIP-191 text signature). The issuer''s report then carries it.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [priorIncomeCommitment, incomeCommitment, liquidityEvent, proof, attestation]
              properties:
                priorIncomeCommitment: { $ref: '#/components/schemas/Hash32' }
                incomeCommitment: { $ref: '#/components/schemas/Hash32' }
                liquidityEvent: { type: boolean }
                proof: { $ref: '#/components/schemas/ReportProof' }
                attestation: { $ref: '#/components/schemas/DeviceSignature' }
      responses: { '200': { description: 'The case marked signed with the attested payment (the proof''s public input 5) and its attestation {signer, signature, digest}; the issuer then assembles the tier-3 report (POST /series/{seriesId}/reports, tier 3), which carries it', content: { application/json: { schema: { type: object } } } }, '400': { description: 'Malformed or unknown fields (the EIP-191 shape {liquidityEvent, signature} included)' }, '403': { description: 'Not the account holding the chosen attestor key, or the key is not active on the case''s chain' }, '409': { description: 'Already signed; the chain''s signing domain is not known yet (detail.reason signing-domain-unknown); on a curve series a census older than the period end (detail.stage1 CurveUnitsNotSynced) or a proof over another count than the census (detail.reason census-changed: the issuer proves again)' }, '422': { description: 'Proof not over this series or not verifying, prior not the expected one, or the attestation not the case''s attestor key''s REPORT signature over these fields on this chain, or its key not usable for the quarter (detail.stage1 InvalidAttestorSignature)' } }
  /attestor/fx-requests:
    get:
      operationId: listFxRequests
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      responses: { '200': { description: "Open FX fallback requests (opened by the rate keeper, C9) on the chains where one of the caller's linked keys is registered; a request re-opened by migration 025 carries decisionCode superseded-s4 until a key signs it", content: { application/json: { schema: { type: object } } } } }
  /attestor/fx-requests/{requestId}/messages:
    get:
      operationId: fxSigningRequests
      x-access: attestor
      tags: [attestor, signing]
      security: [{ session: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - { name: rateWad, in: query, required: true, schema: { type: string, pattern: '^[1-9]\d{0,19}$' }, description: the fallback rate (WAD, a u64) }
        - { name: attestor, in: query, required: false, schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }, description: "the key to sign with, linked to the caller's account and active on the request's chain; optional when the account holds one such key" }
      description: "The signing requests for an FX fallback rate (S4 WP9, D14): Stage 1's MERCES_FX_V1 over the chain's signing domain, each covered series' key, the period and rateWad, one per covered series still without a signature (all of them while the request is open). A covered series is on the request's chain, reports in the pair's base currency, reports the period (settled with a first period at or before it), is not Retired or Extinguished and has no accepted report for the period. The message binds the series key, so one rate is one signature per series. Once a rate is signed it is the period's rate: later requests add only the series that started reporting since, at that rate."
      responses:
        '200': { description: 'The request ({requestId, chain, pair, periodId, state, …}), the signer, the rate and `requests`, the FX signing requests', content: { application/json: { schema: { type: object, properties: { signer: { type: string }, rateWad: { type: string }, requests: { type: array, items: { $ref: '#/components/schemas/SigningRequest' } } } } } } }
        '400': { description: A malformed or zero rate, or an unknown query field }
        '403': { description: "The named key is not linked to the caller's account or not active on the request's chain; the account holds no such key" }
        '404': { description: Unknown request }
        '409': { description: 'The request is not open or signed; another rate is already signed for the period (detail.reason rate-fixed, detail.rateWad); the chain''s signing domain is not known yet (detail.reason signing-domain-unknown)' }
        '422': { description: 'The account holds several keys active on the chain: name one (detail.keys)' }
  /attestor/fx-requests/{requestId}/sign:
    post:
      operationId: signFxRequest
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      description: "The FX fallback rate signed on the attestor's device, one Stage 1 FX signature per covered series (S4 WP9, D14; was one EIP-191 text signature per pair). The key must be linked to the caller's account and an active attestor on the request's chain. Each signature must be for a covered series without one and recover to the key over the message the service rebuilds from the chain's own domain and series key. An open request needs a signature for every covered series; a signed one takes the series added since, at the same rate. Stored per series; the issuer's report carries its own."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [rateWad, signer, sourceNote, signatures]
              properties:
                rateWad: { type: string, pattern: '^[1-9]\d{0,19}$', description: 'the rate (WAD, a u64): the report''s fxAvgWad' }
                signer: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "the attestor key (20-byte address), linked to the caller's account and registered on the request's chain" }
                sourceNote: { type: string, description: a code such as ecb-reference-rate }
                signatures:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items: { type: object, additionalProperties: false, required: [seriesId, signature], properties: { seriesId: { type: string }, signature: { type: string, pattern: '^0x[0-9a-fA-F]{130}$' } } }
      responses: { '200': { description: 'The request marked signed with the rate and its first signer, and `signatures`: every stored series signature {seriesId, signer, rateWad, signature, digest, signedAt}', content: { application/json: { schema: { type: object } } } }, '400': { description: 'Malformed body: the old shape (attestor, signature), a signature that is not 65 bytes of hex, a free-text source note' }, '403': { description: Key not linked to the account }, '409': { description: 'Not open or signed; a series already signed (detail.reason already-signed); another rate already signed (detail.reason rate-fixed); signed concurrently; the chain''s signing domain is not known yet (detail.reason signing-domain-unknown)' }, '422': { description: 'A signature that does not recover to the key over the series'' FX message for the period and rate on this chain, or the key not usable for the period (detail.stage1 InvalidAttestorSignature, detail.seriesId); a series the request does not cover (detail.reason series-not-covered) or named twice (duplicate-series); an open request with a covered series unsigned (detail.reason signatures-missing, detail.missing); the key not a registered attestor on the chain' } }
  /series/{seriesId}/reporting/fx-fallback/{periodId}:
    get:
      operationId: fxFallbackForSeries
      x-access: issuer
      tags: [reporting]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: periodId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: "The FX fallback for the series' pair and period (S4 WP9): basis (unity, accumulator or attestor), the request's state and reason, the period's signed rate (`rateWad`), `seriesSigned`, and this series' own Stage 1 FX signature `fxFallback` {signer, signature} with its `digest` (null until an attestor signed for this series). The report service carries the stored signature into the report itself", content: { application/json: { schema: { type: object } } } } }
  /attestor/extinguish:
    post:
      operationId: requestExtinguishment
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      parameters: [{ name: Idempotency-Key, in: header, schema: { type: string } }]
      description: "Opens an extinguishment request (S4 WP12; C11.6) naming the caller's own attestor key and a second attestor key held by another account (S4 D15: an extinguishment needs two attestors, two accounts; Stage 1 itself checks only that the keys differ), with the evidence (death or permanent disability) as end-to-end ciphertext for them. Only for a series Stage 1 would extinguish now; one open request per series. Nothing is signed yet and there is no transaction for an attestor: each named key signs the request's EXTINGUISH message on its own device (GET .../message, POST .../sign), and once both have signed the keeper relays Stage 1's extinguish (permissionless)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [seriesId, attestor, coAttestor, evidenceCiphertext]
              properties:
                seriesId: { type: string }
                attestor: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "the caller's own attestor key (a secp256k1 key's 20-byte address), linked to its account and registered on the series' chain" }
                coAttestor: { type: string, pattern: '^0x[0-9a-fA-F]{40}$', description: "a second attestor key registered on the series' chain and linked to another account" }
                evidenceCiphertext: { $ref: '#/components/schemas/Ciphertext' }
                keyHint: { type: [string, 'null'] }
      responses:
        '201': { description: 'The request (`state` collecting, `attestors` [attestor, coAttestor], `signers` [], no ciphertext); no transaction', content: { application/json: { schema: { $ref: '#/components/schemas/ExtinguishmentRequest' } } } }
        '400': { description: 'Malformed body: a key that is not a 20-byte key, a missing field, or an unknown one (the old `attestors` list)' }
        '403': { description: "`attestor` is not a key linked to the caller's account and registered on the series' chain (an admin opens none)" }
        '409': { description: "Both keys linked to the caller's account (detail.reason same-account); the raise has not settled (detail.stage1 RaiseNotSettled: an open raise or a curve before its completion), its mint is not final (MintNotFinalized) or the series is extinguished (TerminalStatus); a request is already open for the series" }
        '422': { description: "The same key twice (detail.stage1 SameAttestor); a co-attestor key not registered on the series' chain, or linked to no account (detail.reason co-attestor-not-linked: nobody could sign for it); plaintext-looking evidence" }
  /attestor/extinguish/{requestId}:
    get:
      operationId: getExtinguishment
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: "The request with its evidence ciphertext (the named keys' accounts or an admin), the keys that have signed (`signers`, never an unrelayed signature: S4 amendment D2), the nonce they signed, the relay (`relayTx`; the Stage 1 name of a refused relay in `relayError`), the two signatures once relayed (`state` sent: public onchain), and the series' onchain status and live extinguish nonce", content: { application/json: { schema: { $ref: '#/components/schemas/ExtinguishmentRequest' } } } }, '403': { description: "Names other attestor keys, or the caller's key is not linked or not active on the series' chain" } }
  /attestor/extinguish/{requestId}/message:
    get:
      operationId: extinguishmentSigningRequest
      x-access: attestor
      tags: [attestor, signing]
      security: [{ session: [] }]
      parameters:
        - { name: requestId, in: path, required: true, schema: { type: string } }
        - { name: attestor, in: query, required: false, schema: { type: string, pattern: '^0x[0-9a-fA-F]{40}$' }, description: "the named key to sign; by default the caller's named key that has not signed (an admin, who may read it, names one)" }
      description: "The signing request for a named key's EXTINGUISH signature (S4 WP12): Stage 1's MERCES_EXTINGUISH_V1 over the chain's signing domain (ChainInfo.signing), the series key (SeriesState.seriesKey) and the series' live extinguish nonce (SeriesState.nonces.extinguish). Only while the request collects signatures, for a key that has not signed, two keys of two accounts, and a series Stage 1 would extinguish now. The attestor signs it on their own device with the Merces attestor tool, which rebuilds and checks it first and warns that the signature cannot be recalled (with the other key's signature anyone can extinguish the series until the nonce moves or a key is revoked); the API never signs. Public data only: the domain, the series key and the nonce."
      responses:
        '200': { description: The EXTINGUISH signing request, content: { application/json: { schema: { $ref: '#/components/schemas/SigningRequest' } } } }
        '400': { description: A malformed or unknown query field }
        '403': { description: "The key is not linked to the caller's account (or the caller is no admin), or not active on the request's chain" }
        '404': { description: Unknown request or series }
        '409': { description: "The request is ready, sent or withdrawn; the key has signed already (detail.reason already-signed); both keys linked to one account (detail.reason same-account); the series cannot be extinguished now (detail.stage1 RaiseNotSettled, MintNotFinalized or TerminalStatus); the chain's signing domain is not known yet (detail.reason signing-domain-unknown) or is not one a signer may sign for (detail.reason signing-network-refused)" }
        '422': { description: The request does not name that key }
  /attestor/extinguish/{requestId}/sign:
    post:
      operationId: signExtinguishment
      x-access: attestor
      tags: [attestor]
      security: [{ session: [] }]
      parameters: [{ name: requestId, in: path, required: true, schema: { type: string } }, { name: Idempotency-Key, in: header, schema: { type: string } }]
      description: "One named key's Stage 1 EXTINGUISH signature (S4 WP12), made on its own device from GET .../message and posted as the attestor tool prints it, with the nonce it signed. Only the account holding the key signs (an admin never does). The API rebuilds the message from the chain's reads with that nonce (a digest sent must equal it), recovers the signer, checks the key is active on the chain (no grace) and reads the nonce again. With both keys' signatures the request is ready and the keeper relays Stage 1's extinguish{attestorA, signatureA, attestorB, signatureB} at once (permissionless; checking first that the nonce is live and both keys still active): the request is sent and the response carries the relay transaction and the two signatures (public onchain). A relay the chain refuses leaves the request ready with the refusal's Stage 1 name (relayError) and returns the refusal; posting a stored signature again retries the relay. An unrelayed signature is never shown by any read, the audit log, a notification or the feed (S4 amendment D2)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [extinguishNonce, attestation]
              properties:
                extinguishNonce: { type: string, pattern: '^(0|[1-9][0-9]{0,19})$', description: "the nonce the signature binds: the signing request's fields.extinguishNonce" }
                attestation: { $ref: '#/components/schemas/DeviceSignature' }
      responses:
        '200': { description: "The request: collecting (one signature in, `signers` names it) or sent (`relayTx`, `signatures`), with `relayTx` at the top level", content: { application/json: { schema: { $ref: '#/components/schemas/ExtinguishmentRequest' } } } }
        '400': { description: Malformed body }
        '403': { description: "Not the account holding a key the request names, or the key is not active on the request's chain" }
        '404': { description: Unknown request or series }
        '409': { description: "The request is sent or withdrawn; both keys linked to one account (detail.reason same-account); the series cannot be extinguished now (detail.stage1 RaiseNotSettled, MintNotFinalized or TerminalStatus); the signature binds a nonce that is not the live one (detail.reason stale-nonce, with detail.liveExtinguishNonce and detail.request, the fresh signing request); at the relay, a stored signature's key is no longer active (detail.reason attestor-key-inactive, detail.stage1 InvalidAttestorSignature, detail.keys: that signature is dropped and the request collects again)" }
        '422': { description: "The signature does not recover to the named key over this request's EXTINGUISH message on this chain, or the key is not active (detail.stage1 InvalidAttestorSignature); or the chain refused the relay (error Chain<code>, detail.stage1 its Stage 1 name; the request stays ready)" }
