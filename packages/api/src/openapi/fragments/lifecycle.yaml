tags:
  - { name: lifecycle, description: Treasury draws, payout claims, redemption and tail, retirement, transfer windows (R6, R13, R14, R15, R19) }
components:
  schemas:
    TrueUpState:
      type: object
      required: [nonce, lastYear, year, due, attestedAt, accrual, total, routerCredit, noticeEmitted]
      properties:
        nonce: { type: string }
        lastYear: { type: [integer, 'null'] }
        year: { type: [integer, 'null'] }
        due: { $ref: '#/components/schemas/Money' }
        attestedAt: { type: [integer, 'null'] }
        accrual: { $ref: '#/components/schemas/Money' }
        total: { $ref: '#/components/schemas/Money' }
        routerCredit: { $ref: '#/components/schemas/Money' }
        noticeEmitted: { type: boolean }
    RedemptionQuote:
      type: object
      description: "Stage 1's redemptionQuote at the chain's now, over the live cap, paidPerUnitWad and the tagged year ring: price = min(C_remaining, max(P_hurdle, k × D_avg)), deposit = price × units outstanding (no fee; on a curve series floor(price × base lamports / 10^6) over redeem's own census)."
      required: [seriesId, now, pricePerUnit, deposit, decidedBy, boundBy, terms, tailCapPerUnit, blockers, blockedBy, redeemable, outcome]
      properties:
        seriesId: { type: string }
        now: { type: integer }
        lockupEndsAt: { type: [integer, 'null'] }
        unitsOutstanding: { type: string, description: "the deposit's N: the units outstanding, or on a curve series the count redeem's own census takes now (the DAMM v2 pool not subtracted, Stage 1 B-C13; base lamports)" }
        unitsCounted: { type: string, enum: [units-outstanding, redemption-census], description: 'which count unitsOutstanding is' }
        pricePerUnit: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        decidedBy: { type: string, enum: [cap_remaining, hurdle, payout_multiple], description: "Stage 1's label for the term that set the price (a tie between the floor terms reports hurdle)" }
        boundBy: { type: string, enum: [cap, hurdle, payout], deprecated: true, description: the version-1 label of decidedBy }
        terms:
          type: object
          properties:
            capRemaining: { $ref: '#/components/schemas/Money', description: 'C_remaining = max(capPerUnit − ceil(paidPerUnitWad / 1e18), 0)' }
            hurdlePrice: { $ref: '#/components/schemas/Money', description: P0 compounded at the hurdle rate per whole year, then pro rata, floored each step }
            payoutTerm: { type: [string, 'null'], description: k × D_avg; null before a full settlement year }
            dAvg: { type: [string, 'null'], description: average annual gross per unit over the trailing min(years, 3) settlement years (payments tagged with the settlement year of their report deadline) }
            kTimesDavgYears: { type: integer, description: whole years since settlement }
            hurdleWad: { $ref: '#/components/schemas/Wad' }
            payoutMultipleK: { type: integer }
        tailCapPerUnit: { $ref: '#/components/schemas/Money', description: C_remaining − price; the tail room per unit after a redemption }
        blockers: { type: array, items: { type: string }, description: 'why redeem would be refused now, in the order Stage 1 checks (empty: redeemable)' }
        blockedBy: { type: array, items: { type: string, enum: [TerminalStatus, SeriesLate, LockupActive, PaymentOutstanding, TrueUpOutstanding, UnreportedPeriods, NoUnitsOutstanding] }, description: Stage 1 error names of the blockers, same order }
        redeemable: { type: boolean }
        outcome: { type: string, enum: [redeem, retire], description: 'retire: nothing is left of the cap (C_remaining = 0), so redeem retires the series instead and takes no deposit' }
        note: { type: [string, 'null'] }
    RedeemsFirst:
      type: [object, 'null']
      description: "The redemption a tail or final claim runs first, in the same transaction, for a holder that still has units to redeem (Stage 1's redemption body; its own events: PayoutClaimed for the pending payout and the tail catch-up, UnitsBurned, RedemptionClaimed); null when none runs"
      required: [units, amount, payout]
      properties:
        units: { type: string, description: the units redeemed and burned (the holder's units less those held for a window ask) }
        amount: { $ref: '#/components/schemas/Money', description: the redemption price on those units plus their tail catch-up (redemptionClaimable) }
        payout: { $ref: '#/components/schemas/Money', description: "the holder's pending net payout, which the redemption pays too (claimable)" }
    ClaimBuild:
      type: object
      description: "An unsigned claim of Stage 1's family for the holder to sign, with what it pays and burns"
      required: [tx, amount, redeemsFirst, total, burnsUnits]
      properties:
        tx: { $ref: '#/components/schemas/UnsignedTx' }
        amount: { $ref: '#/components/schemas/Money', description: "what the claim's own event pays (TailClaimed or FinalClaimed amount)" }
        redeemsFirst: { $ref: '#/components/schemas/RedeemsFirst' }
        total: { $ref: '#/components/schemas/Money', description: 'everything the transaction pays the holder: amount plus, when a redemption runs first, its amount and payout' }
        burnsUnits: { type: string, description: 'every unit the transaction burns, the redeemed ones included' }
    RedemptionView:
      type: object
      description: The redemption and its tail, from Stage 1's tail state
      required: [seriesId, status, redemption, tail]
      properties:
        seriesId: { type: string }
        status: { type: string }
        redemption: { type: [object, 'null'] }
        tail:
          type: [object, 'null']
          properties:
            endsAt: { type: integer, description: 'redemption + tail seconds; a period starting after it can carry no tail (TailEnded)' }
            open: { type: boolean, description: 'a tail can still be reported and paid: the next period starts by endsAt and the tail cap is not used up' }
            exhausted: { type: boolean, description: "Stage 1's tailExhausted: the tail cap per unit has been paid in full (NoTailDue)" }
            capPerUnit: { $ref: '#/components/schemas/Money' }
            paidPerUnitWad: { $ref: '#/components/schemas/Wad', description: 'tail gross accepted per accounting unit, WAD-scaled (per base lamport on a curve series)' }
            paidPerUnit: { $ref: '#/components/schemas/Money', description: 'the tail paid per WHOLE unit: floor(paidPerUnitWad × unitScale / 1e18), base units of the stablecoin' }
            refunded: { $ref: '#/components/schemas/Money', description: tail gross refunded to the issuer above the tail cap }
            nextPeriod: { type: [string, 'null'] }
            payouts: { type: array, items: { type: object, properties: { periodId: { type: string }, total: { type: string }, perUnit: { type: string, description: the tail paid per whole unit (TailPayout.perUnit) }, at: { type: integer } } } }
        claims: { type: object, properties: { count: { type: integer }, total: { type: string } } }
paths:
  /series/{seriesId}/treasury/build-draw:
    post:
      operationId: buildTreasuryDraw
      x-access: issuer
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Unsigned drawRelease for every tranche that is due; no approval from anyone (C11.1), content: { application/json: { schema: { type: object } } } }, '409': { description: Paused or nothing drawable } }
  /series/{seriesId}/treasury/build-pause:
    post:
      operationId: buildTreasuryPause
      x-access: issuer
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [paused], properties: { paused: { type: boolean } } } } } }
      responses: { '200': { description: Unsigned pauseReleases (the issuer's own pause), content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/payouts/build-claim:
    post:
      operationId: buildClaimPayout
      x-access: holder
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [holder], properties: { holder: { type: string } } } } } }
      responses:
        '200':
          description: "Unsigned claimPayout (Stage 1's claim), built through the PayoutClaimBuilder interface (private payouts coming soon). It pays the net payout only, on every status: the redemption, the tail and the final-pool share are their own claims (claimRedemption, claimTail, claimFinal; POST /series/{seriesId}/redemption/build-claim, /tail/build-claim, /final/build-claim). On a Retired series it also burns the holder's balance, also when it pays nothing."
          content:
            application/json:
              schema:
                type: object
                properties:
                  tx: { type: object }
                  claimable: { $ref: '#/components/schemas/Money', description: what the claim pays, the net payout only }
                  burnsUnits: { type: string, description: "the units the claim burns: on a Retired series the holder's own balance (its units less the auction units not yet delivered and those held for a window ask), else 0" }
                  builder: { type: string, enum: [public, private] }
        '409': { description: "Nothing to claim (reason nothing-to-claim): the claim would pay 0 and burn nothing. claimWith names the claims that would pay the holder something now (claimRedemption, claimTail, claimFinal)" }
  /series/{seriesId}/tail/build-claim:
    post:
      operationId: buildClaimTail
      x-access: holder
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [holder], properties: { holder: { type: string, description: one of the caller's wallets; it signs the claim } } } } } }
      responses:
        '200':
          description: "Unsigned claimTail (Stage 1's claim_tail): the tail since the holder's tail cursor on its redeemed units (amount = tailClaimable, the TailClaimed amount). A holder that has redeemed nothing is redeemed first by the same transaction (redeemsFirst)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ClaimBuild' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "In Stage 1's order (detail.stage1): NotRedeemed (the series has not redeemed), HolderNotRegistered, NoRedeemedUnits (nothing redeemed and nothing left to redeem). Or nothing to claim (detail.reason nothing-to-claim): the claim would pay 0 and burn nothing; detail.claimWith names the claims that would pay the holder something now" }
  /series/{seriesId}/final/build-claim:
    post:
      operationId: buildClaimFinal
      x-access: holder
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [holder], properties: { holder: { type: string, description: one of the caller's wallets; it signs the claim } } } } } }
      responses:
        '200':
          description: "Unsigned claimFinal (Stage 1's claim_final) after an extinguishment: the pending payout and the final-pool share, once (amount = claimable + finalClaimable, the FinalClaimed amount), and the holder's units burn. On a series that redeemed, a holder with units not yet redeemed is redeemed first by the same transaction (redeemsFirst, which then pays the pending payout) and weighed on its redeemed units plus the units it holds for an uncleared window ask (as both Stage 1 chains weigh it; those units are redeemed, at a share of 0, by a later final claim once the window returns them); amount is then the share (finalClaimable)."
          content: { application/json: { schema: { $ref: '#/components/schemas/ClaimBuild' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { description: "In Stage 1's order (detail.stage1): TerminalStatus (the series is not Extinguished), HolderNotRegistered. Or nothing to claim (detail.reason nothing-to-claim; a second final claim)" }
  /series/{seriesId}/holders/build-register:
    post:
      operationId: buildRegisterHolder
      x-access: account
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [wallet], properties: { wallet: { type: string, description: "one of the caller's wallets; it is registered and signs" } } } } } }
      responses:
        '200':
          description: "Unsigned registerHolder (Stage 1's register_holder, permissionless and idempotent): payouts accrue to registered holders only, from the registration on. A wallet already registered gets alreadyRegistered true and no transaction (tx null). A registration holds no units and grants no holder access."
          content: { application/json: { schema: { type: object, required: [tx, alreadyRegistered], properties: { tx: { oneOf: [{ $ref: '#/components/schemas/UnsignedTx' }, { type: 'null' }] }, alreadyRegistered: { type: boolean } } } } }
        '403': { description: "The wallet is not linked to the caller's account, or it is not on the chain's allowlist (detail.stage1 NotAllowlisted)" }
        '404': { $ref: '#/components/responses/NotFound' }
  /series/{seriesId}/redemption/quote:
    get:
      operationId: getRedemptionQuote
      x-access: holder-or-issuer
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Formula price (min(C_remaining, max(P_hurdle, k × D_avg))), which term decided it, deposit, tail cap and Stage 1's blockers, content: { application/json: { schema: { $ref: '#/components/schemas/RedemptionQuote' } } } }, '409': { description: The raise has not settled } }
  /series/{seriesId}/redemption/build-redeem:
    post:
      operationId: buildRedeem
      x-access: issuer
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: false, content: { application/json: { schema: { type: object, properties: { maxPricePerUnit: { $ref: '#/components/schemas/Money' } } } } } }
      responses: { '200': { description: Unsigned redeem (deposit = price × units outstanding; no fee) with the quote it was built on, content: { application/json: { schema: { type: object, properties: { tx: { type: object }, quote: { $ref: '#/components/schemas/RedemptionQuote' } } } } } }, '409': { description: "A Stage 1 blocker (terminal or Late status, lockup, an unpaid due, an unreported ended period) or the quoted price exceeds maxPricePerUnit" } }
  /series/{seriesId}/redemption/build-claim:
    post:
      operationId: buildClaimRedemption
      x-access: holder
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [holder], properties: { holder: { type: string } } } } } }
      responses:
        '200':
          description: "Unsigned claimRedemption (Stage 1's claim_redemption); the units burn on claim. units are the units redeemed (the holder's units less those held for a window ask); amount is everything it pays: the redemption price on them and their tail catch-up (redemption, redemptionClaimable) and the pending payout (payout, claimable), which the redemption pays too."
          content: { application/json: { schema: { type: object, required: [tx, units, amount, redemption, payout], properties: { tx: { $ref: '#/components/schemas/UnsignedTx' }, units: { type: string }, amount: { $ref: '#/components/schemas/Money' }, redemption: { $ref: '#/components/schemas/Money' }, payout: { $ref: '#/components/schemas/Money' } } } } }
        '409': { description: 'A curve-mode series, whose holders tender instead (detail.stage1 CurveUsesTender); no redemption is open (NotRedeemed), or the holder has no units left to redeem' }
  /series/{seriesId}/redemption:
    get:
      operationId: getRedemption
      x-access: holder-or-issuer
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: Redemption state and tail tracking (window end, per-unit cap, tail paid per unit, exhaustion, tail payouts so far), content: { application/json: { schema: { $ref: '#/components/schemas/RedemptionView' } } } } }
  /series/{seriesId}/retirement:
    get:
      operationId: getRetirement
      x-access: public
      tags: [lifecycle]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses:
        '200':
          description: 'Cap progress and burn progress; burnable is false on a curve-mode series, whose units never burn (Stage 1 CurveModeNoBurn)'
          content:
            application/json:
              schema:
                type: object
                properties:
                  unitScale: { type: string, enum: ['1', '1000000'], description: accounting units per whole unit (1000000 base lamports on a curve series) }
                  capPerUnit: { type: [string, 'null'], description: the cap per whole unit }
                  paidPerUnit: { type: string, description: 'gross paid per WHOLE unit: floor(paidPerUnitWad × unitScale / 1e18)' }
                  capRemaining: { type: [string, 'null'], description: "Stage 1's C_remaining at the unit scale: capPerUnit − ceil(paidPerUnitWad / (1e18 / unitScale)), at least 0" }
                  capProgressBps: { type: integer, description: paidPerUnit / capPerUnit in basis points }
                  unitsOutstanding: { type: string }
                  holdersWithUnits: { type: integer }
                  burnable: { type: boolean }
                  retirableNow: { type: boolean, description: Mint finalized and current cap met on a nonterminal series }
                additionalProperties: true
        '404': { $ref: '#/components/responses/NotFound' }
  /series/{seriesId}/retirement/build-retire:
    post:
      operationId: buildRetireIfCapped
      x-access: account
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: Retire a mint-finalized series whose current cap is met. Anyone may submit it.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [wallet], properties: { wallet: { type: string } } } } } }
      responses:
        '200': { description: Transaction for a linked wallet, content: { application/json: { schema: { type: object, required: [tx], properties: { tx: { $ref: '#/components/schemas/UnsignedTx' } } } } } }
        '403': { description: Wallet is not linked to this account }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Series does not satisfy the command preconditions; detail.stage1 names the refusal }
  /series/{seriesId}/retirement/build-burn:
    post:
      operationId: buildBurnRetired
      x-access: account
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      description: Burn a holder balance on a Retired sealed series. Pending payouts remain claimable; anyone may submit it.
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [wallet, holder], properties: { wallet: { type: string }, holder: { type: string } } } } } }
      responses:
        '200': { description: Transaction for a linked wallet, content: { application/json: { schema: { type: object, required: [tx], properties: { tx: { $ref: '#/components/schemas/UnsignedTx' } } } } } }
        '403': { description: Wallet is not linked to this account }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Series does not satisfy the command preconditions; detail.stage1 names the refusal }
  /series/{seriesId}/retirement/crank-burn:
    post:
      operationId: burnRetiredHolders
      x-access: admin
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: "One permissionless burnRetired (Stage 1's burn_retired) per holder that still holds units: burned counts the holders burned, refused those the chain refused (not registered)", content: { application/json: { schema: { type: object, properties: { burned: { type: integer }, refused: { type: integer } } } } } }, '409': { description: 'A curve-mode series, whose units never burn (detail.stage1 CurveModeNoBurn), or the series is not Retired (TerminalStatus)' } }
  /series/{seriesId}/window:
    get:
      operationId: getTransferWindow
      x-access: public
      tags: [lifecycle]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses: { '200': { description: 'Current transfer window, phase, flag state and market rules. A curve-mode series has no transfer windows and no cap at any stage: walletCapUnits null, noCap true and noCapStatement (the one no-cap statement)', content: { application/json: { schema: { type: object, properties: { walletCapUnits: { type: [string, 'null'], description: "the window's wallet cap in units; null on a curve-mode series" }, noCap: { type: boolean, description: 'present and true on a curve-mode series' }, noCapStatement: { type: string } } } } } }, '404': { $ref: '#/components/responses/NotFound' } }
  /series/{seriesId}/window/build-commit:
    post:
      operationId: buildWindowCommit
      x-access: account
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [wallet, side, commitment, deposit, units], properties: { wallet: { type: string }, side: { type: string, enum: [buy, sell] }, commitment: { type: string }, deposit: { $ref: '#/components/schemas/Money' }, units: { type: string } } } } } }
      responses: { '200': { description: Unsigned commitWindowOrder (buys need the allowlist; sells never do), content: { application/json: { schema: { type: object } } } }, '403': { description: Transfer windows are switched off } }
  /series/{seriesId}/window/build-reveal:
    post:
      operationId: buildWindowReveal
      x-access: account
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [wallet, side, pricePerUnit, quantity, salt], properties: { wallet: { type: string }, side: { type: string }, pricePerUnit: { type: string }, quantity: { type: string }, salt: { type: string } } } } } }
      responses: { '200': { description: Unsigned revealWindowOrder, content: { application/json: { schema: { type: object } } } }, '403': { description: Transfer windows are switched off } }
  /series/{seriesId}/window/backup:
    put:
      operationId: putWindowBackup
      x-access: account
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [wallet, ciphertext], properties: { wallet: { type: string }, ciphertext: { type: string }, keyHint: { type: [string, 'null'] } } } } } }
      responses: { '200': { description: Client-encrypted order backup stored, content: { application/json: { schema: { type: object } } } } }
  /series/{seriesId}/window/backup/{wallet}:
    get:
      operationId: getWindowBackup
      x-access: account
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }, { name: wallet, in: path, required: true, schema: { type: string } }]
      responses: { '200': { description: The backup ciphertext, content: { application/json: { schema: { type: object } } } } }

  /series/{seriesId}/true-up:
    get:
      operationId: getTrueUp
      x-access: holder-or-issuer
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      responses:
        '200':
          description: Live annual true-up ledger including unpaused lateness accrual at chain time.
          content: { application/json: { schema: { $ref: '#/components/schemas/TrueUpState' } } }
  /series/{seriesId}/true-up/build-pay:
    post:
      operationId: buildPayTrueUp
      x-access: account
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters: [{ $ref: '#/components/parameters/seriesId' }]
      requestBody: { required: true, content: { application/json: { schema: { type: object, required: [wallet], properties: { wallet: { type: string } } } } } }
      responses:
        '200':
          description: Unsigned payment by the linked wallet. Total is indicative; the chain recomputes accrued interest when executed.
          content: { application/json: { schema: { type: object, required: [tx, total], properties: { tx: { $ref: '#/components/schemas/UnsignedTx' }, total: { $ref: '#/components/schemas/Money' } } } } }
        '409': { description: No outstanding annual adjustment }
  /series/{seriesId}/tier3/annual/{annualId}/build-submit:
    post:
      operationId: buildSubmitTrueUp
      x-access: issuer
      tags: [lifecycle]
      security: [{ session: [] }]
      parameters:
        - { $ref: '#/components/parameters/seriesId' }
        - { name: annualId, in: path, required: true, schema: { type: string } }
      description: Builds submitTrueUp for the linked issuer wallet with the stored attestor signature after checking the live nonce, year, active key and adjustment. Signing and sending remain on the issuer device.
      responses:
        '200':
          description: Unsigned issuer submission carrying the attestation
          content: { application/json: { schema: { type: object, required: [tx], properties: { tx: { $ref: '#/components/schemas/UnsignedTx' } } } } }
        '409': { description: Not signed, stale nonce, completed year, outstanding adjustment or changed basis }
