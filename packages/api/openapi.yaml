        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Holder positions
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /series/{seriesId}/payouts:
    get:
      operationId: getSeriesPayouts
      x-access: holder
      tags:
        - public
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
