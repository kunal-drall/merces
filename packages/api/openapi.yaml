        data:
          type: object
          description: whitelisted payload keys (ids
          statuses: null
          unix-second dates): null
          additionalProperties:
            type:
              - string
              - integer
        createdAt:
          type: string
          format: date-time
        readAt:
          type:
            - string
            - "null"
          format: date-time
    NotificationList:
      type: object
