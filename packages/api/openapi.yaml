        recent:
          type: array
          items:
            $ref: "#/components/schemas/OutboxRow"
          description: the last 50 rows
    EmailOutboxRow:
      type: object
      required:
        - emailId
        - to
        - subject
        - body
        - createdAt
      properties:
        emailId:
          type: string
        to:
          type: string
        subject:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    SeriesNonces:
      type: object
      description: "A series' signing nonces as the chain stores them (Stage 1 pause_nonce, amendment_nonce, extinguish_nonce, trueup_nonce), u64 decimal strings. A PAUSE, AMEND, EXTINGUISH or TRUEUP signature binds the nonce it was requested over and is dead once that nonce moves: pause advances on each pause request and on its withdrawal (an approval does not), amendment on each accepted amendment, extinguish on the extinguishment, trueup on each accepted true-up. REPORT and FX signatures bind no nonce."
      required:
        - pause
        - amendment
        - extinguish
        - trueup
      additionalProperties: false
      properties:
        pause:
          type: string
          pattern: ^(0|[1-9]\d{0,19})$
        amendment:
          type: string
          pattern: ^(0|[1-9]\d{0,19})$
        extinguish:
          type: string
          pattern: ^(0|[1-9]\d{0,19})$
        trueup:
          type: string
          pattern: ^(0|[1-9]\d{0,19})$
    SeriesSigningContext:
      type: object
      description: "What a signed message on this series binds before its fields: the deployment's domain, then the series key; and the live nonces. All public onchain."
      required:
        - chain
        - seriesId
        - seriesKey
        - domain
        - nonces
      additionalProperties: false
      properties:
        chain:
          type: string
        seriesId:
          type: string
        seriesKey:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: the series PDA's 32 bytes on Solana; bytes32(uint256(series_id)) on the EVM (the simulator's monad series ids are 20-byte pseudo-addresses, left-padded, until the EVM's counter ids)
        domain:
          $ref: "#/components/schemas/SigningDomain"
        nonces:
          $ref: "#/components/schemas/SeriesNonces"
    SigningRequest:
      type: object
      description: "One of Stage 1's MERCES_*_V1 messages for one key to sign on its own device (S4 D2: the backend never holds an attestor key and never signs). The device never trusts it: the Merces attestor tool (merces-attestor sign) requires the chain to be in its own pinned network table with exactly this domain, refuses every mainnet and every network off the signing allow-list, recomputes the series key from the series id, rebuilds the pre-image and the digest from the typed fields with Stage 1's builders, refuses any difference, and signs only the digest it rebuilt. No display text: the device renders what it shows from the typed fields. Public data only: commitments, periods, rates, nonces; never a figure, a salt or an opening."
      required:
        - kind
        - chain
        - seriesId
        - seriesKey
        - domain
        - signer
        - fields
        - preimage
        - digest
        - validWhile
      additionalProperties: false
      properties:
        kind:
          type: string
          enum:
            - REPORT
            - FX
            - AMEND
            - PAUSE
            - EXTINGUISH
            - TRUEUP
          description: Stage 1's message (MAGIC MERCES_<KIND>_V1)
        chain:
          type: string
        seriesId:
          type: string
        seriesKey:
          type: string
          pattern: ^0x[0-9a-f]{64}$
        domain:
          $ref: "#/components/schemas/SigningDomain"
        signer:
          type: string
          pattern: ^0x[0-9a-f]{40}$
          description: "the key addressed: a secp256k1 key's 20-byte address"
        fields:
          type: object
          description: "the message's typed fields, integers as decimal strings: REPORT {periodId, priorIncomeCommitment, incomeCommitment, tier (2 the report verifier's, 3 an attestor's), liquidityEvent}; FX {periodId, fxRateWad}; AMEND {amendmentNonce, termsCommitment, capMultipleWad}; PAUSE {pauseNonce, pauseEnd}; EXTINGUISH {extinguishNonce}; TRUEUP {trueupNonce, year, adjustment, attestationTs}"
        preimage:
          type: string
          pattern: ^0x(?:[0-9a-f]{2})+$
          description: '"MERCES_<KIND>_V1" ‖ domain ‖ series key ‖ the fields, as Stage 1 encodes them'
        digest:
          type: string
          pattern: ^0x[0-9a-f]{64}$
          description: keccak256 of the pre-image, the raw digest signed (no EIP-191 prefix)
        validWhile:
          type: string
          description: "what keeps a signature usable: REPORT and FX bind no nonce (one per series and period; a key revoked after the period ended keeps it usable for 45 days); AMEND, PAUSE, EXTINGUISH and TRUEUP bind the live nonce and need an active key"
    DeviceSignature:
      type: object
      description: "What the attestor tool returns for a signing request it checked and signed (`merces-attestor sign`): the key's address, the 65-byte signature r ‖ s ‖ v (low s, v 27 or 28) and the digest it rebuilt. The API rebuilds the digest from the chain's own reads and recovers the signer; a `digest` sent must be the one it rebuilds."
      required:
        - signer
        - signature
      additionalProperties: false
      properties:
        signer:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        signature:
          type: string
          pattern: ^0x[0-9a-fA-F]{130}$
        digest:
          type: string
          pattern: ^0x[0-9a-f]{64}$
    ThresholdRow:
      type: object
      required:
        - country
        - year
        - currency
        - medianFullTimeIncome
        - inflationIndexBps
        - source
        - retrievedAt
        - placeholder
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2
        year:
          type: integer
        currency:
          type: string
          description: ISO 4217
        medianFullTimeIncome:
          $ref: "#/components/schemas/Money"
          description: annual median full-time income in currency base units (6 decimals)
        inflationIndexBps:
          type: integer
          description: year-over-year CPI change in basis points
        source:
          type: string
        sourceUrl:
          type:
            - string
            - "null"
        retrievedAt:
          type: string
          format: date
        placeholder:
          type: boolean
          description: true until a real statistic with a source replaces the seed
    ThresholdAdminRow:
      allOf:
        - $ref: "#/components/schemas/ThresholdRow"
        - type: object
          properties:
            updatedBy:
              type:
                - string
                - "null"
            updatedAt:
              type: string
              format: date-time
            historyCount:
              type: integer
    ThresholdUpsert:
      type: object
      required:
        - currency
        - medianFullTimeIncome
        - inflationIndexBps
        - source
        - retrievedAt
        - placeholder
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        medianFullTimeIncome:
          $ref: "#/components/schemas/Money"
        inflationIndexBps:
          type: integer
          minimum: -10000
          maximum: 100000
        source:
          type: string
          minLength: 1
          maxLength: 2000
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
        retrievedAt:
          type: string
          format: date
        placeholder:
          type: boolean
    ThresholdHistoryEntry:
      allOf:
        - $ref: "#/components/schemas/ThresholdRow"
        - type: object
          required:
            - id
            - at
            - op
            - changedBy
          properties:
            id:
              type: integer
            at:
              type: string
              format: date-time
            op:
              type: string
              enum:
                - insert
                - update
                - delete
            changedBy:
              type: string
    ThresholdCountrySummary:
      type: object
      required:
        - country
        - latestYear
        - currency
        - placeholder
        - source
      properties:
        country:
          type: string
        latestYear:
          type: integer
        currency:
          type: string
        placeholder:
          type: boolean
        source:
          type: string
    IndexingCandidate:
      type: object
      required:
        - seriesId
        - chain
        - issuer
        - status
        - draftId
        - country
        - inflationIndexBps
        - indexPlaceholder
        - notified
      properties:
        seriesId:
          type: string
        chain:
          type: string
        issuer:
          type: string
        status:
          type: string
        draftId:
          type: string
        country:
          type: string
        vaultVersion:
          type: integer
        inflationIndexBps:
          type: integer
        indexPlaceholder:
          type: boolean
        source:
          type: string
        notified:
          type: boolean
        notifiedAt:
          type:
            - string
            - "null"
          format: date-time
    IndexingNotifyResult:
      type: object
      required:
        - year
        - candidates
        - notified
        - alreadyNotified
      properties:
        year:
          type: integer
        candidates:
          type: integer
        notified:
          type: array
          items:
            type: string
          description: series ids nudged by this call
        alreadyNotified:
          type: array
          items:
            type: string
          description: series ids nudged by an earlier call for this year
  responses:
    Unauthorized:
      description: No or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Session lacks the required tier
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /health:
    get:
      operationId: getHealth
      x-access: public
      tags:
        - public
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /chains:
    get:
      operationId: listChains
      x-access: public
      tags:
        - public
      responses:
        "200":
          description: Chain catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainCatalogue"
  /chains/{chain}/signer-keys:
    get:
      operationId: listChainSignerKeys
      x-access: public
      tags:
        - public
        - signing
      parameters:
        - name: chain
          in: path
          required: true
          schema:
            type: string
        - name: kind
          in: query
          required: true
          schema:
            type: string
            enum:
              - attestor
              - verifier
      description: "The chain's key registry for one kind of key (Stage 1's attestor and report verifier keys, S4 WP5-WP7), read live from the chain: each key's 20-byte address, whether it is active, its forward-only revocation time and the end of its grace for report and FX signatures. Public onchain data; never the account a key is linked to."
      responses:
        "200":
          description: The keys
          content:
            application/json:
              schema:
                type: object
                required:
                  - chain
                  - kind
                  - keys
                properties:
                  chain:
                    type: string
                  kind:
                    type: string
                    enum:
                      - attestor
                      - verifier
                  keys:
                    type: array
                    items:
                      $ref: "#/components/schemas/SignerKeyRecord"
        "400":
          description: kind is missing or not attestor or verifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          $ref: "#/components/responses/NotFound"
  /issuers:
    get:
      operationId: listIssuers
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/chainQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Issuers
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuers:
                    type: array
                    items:
                      type: object
  /issuers/{issuerId}:
    get:
      operationId: getIssuer
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/issuerId"
      responses:
        "200":
          description: Issuer with series
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /series:
    get:
      operationId: listSeries
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/chainQuery"
        - name: status
          in: query
          schema:
            type: string
        - name: issuer
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Series list
          content:
            application/json:
              schema:
                type: object
                properties:
                  series:
                    type: array
                    items:
                      $ref: "#/components/schemas/Series"
  /series/{seriesId}:
    get:
      operationId: getSeries
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{seriesId}/auction:
    get:
      operationId: getAuction
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/seriesId"
      description: "The chain's auction record: Stage 1's stored raise state beside the display phase, the counts, the current settlement round and its running tally, the results once finalized, where the settlement stands (stage) and the end of the current time-bound phase (null while Settling)."
      responses:
        "200":
          description: The auction record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuctionState"
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{seriesId}/status:
    get:
      operationId: getSeriesStatus
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Status
          period standings and history without amounts: null
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{seriesId}/activity:
    get:
      operationId: getSeriesActivity
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/seriesId"
        - $ref: "#/components/parameters/limit"
        - name: before
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity without amounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
  /activity:
    get:
      operationId: getActivity
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/chainQuery"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Global activity without amounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
  /arena:
    get:
      operationId: getArena
      x-access: public
      tags:
        - public
      responses:
        "200":
          description: Live series ranked for the landing page (raises taking bids or settling, and settled series), no amounts
          content:
            application/json:
              schema:
                type: object
  /series/{seriesId}/periods:
    get:
      operationId: getSeriesPeriods
      x-access: holder-or-issuer
      tags:
        - public
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Periods with amounts and the series' reporting ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  periods:
                    type: array
                    items:
                      $ref: "#/components/schemas/Period"
                  reporting:
                    oneOf:
                      - $ref: "#/components/schemas/SeriesReporting"
                      - type: "null"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /series/{seriesId}/treasury:
    get:
      operationId: getTreasury
      x-access: issuer
      tags:
        - public
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Treasury schedule and balances
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /series/{seriesId}/vault:
    get:
      operationId: getVault
      x-access: holder-or-issuer
      tags:
        - public
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Vault balances; dust is what the vault holds beyond every holder's claim (net payout, redemption with its tail catch-up, the tail owed including holders that have not redeemed yet, the final pool)
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /series/{seriesId}/holders:
    get:
      operationId: getHolders
      x-access: holder-or-issuer
      tags:
        - public
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Holder positions
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /series/{seriesId}/payouts:
    get:
      operationId: getSeriesPayouts
      x-access: holder
      tags:
        - public
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Payout history for the caller's wallets plus series-level payments
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /series/{seriesId}/position:
    get:
      operationId: getPosition
      x-access: holder
      tags:
        - public
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: "The live position of each of the caller's wallets on the series' chain, read from the chain: what each claim pays now, apart (claimable and pending for claimPayout, redemptionClaimable, tailClaimable, finalClaimable)"
          content:
            application/json:
              schema:
                type: object
                required:
                  - positions
                properties:
                  positions:
                    type: array
                    items:
                      $ref: "#/components/schemas/PositionView"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /me:
    get:
      operationId: getMe
      x-access: account
      tags:
        - me
      security:
        - session: []
      responses:
        "200":
          description: The signed-in account
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/holdings:
    get:
      operationId: getMyHoldings
      x-access: account
      tags:
        - me
      security:
        - session: []
      responses:
        "200":
          description: Holdings with payout history and yield only (R20)
          content:
            application/json:
              schema:
                type: object
                properties:
                  holdings:
                    type: array
                    items:
                      $ref: "#/components/schemas/Holding"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/payouts:
    get:
      operationId: getMyPayouts
      x-access: account
      tags:
        - me
      security:
        - session: []
      responses:
        "200":
          description: Payouts to the caller's wallets
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/bids:
    get:
      operationId: getMyBids
      x-access: account
      tags:
        - me
      security:
        - session: []
      responses:
        "200":
          description: "The caller's bids with their settlement and delivery, as the chain holds them (each bid from one source: the chain's read, or the indexed row when the chain has no read of it)"
          content:
            application/json:
              schema:
                type: object
                properties:
                  bids:
                    type: array
                    items:
                      $ref: "#/components/schemas/Bid"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dev/time:
    get:
      operationId: devGetTime
      x-access: public
      x-dev-only: true
      tags:
        - dev
      responses:
        "200":
          description: Simulator clocks
          content:
            application/json:
              schema:
                type: object
  /dev/advance-time:
    post:
      operationId: devAdvanceTime
      x-access: public
      x-dev-only: true
      tags:
        - dev
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - seconds
              properties:
                seconds:
                  type: integer
      responses:
        "200":
          description: New simulator clocks
          content:
            application/json:
              schema:
                type: object
  /dev/faucet:
    post:
      operationId: devFaucet
      x-access: public
      x-dev-only: true
      tags:
        - dev
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - wallet
                - stablecoin
                - amount
              properties:
                chain:
                  type: string
                wallet:
                  type: string
                stablecoin:
                  type: string
                  enum:
                    - USDC
                    - USDG
                amount:
                  $ref: "#/components/schemas/Money"
      responses:
        "200":
          description: New balance
          content:
            application/json:
              schema:
                type: object
  /auth/nonce:
    post:
      operationId: authNonce
      x-access: public
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - address
              properties:
                chain:
                  type: string
                address:
                  type: string
      responses:
        "200":
          description: A nonce and the exact message to sign
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce:
                    type: string
                  message:
                    type: string
                  expiresAt:
                    type: string
  /auth/verify:
    post:
      operationId: authVerify
      x-access: public
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - address
                - message
                - signature
              properties:
                chain:
                  type: string
                address:
                  type: string
                message:
                  type: string
                signature:
                  type: string
      description: "Sign in with a wallet: the message and nonce from POST /auth/nonce, signed by the wallet. Only a sign-in nonce is accepted (a key-link challenge is refused: 401). A sign-in never links an attestor key, even an EVM wallet at a key's address (POST /me/signer-keys does)."
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  account:
                    type: object
                  created:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/wallets/link:
    post:
      operationId: linkWallet
      x-access: account
      tags:
        - auth
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - address
                - message
                - signature
              properties:
                chain:
                  type: string
                address:
                  type: string
                message:
                  type: string
                signature:
                  type: string
      responses:
        "200":
          description: Updated session token
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: Wallet belongs to another account
  /me/signer-keys/challenge:
    post:
      operationId: signerKeyChallenge
      x-access: account
      tags:
        - auth
      security:
        - session: []
      description: "Step one of linking an attestor key to the account (S4 WP7, D4): a one-time EIP-191 text bound to this host, the account, the key (shown EIP-55), the nonce and the issue time, which says it links a key and is not an attestation and moves no funds. Chain-neutral (a key is the attestor on every chain that registers it), valid 10 minutes, for the link route only: sign-in refuses it. Says nothing about the key."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - address
              properties:
                address:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
                  description: the key's 20-byte address (any case)
      responses:
        "200":
          description: The challenge
          content:
            application/json:
              schema:
                type: object
                required:
                  - nonce
                  - message
                  - expiresAt
                properties:
                  nonce:
                    type: string
                    pattern: ^[0-9a-f]{32}$
                  message:
                    type: string
                    description: the exact text to sign with personal_sign (EIP-191)
                  expiresAt:
                    type: string
        "400":
          description: Not a 20-byte address
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
