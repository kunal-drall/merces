          description: Unsigned revealBid transaction (values checked against the commitment)
          content:
            application/json:
              schema:
                type: object
        "409":
          description: A curve-mode series runs no sealed-bid raise (detail.stage1 NotSealedBid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
