    Ciphertext:
      type: string
      description: End-to-end ciphertext (base64, base64url or hex) encrypted on the client for the attestor's key. Plaintext, JSON, and any hex, base64 or base64url encoding of text, JSON or a document file are rejected (422).
    E2eEnvelope:
      type: string
      pattern: ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
      description: A merces-e2e v1 envelope, in canonical base64 (standard alphabet, padded) of version 0x01 (1 byte) ‖ the sender's ephemeral X25519 public key (32) ‖ the AES-GCM nonce (12) ‖ the AES-256-GCM ciphertext of the payload and its 16-byte tag. Key = HKDF-SHA256(X25519 shared secret, salt = ephemeral public key ‖ recipient public key, info = "merces/e2e/v1" ‖ 0x00 ‖ purpose); associated data = the 45 header bytes. The server holds no key and checks the shape only; anything that does not parse as an envelope of the payload's size (the plaintext or an encoding of it included) is rejected (422). @merces/poi-device sealE2e / openE2e.
    HardshipStatus:
      type: object
      description: What holders and the issuer see — statuses and dates only, never ciphertext or decision codes.
      properties:
        seriesId:
          type: string
        seriesStatus:
          type: string
        paused:
          type: boolean
        pausedUntil:
          type:
            - integer
            - "null"
        requests:
          type: array
          items:
            type: object
            properties:
              state:
                type: string
                enum:
                  - pending
                  - approved
                  - rejected
                  - withdrawn
                description: "withdrawn: the issuer withdrew the onchain request (S4 WP10)"
              requestedUntil:
                type: integer
              approvedUntil:
                type:
                  - integer
                  - "null"
              requestedAt:
                type: string
              decidedAt:
                type:
                  - string
                  - "null"
    ExtinguishmentRequest:
      type: object
      description: "An extinguishment request (S4 WP12): the two named attestor keys (the opener's first; linked to two accounts, S4 D15), the keys that have signed Stage 1's EXTINGUISH message and the nonce they signed, and the keeper's relay. An unrelayed EXTINGUISH signature is a bearer authorisation and is never shown; once relayed (state sent) the two signatures are public onchain data."
      properties:
        requestId:
          type: string
        seriesId:
          type: string
        chain:
          type: string
        attestors:
          type: array
          minItems: 2
          maxItems: 2
          items:
            type: string
            pattern: ^0x[0-9a-f]{40}$
        state:
          type: string
          enum:
            - collecting
            - ready
            - sent
            - withdrawn
          description: "collecting: fewer than two signatures; ready: both, the relay pending or refused (relayError); sent: the chain extinguished the series with them; withdrawn: it can no longer be completed (another extinguishment landed, or closed in S4)"
        decisionCode:
          type:
            - string
            - "null"
          description: "why it last changed state: extinguished, stale-nonce, attestor-key-inactive, series-extinguished, resign-s4 (opened before S4 WP12: both keys sign again), superseded-s4"
        keyHint:
          type:
            - string
            - "null"
        requestedBy:
          type: string
        createdAt:
          type: string
        extinguishNonce:
          type:
            - string
            - "null"
          description: the extinguish nonce the stored signatures bind
        signers:
          type: array
          items:
            type: string
          description: the named keys that have signed (never their signatures before the relay)
        relayTx:
          type:
            - string
            - "null"
        relayError:
          type:
            - string
            - "null"
          description: the Stage 1 name (or canonical code) of the chain's refusal of the last relay of a ready request
        signatures:
          type: array
          items:
            type: object
            properties:
              signer:
                type: string
              signature:
                type: string
              digest:
                type: string
          description: the two relayed signatures, once sent (named attestors and admins; public onchain)
        evidenceCiphertext:
          $ref: "#/components/schemas/Ciphertext"
    UnsignedTx:
      type: object
      description: "A transaction for one wallet (a user, a holder or the admin multisig) to sign; the backend never signs. It has one signer: nobody co-signs (S4 WP13). An attestor's or the report verifier's approval is a Stage 1 signature the command carries as an argument, never a transaction signature."
      properties:
        chain:
          type: string
        family:
          type: string
          enum:
            - solana
            - evm
        signer:
          type: string
          description: the one signer (the fee payer on Solana, msg.sender on the EVM)
        command:
          type: object
          description: the transaction's command; for a transaction of several commands, the first
        commands:
          type: array
          items:
            type: object
          description: "every command of a transaction built from an ordered list, in order: the chain executes them all or none (one transaction; the curve unstake builder returns [unstakeUnits, claimPayout]). Absent on a transaction of one command"
        payload:
          type: string
        encoding:
          type: string
        summary:
          type: string
        expiresAt:
          type:
            - integer
            - "null"
    RedemptionQuote:
      type: object
      description: "Stage 1's redemptionQuote at the chain's now, over the live cap, paidPerUnitWad and the tagged year ring: price = min(C_remaining, max(P_hurdle, k × D_avg)), deposit = price × units outstanding (no fee; on a curve series floor(price × base lamports / 10^6) over redeem's own census)."
      required:
        - seriesId
        - now
        - pricePerUnit
        - deposit
        - decidedBy
        - boundBy
        - terms
        - tailCapPerUnit
        - blockers
        - blockedBy
        - redeemable
        - outcome
      properties:
        seriesId:
          type: string
        now:
          type: integer
        lockupEndsAt:
          type:
            - integer
            - "null"
        unitsOutstanding:
          type: string
          description: "the deposit's N: the units outstanding, or on a curve series the count redeem's own census takes now (the DAMM v2 pool not subtracted, Stage 1 B-C13; base lamports)"
        unitsCounted:
          type: string
          enum:
            - units-outstanding
            - redemption-census
          description: which count unitsOutstanding is
        pricePerUnit:
          $ref: "#/components/schemas/Money"
        deposit:
          $ref: "#/components/schemas/Money"
        decidedBy:
          type: string
          enum:
            - cap_remaining
            - hurdle
            - payout_multiple
          description: Stage 1's label for the term that set the price (a tie between the floor terms reports hurdle)
        boundBy:
          type: string
          enum:
            - cap
            - hurdle
            - payout
          deprecated: true
          description: the version-1 label of decidedBy
        terms:
          type: object
          properties:
            capRemaining:
              $ref: "#/components/schemas/Money"
              description: C_remaining = max(capPerUnit − ceil(paidPerUnitWad / 1e18), 0)
            hurdlePrice:
              $ref: "#/components/schemas/Money"
              description: P0 compounded at the hurdle rate per whole year
              then pro rata: null
              floored each step: null
            payoutTerm:
              type:
                - string
                - "null"
              description: k × D_avg; null before a full settlement year
            dAvg:
              type:
                - string
                - "null"
              description: average annual gross per unit over the trailing min(years
              3) settlement years (payments tagged with the settlement year of their report deadline): null
            kTimesDavgYears:
              type: integer
              description: whole years since settlement
            hurdleWad:
              $ref: "#/components/schemas/Wad"
            payoutMultipleK:
              type: integer
        tailCapPerUnit:
          $ref: "#/components/schemas/Money"
          description: C_remaining − price; the tail room per unit after a redemption
        blockers:
          type: array
          items:
            type: string
          description: "why redeem would be refused now, in the order Stage 1 checks (empty: redeemable)"
        blockedBy:
          type: array
          items:
            type: string
            enum:
              - TerminalStatus
              - SeriesLate
              - LockupActive
              - PaymentOutstanding
              - TrueUpOutstanding
              - UnreportedPeriods
              - NoUnitsOutstanding
          description: Stage 1 error names of the blockers
          same order: null
        redeemable:
          type: boolean
        outcome:
          type: string
          enum:
            - redeem
            - retire
          description: "retire: nothing is left of the cap (C_remaining = 0), so redeem retires the series instead and takes no deposit"
        note:
          type:
            - string
            - "null"
    RedeemsFirst:
      type:
        - object
        - "null"
      description: "The redemption a tail or final claim runs first, in the same transaction, for a holder that still has units to redeem (Stage 1's redemption body; its own events: PayoutClaimed for the pending payout and the tail catch-up, UnitsBurned, RedemptionClaimed); null when none runs"
      required:
        - units
        - amount
        - payout
      properties:
        units:
          type: string
          description: the units redeemed and burned (the holder's units less those held for a window ask)
        amount:
          $ref: "#/components/schemas/Money"
          description: the redemption price on those units plus their tail catch-up (redemptionClaimable)
        payout:
          $ref: "#/components/schemas/Money"
          description: the holder's pending net payout, which the redemption pays too (claimable)
    ClaimBuild:
      type: object
      description: An unsigned claim of Stage 1's family for the holder to sign, with what it pays and burns
      required:
        - tx
        - amount
        - redeemsFirst
        - total
        - burnsUnits
      properties:
        tx:
          $ref: "#/components/schemas/UnsignedTx"
        amount:
          $ref: "#/components/schemas/Money"
          description: what the claim's own event pays (TailClaimed or FinalClaimed amount)
        redeemsFirst:
          $ref: "#/components/schemas/RedeemsFirst"
        total:
          $ref: "#/components/schemas/Money"
          description: "everything the transaction pays the holder: amount plus, when a redemption runs first, its amount and payout"
        burnsUnits:
          type: string
          description: every unit the transaction burns, the redeemed ones included
    RedemptionView:
      type: object
      description: The redemption and its tail, from Stage 1's tail state
      required:
        - seriesId
        - status
        - redemption
        - tail
      properties:
        seriesId:
          type: string
        status:
          type: string
        redemption:
          type:
            - object
            - "null"
        tail:
          type:
            - object
            - "null"
          properties:
            endsAt:
              type: integer
              description: redemption + tail seconds; a period starting after it can carry no tail (TailEnded)
            open:
              type: boolean
              description: "a tail can still be reported and paid: the next period starts by endsAt and the tail cap is not used up"
            exhausted:
              type: boolean
              description: "Stage 1's tailExhausted: the tail cap per unit has been paid in full (NoTailDue)"
            capPerUnit:
              $ref: "#/components/schemas/Money"
            paidPerUnitWad:
              $ref: "#/components/schemas/Wad"
              description: tail gross accepted per accounting unit, WAD-scaled (per base lamport on a curve series)
            paidPerUnit:
              $ref: "#/components/schemas/Money"
              description: "the tail paid per WHOLE unit: floor(paidPerUnitWad × unitScale / 1e18), base units of the stablecoin"
            refunded:
              $ref: "#/components/schemas/Money"
              description: tail gross refunded to the issuer above the tail cap
            nextPeriod:
              type:
                - string
                - "null"
            payouts:
              type: array
              items:
                type: object
                properties:
                  periodId:
                    type: string
                  total:
                    type: string
                  perUnit:
                    type: string
                    description: the tail paid per whole unit (TailPayout.perUnit)
                  at:
                    type: integer
        claims:
          type: object
          properties:
            count:
              type: integer
            total:
              type: string
    CurveNoCap:
      type: object
      description: "What every curve read and builder response says about the cap, with the buyer notice: GET /series/{seriesId}/curve, its quote and position reads, and its configure, swap, stake, unstake, tender and census builders (the admin monitor, one pass over every curve, carries neither). A curve raise has no wallet cap at any stage, before or after the curve fills (owner direction; Stage 1 stores the curve series' wallet cap as 0 and enforces none). The other fields depend on the operation."
      required:
        - walletCap
        - noCap
        - noCapStatement
        - notice
      additionalProperties: true
      properties:
        walletCap:
          type: "null"
          description: always null (there is no wallet cap)
        noCap:
          type: boolean
          const: true
        noCapStatement:
          type: string
          description: the one no-cap statement
        notice:
          type: string
          description: "the buyer notice (CURVE_BUYER_NOTICE with the curve's own figures, read from the chain): Meteora's pool holds the money until the curve fills, selling back is the only exit before then, no deadline, an issuer receives nothing if the curve never fills, the trading fee and its split among Merces, Meteora and the issuer from the pool's config (never returned), no cap, stake to earn, a wallet not approved can only sell, what happens if the issuer stops paying"
    CurveStatus:
      allOf:
        - $ref: "#/components/schemas/CurveNoCap"
        - type: object
          properties:
            seriesId:
              type: string
            onchain:
              oneOf:
                - $ref: "#/components/schemas/CurveState"
                - type: "null"
            pool:
              type:
                - object
                - "null"
              description: the Meteora port's pool state, when the series was configured
            configured:
              type: boolean
            beforeYouBuy:
              oneOf:
                - $ref: "#/components/schemas/CurveBeforeYouBuy"
                - type: "null"
            graduationMonitor:
              type:
                - object
                - "null"
              description: "the last recorded lifecycle check (the keepers' curve.lifecycle job or the admin monitor; a check is recorded when it sent a step or its read changed): what it read, the steps it sent and the chain's time (chainTime)"
    CurveState:
      type: object
      description: "A curve series' bonding curve as the chain reads it. Base quantities in base lamports (10^6 per whole unit), prices per whole unit. Until S5 the simulator runs a labelled stand-in for Meteora's DBC (venue simulator-stand-in): the constant price P0, Stage 1's generated config's trading fee and split, the fill at the target."
      required:
        - seriesId
        - venue
        - dbcConfig
        - dbcPool
        - baseMint
        - quoteStablecoin
        - migrationQuoteThreshold
        - quoteReserve
        - progressBps
        - finishCurveTimestamp
        - poolComplete
        - settled
        - issuePrice
        - unitsSold
        - baseSold
        - baseSupply
        - spotPrice
        - tradingFeeBps
        - tradingFeeSplitBps
        - migrationFeePercentage
        - tradingFeeUncollected
        - collected
        - census
      properties:
        seriesId:
          type: string
        venue:
          type: string
          enum:
            - simulator-stand-in
            - meteora-dbc
        dbcConfig:
          type: string
        dbcPool:
          type: string
        baseMint:
          type: string
          description: the unit mint (6 decimals)
        quoteStablecoin:
          type: string
          enum:
            - USDC
        migrationQuoteThreshold:
          $ref: "#/components/schemas/Money"
          description: "X: the quote the pool must hold to fill (the minimum raise)"
        quoteReserve:
          $ref: "#/components/schemas/Money"
          description: buyers' money in the pool, net of the fee (the treasury holds none of it)
        progressBps:
          type: integer
          minimum: 0
          maximum: 10000
        finishCurveTimestamp:
          type:
            - integer
            - "null"
          description: when the curve filled (the settlement time)
        poolComplete:
          type: boolean
        settled:
          type: boolean
          description: completeCurve ran
        issuePrice:
          $ref: "#/components/schemas/Money"
          description: P0 per whole unit, fixed at activation
        unitsSold:
          type: string
          pattern: ^\d+$
          description: the base lamports the curve sells
        baseSold:
          type: string
          pattern: ^\d+$
          description: base lamports
        baseSupply:
          type: string
          pattern: ^\d+$
          description: base lamports
        spotPrice:
          $ref: "#/components/schemas/Money"
        tradingFeeBps:
          type: integer
          description: the trading fee every trade pays, as the pool's config sets it (100 = 1%)
        tradingFeeSplitBps:
          type: object
          description: "how the pool's config splits the trading fee, in bps of the fee (summing to 10000): Meteora's protocol share, the partner's (Merces') and the creator's (the issuer's; 0 unless configured). The buyer notice states these figures, never its own"
          required:
            - protocol
            - partner
            - creator
          properties:
            protocol:
              type: integer
              minimum: 0
              maximum: 10000
            partner:
              type: integer
              minimum: 0
              maximum: 10000
            creator:
              type: integer
              minimum: 0
              maximum: 10000
        migrationFeePercentage:
          type: integer
        tradingFeeUncollected:
          $ref: "#/components/schemas/Money"
        collected:
          type: object
          required:
            - migrationFee
            - surplus
            - tradingFee
            - proceeds
          properties:
            migrationFee:
              $ref: "#/components/schemas/Money"
            surplus:
              $ref: "#/components/schemas/Money"
            tradingFee:
              $ref: "#/components/schemas/Money"
            proceeds:
              $ref: "#/components/schemas/Money"
        census:
          $ref: "#/components/schemas/CurveCensus"
    CurveCensus:
      type: object
      description: "A curve series' census (Stage 1 compute_curve_units), base lamports: units outstanding = the unit mint's supply less what protocol accounts hold (the DBC pool's base vault, the DAMM v2 pool's base vault, the locker escrow, the leftover receiver; the stake vault is the holders'). The chain stores a count only when a census is taken (syncCurveUnits, or redeem's own); the stored count is the vault's N, the bound on the stakes and the report proof's public input."
      required:
        - supply
        - protocolHeld
        - unitsOutstanding
        - redemptionUnits
        - stakedTotal
        - synced
        - changedSinceSync
      properties:
        supply:
          type: string
          pattern: ^\d+$
          description: the unit mint's supply now
        protocolHeld:
          type: string
          pattern: ^\d+$
          description: base lamports in protocol accounts now
        unitsOutstanding:
          type: string
          pattern: ^\d+$
          description: "what a census now would store: supply − protocolHeld"
        redemptionUnits:
          type: string
          pattern: ^\d+$
          description: "what redeem's own census would count now, its deposit's N: the DAMM v2 pool's base vault is not subtracted (Stage 1 B-C13), so the count covers every unit holders could tender and parking units in the pool cannot lower it"
        stakedTotal:
          type: string
          pattern: ^\d+$
          description: the stakes now
        synced:
          type:
            - object
            - "null"
          description: the count the chain stored last and when; null before the first census
          required:
            - unitsOutstanding
            - at
          properties:
            unitsOutstanding:
              type: string
              pattern: ^\d+$
            at:
              type: integer
        changedSinceSync:
          type: boolean
          description: a census now would store another count than the last one (or none was taken yet)
    SeriesCurve:
      type: object
      description: A curve series' curve as indexed from Stage 1's activation, completion and collections (the live pool is GET /series/{seriesId}/curve)
      properties:
        dbcPool:
          type: string
        baseMint:
          type: string
        migrationQuoteThreshold:
          $ref: "#/components/schemas/Money"
        issuePrice:
          $ref: "#/components/schemas/Money"
          description: P0 per whole unit
        unitsSold:
          type: string
          pattern: ^\d+$
          description: base lamports
        completed:
          type: boolean
        settledAt:
          type:
            - integer
            - "null"
        proceeds:
          $ref: "#/components/schemas/Money"
        migrationFee:
          $ref: "#/components/schemas/Money"
        surplus:
          $ref: "#/components/schemas/Money"
        tradingFee:
          $ref: "#/components/schemas/Money"
        note:
          type: string
    CurveBeforeYouBuy:
      type: object
      description: "What a buyer acknowledges before a curve buy (owner direction of 2026-10-10): the statements in order, first 'Unapproved wallets earn nothing and cannot tender.', then every point of the buyer notice with the curve's figures, and their version (byb1- and 16 hex digits of SHA-256 over the statements: any change, a figure included, changes it). build-swap builds a buy only with acknowledged true for the current version"
      required:
        - version
        - statements
      properties:
        version:
          type: string
          pattern: ^byb1-[0-9a-f]{16}$
        statements:
          type: array
          items:
            type: string
          minItems: 2
    CurveSwap:
      allOf:
        - $ref: "#/components/schemas/CurveNoCap"
        - type: object
          required:
            - seriesId
            - wallet
            - side
            - payIn
            - amountIn
            - usdcAmount
            - quote
            - minimumAmountOut
            - earns
            - warning
            - beforeYouBuy
            - series
          properties:
            seriesId:
              type: string
            wallet:
              type: string
            side:
              type: string
              enum:
                - buy
                - sell
            payIn:
              type: string
              enum:
                - USDC
                - USDG
            amountIn:
              $ref: "#/components/schemas/Money"
            usdcAmount:
              type:
                - string
                - "null"
              description: a buy's USDC into the curve (after the DEX swap when paying in USDG); null on a sell
            quote:
              type: object
              description: "the chain's quote (ChainPort.quoteCurveSwap): buy, amountIn stablecoin in, amountUsed charged (less when the trade fills the curve), fee, amountOut base lamports; sell, amountIn base lamports in, amountOut stablecoin out after the fee"
              properties:
                seriesId:
                  type: string
                side:
                  type: string
                  enum:
                    - buy
                    - sell
                amountIn:
                  type: string
                amountUsed:
                  type: string
                amountOut:
                  type: string
                fee:
                  type: string
                fillsCurve:
                  type: boolean
            minimumAmountOut:
              type: string
              description: amountOut less the slippage
            earns:
              type: boolean
              description: "the wallet is approved (allowlisted): it can register and stake its units to earn. false: it can trade, never earn or tender"
            warning:
              type:
                - string
                - "null"
              description: "a buy by a wallet that is not approved: what it gets from the series (nothing; it can only sell)"
            beforeYouBuy:
              oneOf:
                - $ref: "#/components/schemas/CurveBeforeYouBuy"
                - type: "null"
              description: null on a sell
            swapQuote:
              type:
                - object
                - "null"
              description: "GET quote with payIn USDG: the DEX port's quote for the swap to USDC"
            series:
              type: object
              properties:
                status:
                  type: string
                phase:
                  type: string
    CurveWalletPosition:
      type: object
      description: "A linked wallet's curve position, base lamports (10^6 per whole unit): only staked units earn"
      required:
        - wallet
        - approved
        - registered
        - walletUnits
        - stakedUnits
        - earning
        - pending
        - claimable
        - stakable
        - stakeBlockedBy
        - censusHeldBy
        - stakeSteps
        - unstakable
        - tender
        - next
      properties:
        wallet:
          type: string
        approved:
          type: boolean
          description: on the chain's allowlist now (registration and staking need it; unstake, claims and tender do not)
        registered:
          type: boolean
          description: a registered holder of the series
        walletUnits:
          type: string
          description: units in the wallet; they earn nothing until staked
        stakedUnits:
          type: string
          description: units in the stake vault for this holder; the only units that earn
        earning:
          type: boolean
        pending:
          $ref: "#/components/schemas/Money"
          description: payouts settled into the holder record and not claimed yet (an unstake through another tool leaves its credit here)
        claimable:
          $ref: "#/components/schemas/Money"
          description: what claimPayout pays now
        stakable:
          type: string
          description: "what the stake builder can stake now, its registration and census steps included: the wallet's units, at most what a census now leaves above the stakes; '0' when stakeBlockedBy names why"
        stakeBlockedBy:
          type:
            - string
            - "null"
          enum:
            - RaiseNotOpen
            - TerminalStatus
            - ZeroUnits
            - NotAllowlisted
            - StakeExceedsOutstanding
            - null
          description: "Stage 1's name for what stops a stake now, the first in stake_units' order (ZeroUnits: no units in the wallet); null when stakable is above 0"
        censusHeldBy:
          type:
            - object
            - "null"
          properties:
            periodId:
              type: string
          description: a census that would let more be staked is held by the issuer's assembled, unsubmitted report (amendment H1)
        stakeSteps:
          type: array
          items:
            type: string
            enum:
              - registerHolder
              - syncCurveUnits
          description: the steps the stake builder puts before stakeUnits
        unstakable:
          type: string
          description: the whole stake; unstaking is never blocked
        tender:
          type:
            - object
            - "null"
          description: the tender at a redemption; null before the series redeemed
          properties:
            fromStake:
              type: string
            fromWallet:
              type: string
              description: the wallet units that fit what is left of the quota
            quotaLeft:
              type: string
            pricePerUnit:
              $ref: "#/components/schemas/Money"
            principal:
              $ref: "#/components/schemas/Money"
              description: floor(pricePerUnit × (fromStake + fromWallet) / 10^6); the pending payout comes on top
            blockedBy:
              type:
                - string
                - "null"
              enum:
                - HolderNotRegistered
                - null
        next:
          type:
            - string
            - "null"
          enum:
            - approve-wallet
            - register-and-stake
            - stake
            - register-and-tender
            - tender
            - claim
            - null
          description: the wallet's next step, as the keepers' reminders name it
    Notification:
      type: object
      required:
