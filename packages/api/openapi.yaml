                type: object
        "409":
          description: A curve-mode series runs no sealed-bid raise (detail.stage1 NotSealedBid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /series/{seriesId}/bids/build-reveal:
