  /series/{seriesId}/bids/build-deliver:
    post:
      operationId: buildDeliverBid
      x-access: account
      tags:
        - bids
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      description: "Builds Stage 1's deliver_bid for a processed, undelivered bid: it pays the bidder its refund and its units. The keepers deliver every bid; this is the bidder's \"deliver now\", or anyone's when the keepers stall (delivery is permissionless and always pays the bidder). `signer` defaults to the bidder and must be one of the caller's wallets."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - bidder
              properties:
                bidder:
                  type: string
                signer:
                  type: string
                  description: "the wallet that signs and sends it (default: the bidder)"
      responses:
        "200":
          description: The unsigned deliverBid and what it delivers
          content:
            application/json:
              schema:
                type: object
                properties:
                  tx:
                    $ref: "#/components/schemas/UnsignedTx"
                  pendingUnits:
                    type: string
                  pendingRefund:
                    $ref: "#/components/schemas/Money"
        "403":
          description: The signer is not one of the caller's wallets
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The bid is not processed yet (detail.stage1 NotProcessed) or already delivered (AlreadyDelivered); a curve-mode series (NotSealedBid)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /series/{seriesId}/auction/build-step:
    post:
      operationId: buildSettlementStep
      x-access: account
      tags:
        - bids
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      description: "Builds the next step of a sealed raise's settlement for `signer` (one of the caller's wallets), with the planner the keepers use: after the reveal end the honest proposal (beginSettlement), the tally pages, finalizeSettlement, a processBid per bid, then a deliverBid per bid. Every step is permissionless; sign it, relay it with POST /tx/send and ask again. Use it when the keepers stall, or to settle a raise with no bid before the keepers' 24-hour grace ends."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signer
              properties:
                signer:
                  type: string
      responses:
        "200":
          description: The next step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SettlementStep"
        "403":
          description: The signer is not one of the caller's wallets
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: "No step to build: detail is a SettlementStepRefusal (wait, done or a stuck code); a curve-mode series, which has no auction, is refused with detail.stage1 NotSealedBid"
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Error"
                  - type: object
                    properties:
                      detail:
                        oneOf:
                          - $ref: "#/components/schemas/SettlementStepRefusal"
                          - type: object
                            properties:
                              stage1:
                                type: string
                                const: NotSealedBid
  /series/{seriesId}/raise/build-open:
