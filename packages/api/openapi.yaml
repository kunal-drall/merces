          properties:
            grossPaidTotal:
              $ref: "#/components/schemas/Money"
              description: lifetime gross accepted into the payout vault (cap refunds excluded)
            netDistributed:
              $ref: "#/components/schemas/Money"
              description: gross minus payout fees
              distributable to holders: null
            feesTaken:
              $ref: "#/components/schemas/Money"
              description: payout fees on regular payments
            count:
              type: integer
        fees:
          type: object
          properties:
            auction:
              $ref: "#/components/schemas/Money"
            payout:
              $ref: "#/components/schemas/Money"
            total:
              $ref: "#/components/schemas/Money"
            vaultFeesTotal:
              $ref: "#/components/schemas/Money"
              description: payout fees as accumulated on the series row (should equal fees.payout)
        payouts:
          type: object
          properties:
            claimed:
              $ref: "#/components/schemas/Money"
            unclaimed:
              $ref: "#/components/schemas/Money"
              description: payments.netDistributed + tail.net + extinguishment.returnedToHolders − claimed (one claim pays the net payout, the tail and the final pool)
            count:
              type: integer
        refunds:
          type: object
          properties:
            total:
              $ref: "#/components/schemas/Money"
            bids:
              $ref: "#/components/schemas/Money"
              description: bid deposit refunds claimed
            payments:
              $ref: "#/components/schemas/Money"
              description: pay-in refunds (cap
              overpayment): null
        treasury:
          type: object
          properties:
            total:
              $ref: "#/components/schemas/Money"
            released:
              $ref: "#/components/schemas/Money"
            balance:
              $ref: "#/components/schemas/Money"
            releasesPaused:
              type: boolean
        redemption:
          type: object
          properties:
            price:
              type:
                - string
                - "null"
            redeemedAt:
              type:
                - integer
                - "null"
            deposit:
              $ref: "#/components/schemas/Money"
            claimed:
              $ref: "#/components/schemas/Money"
        tail:
          type: object
          description: Tail payments after a redemption (Stage 1's tail state, capped per unit at the tail cap; kept outside the payout vault's per-unit figures)
          properties:
            total:
              $ref: "#/components/schemas/Money"
              description: tail gross accepted (the excess over the tail cap is refunded to the issuer)
            fees:
              $ref: "#/components/schemas/Money"
            net:
              $ref: "#/components/schemas/Money"
              description: distributable to the holders that redeemed
            count:
              type: integer
        extinguishment:
          type: object
          properties:
            extinguishedAt:
              type:
                - integer
                - "null"
            returnedToHolders:
              $ref: "#/components/schemas/Money"
              description: the unvested proceeds only (proceeds − vested at the extinguishment), paid to holders through the final pool with no fee; the vested part stays in the treasury, drawable by the issuer
        burns:
          type: object
          properties:
            units:
              type: string
        periods:
          type: array
          items:
            $ref: "#/components/schemas/AccountingPeriodLine"
        moneyEventTotals:
          type: object
          description: count and total per money_events kind (payment, fee, payout, refund, release, treasury, redemption, redemption_claim, tail, burn, extinguishment, split)
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              total:
                type: string
