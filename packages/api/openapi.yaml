        - name: periodId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          schema:
            type: string
      description: "The issuer's device proves the quarter; the documents and the income opening (merces/tier3-opening/v1: year-to-date figure and salt, and the prior's) reach the attestor end to end encrypted. Both are opaque here. The opening must be a merces-e2e v1 envelope sealed for the attestor's X25519 key with purpose merces/tier3-opening/v1 (64 to 4,096 payload bytes; @merces/poi-device sealTier3Opening); anything else is refused."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
                - attestor
                - documentsCiphertext
                - openingCiphertext
                - estimatePaymentStable
              properties:
                attestor:
                  type: string
                  pattern: ^0x[0-9a-fA-F]{40}$
                  description: an attestor key registered on the series' chain (20-byte address)
                documentsCiphertext:
                  $ref: "#/components/schemas/Ciphertext"
                openingCiphertext:
                  $ref: "#/components/schemas/E2eEnvelope"
                keyHint:
                  type:
                    - string
                    - "null"
                estimatePaymentStable:
                  $ref: "#/components/schemas/Money"
      responses:
        "201":
          description: The case (state open; no ciphertext)
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Period not ended, tier 3 disabled, a case already open/signed, or on a curve series a census older than the period end (detail.stage1 CurveUnitsNotSynced, detail.next the sync step)
        "422":
          description: Plaintext-looking documents, an opening that is not a merces-e2e v1 envelope, or an unknown attestor
