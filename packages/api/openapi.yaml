              description: tail gross refunded to the issuer above the tail cap
            nextPeriod:
              type:
                - string
                - "null"
            payouts:
              type: array
              items:
                type: object
                properties:
                  periodId:
                    type: string
                  total:
                    type: string
                  perUnit:
                    type: string
                  at:
                    type: integer
        claims:
          type: object
          properties:
            count:
              type: integer
            total:
              type: string
