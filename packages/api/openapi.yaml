openapi: 3.1.0
info:
  title: Merces API
  version: 0.1.0
  description: |
    One chain-neutral API over every chain Merces runs on. Money is always a decimal string in stablecoin base
    units; ratios are decimal strings in 1e18 fixed point (WAD); timestamps are unix seconds.
    Every operation carries `x-access`: public | account | backer | holder | issuer | attestor | admin |
    holder-or-issuer | issuer-or-attestor. Writes accept an `Idempotency-Key` header.
servers:
  - url: http://localhost:3000
