        formalNoticeEmittedFor:
          type:
            - string
            - "null"
          description: the period whose formal notice the chain recorded (period end + 90 days of unpaused time)
        mintFinalized:
          type: boolean
          description: "Stage 1's mint gate: a sealed raise's last bid is processed (or a curve completed, completeCurve). Payments, reports, releases, redemption, extinguishment and transfer windows wait for it (MintNotFinalized)"
        auction:
          oneOf:
            - $ref: "#/components/schemas/SeriesAuction"
            - type: "null"
          description: null for a curve-mode series
    SeriesReporting:
      type: object
      description: "Stage 1's reporting ledger of a series, as indexed from its events (holder-or-issuer tier: it carries the open due's amount)"
      properties:
        firstPeriod:
          type:
            - string
            - "null"
        nextExpectedPeriod:
          type:
            - string
            - "null"
        lastAcceptedPeriod:
          type:
            - string
            - "null"
        lastPaidPeriod:
          type:
            - string
            - "null"
        openDuePeriod:
          type:
            - string
            - "null"
        openDueAmount:
          $ref: "#/components/schemas/Money"
          description: the open due as reported, before lateness accrual (the open period's live paymentDue adds the accrual to date); 0 when nothing is due
        formalNoticeEmittedFor:
          type:
            - string
            - "null"
    SeriesDetail:
      allOf:
        - $ref: "#/components/schemas/Series"
        - type: object
          properties:
            holderCount:
              type: integer
            curve:
              oneOf:
                - $ref: "#/components/schemas/SeriesCurve"
                - type: "null"
              description: a curve series' curve as indexed; null on a sealed-bid series
    Activity:
      type: object
      description: Public activity never carries an amount.
      properties:
        chain:
          type: string
        seq:
          type: integer
        seriesId:
          type:
            - string
            - "null"
        kind:
          type: string
        summary:
          type: string
        at:
          type: integer
    Period:
      type: object
      properties:
        seriesId:
          type: string
        periodId:
          type: string
        dueAt:
          type: integer
          description: "last OnTime instant: period end + 30 days of unpaused time (Stage 1's countdown, inclusive)"
        graceEndsAt:
          type: integer
          description: last InGrace instant (period end + 45 days unpaused); one second later the period is Late
        formalNoticeAt:
          type: integer
          description: "first instant a formal notice is due: period end + 90 days unpaused (Stage 1 formalNoticeDue); a pause approved later moves it"
        reportAccepted:
          type: boolean
        tier:
          type:
            - integer
            - "null"
        paymentStable:
          $ref: "#/components/schemas/Money"
          description: the accepted report's payment figure (Stage 1's Report.payment_usd, before any router credit); '0' until reported. Stage 1 bounds a negative true-up by the year's sum of it (S4 WP13)
        paymentDue:
          $ref: "#/components/schemas/Money"
          description: "while the period holds the open due: the live amount payIn must carry now (the due plus lateness accrual to date; a tail due without accrual); once paid: the due and accrual recomputed at payment"
        accrual:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Money"
        splitReceived:
          $ref: "#/components/schemas/Money"
        settled:
          type: boolean
        standing:
          type: string
          enum:
            - NotDue
            - OnTime
            - InGrace
            - Late
            - FormalNoticeDue
            - Deferred
        incomeCommitment:
          type:
            - string
            - "null"
        priorIncomeCommitment:
          type:
            - string
            - "null"
          description: the income commitment the report chained from (Stage 1 prior chain; Poseidon(0, 0) at a year start); null until reported
        liquidityEvent:
          type: boolean
        fxBasis:
          type:
            - string
            - "null"
        fxAvgWad:
          type:
            - string
            - "null"
        formalNoticeIssued:
          type: boolean
    Holding:
      type: object
      properties:
        seriesId:
          type: string
        chain:
          type: string
        wallet:
          type: string
        stablecoin:
          type: string
        phase:
          type: string
        status:
          type: string
        raiseStyle:
          type: string
          enum:
            - sealed
            - curve
        unitScale:
          type: string
          enum:
            - "1"
            - "1000000"
          description: "accounting units per whole unit: unit counts are per accounting unit (base lamports on a curve series), per-unit figures per whole unit"
        units:
          type: string
          description: the accrual weight (on a curve series the stake)
        stakedUnits:
          type: string
          description: 'curve: the units in the stake vault ("0" on a sealed-bid series)'
        walletUnits:
          type: string
          description: the units in the wallet (on a curve series they earn nothing until staked)
        redeemedUnits:
          type: string
        burnedUnits:
          type: string
        issuePrice:
          type:
            - string
            - "null"
        capPerUnit:
          type:
            - string
            - "null"
        grossPaidPerUnit:
          type: string
          description: "gross paid per WHOLE unit: floor(paidPerUnitWad × unitScale / 1e18)"
        claimedTotal:
          $ref: "#/components/schemas/Money"
        claimable:
          $ref: "#/components/schemas/Money"
          description: "what claimPayout (Stage 1's claim) pays now: the net payout only; excludes the redemption, the tail and the final pool"
        pending:
          $ref: "#/components/schemas/Money"
          description: the part of claimable already settled into the holder's balance (Stage 1 pending); the rest accrued since the holder's vault cursor
        redemptionClaimable:
          $ref: "#/components/schemas/Money"
          description: "what the redemption pays now beside the pending payout (claimRedemption, or the redemption claimTail or claimFinal runs first): the redemption price on the units not yet redeemed plus their tail catch-up; 0 unless the series redeemed"
        tailClaimable:
          $ref: "#/components/schemas/Money"
          description: "what claimTail pays (Stage 1's claimableTail view): the tail since the holder's tail cursor on its redeemed units or, before it redeems, on the units its redemption would redeem (claimTail redeems first)"
        finalClaimable:
          $ref: "#/components/schemas/Money"
          description: the final-pool share claimFinal pays after an extinguishment (claimFinal also pays the net payout, claimable)
        realisedYieldBps:
          type: integer
          description: claimedTotal / cost basis in basis points; the cost basis is issuePrice × (the units held + burnedUnits) / unitScale, the units held being units on a sealed-bid row and stakedUnits + walletUnits on a curve row (whose units is its stake), so staking or unstaking does not move it
        lockupEndsAt:
          type:
            - integer
            - "null"
        redemptionPrice:
          type:
            - string
            - "null"
    PositionView:
      type: object
      description: "A holder's live position, read from the chain (S3: Stage 1's claim family). Each claimable figure is what one claim pays now; nothing is counted twice."
      required:
        - seriesId
        - wallet
        - units
        - stakedUnits
        - walletUnits
        - undeliveredUnits
        - escrowedUnits
        - claimable
        - pending
        - redemptionClaimable
        - tailClaimable
        - finalClaimable
        - claimedTotal
        - redeemedUnits
        - registered
      properties:
        seriesId:
          type: string
        wallet:
          type: string
        units:
          type: string
          description: "the holder's accrual weight (Stage 1 accrual_units): its balance, its auction units not yet delivered and the units held for a window ask. On a curve series only staked units earn: its stake (stakedUnits), base lamports"
        stakedUnits:
          type: string
          description: "curve mode: the holder's units in the series' stake vault (Stage 1 staked_units, base lamports), the only units that earn; 0 on a sealed-bid series (S3 WP10)"
        walletUnits:
          type: string
          description: "the units in the holder's wallet: on a curve series its base lamports of the unit mint, which earn nothing until staked (a wallet holding units without registering reads registered false); on a sealed-bid series its own balance, units − undeliveredUnits − escrowedUnits"
        undeliveredUnits:
          type: string
          description: auction units allocated and not yet delivered (part of units)
        escrowedUnits:
          type: string
          description: units held for the holder's window ask (part of units); the holder's own balance is units − undeliveredUnits − escrowedUnits
        claimable:
          $ref: "#/components/schemas/Money"
          description: "what claimPayout (Stage 1's claim) pays now: pending plus what accrued since the holder's vault cursor; the net payout only"
        pending:
          $ref: "#/components/schemas/Money"
          description: the part of claimable already settled into the holder's balance (Stage 1 pending)
        redemptionClaimable:
          $ref: "#/components/schemas/Money"
          description: "what claimRedemption pays now beside the pending payout: the redemption price on the units not yet redeemed plus their tail catch-up; 0 unless the series redeemed. On a curve series what a tender (tenderUnits) of the holder's stake and the wallet units that fit the tender quota would pay as principal"
        tailClaimable:
          $ref: "#/components/schemas/Money"
          description: "what claimTail pays as TailClaimed (Stage 1's claimableTail view); claimTail redeems a holder that has redeemed nothing first (on a curve series it redeems nothing: the tail on tendered units only)"
        finalClaimable:
          $ref: "#/components/schemas/Money"
          description: the final-pool share claimFinal pays once after an extinguishment (beside the pending payout). On a curve series that did not redeem the stake's share is in claimable (any claim pays it) and this is 0
        claimedTotal:
          $ref: "#/components/schemas/Money"
        redeemedUnits:
          type: string
        registered:
          type: boolean
          description: "a Stage 1 registered holder: payouts accrue to registered holders only, and every claim needs it"
        lastAccWad:
          $ref: "#/components/schemas/Wad"
          description: the vault accumulator at the holder's last settlement (its claim cursor)
    Hash32:
      type: string
      pattern: ^0x[0-9a-f]{64}$
      description: a 32-byte value as 0x + 64 lowercase hex digits (a BN254 field element for Poseidon commitments)
    FieldDecimal:
      type: string
      pattern: ^\d{1,78}$
      description: a field element or u64 as a decimal string (snarkjs encoding)
    Groth16Proof:
      type: object
      description: A snarkjs Groth16 proof over BN254 (Stage 1's ProofOfIncome circuit); chain adapters encode it for the EVM or Solana verifier.
      required:
        - pi_a
        - pi_b
        - pi_c
        - protocol
        - curve
      additionalProperties: false
      properties:
        pi_a:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/FieldDecimal"
        pi_b:
          type: array
          minItems: 3
          maxItems: 3
          items:
            type: array
            minItems: 2
            maxItems: 2
            items:
              $ref: "#/components/schemas/FieldDecimal"
        pi_c:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: "#/components/schemas/FieldDecimal"
        protocol:
          type: string
          const: groth16
        curve:
          type: string
          const: bn128
    ReportPublicInputs:
      type: array
      minItems: 6
      maxItems: 6
      items:
        $ref: "#/components/schemas/FieldDecimal"
      description: "Stage 1's six public signals, in order: terms_commitment, units_outstanding, fx_avg_wad, prior_income_commitment, income_commitment, payment_usd"
    ReportProof:
      description: "The report proof: Stage 1's Groth16 proof, or (simulator-only processes started with MERCES_PROOF_SYSTEM=mock) the mock digest over the public inputs. GET /prover/artifacts lists the systems the API accepts."
      oneOf:
        - type: object
          required:
            - system
            - proof
            - publicInputs
          additionalProperties: false
          properties:
            system:
              type: string
              const: groth16-bn254
            proof:
              $ref: "#/components/schemas/Groth16Proof"
            publicInputs:
              $ref: "#/components/schemas/ReportPublicInputs"
        - type: object
          required:
            - system
            - proof
            - publicInputs
          additionalProperties: false
          properties:
            system:
              type: string
              const: mock
            proof:
              type: string
            publicInputs:
              $ref: "#/components/schemas/ReportPublicInputs"
      discriminator:
        propertyName: system
    Attestation:
      type: object
      description: "One key's Stage 1 signature over one MERCES_*_V1 message, as a command carries it (S4: nobody co-signs). `signer` is the key's 20-byte address; `signature` is 65 bytes r ‖ s ‖ v (low s, v 27 or 28) over the raw keccak256 digest of the message (no EIP-191 prefix). The digest is never supplied: whoever checks it rebuilds it from the chain's signing domain, the series key and the command's own fields."
      required:
        - signer
        - signature
      additionalProperties: false
      properties:
        signer:
          type: string
          pattern: ^0x[0-9a-f]{40}$
        signature:
          type: string
          pattern: ^0x[0-9a-f]{130}$
    ReportAttestationRecord:
      type: object
      description: "What the report verifier's POST /attest returns for a tier-2 report (served by the isolated report verifier, not this API; S4 WP6): its secp256k1 key's Stage 1 signature over MERCES_REPORT_V1 (the series' chain's signing domain, the series key, the period, the prior and income commitments, tier 2, the liquidity flag), the fields it signed and the digest. The device sends its signer and signature as the report's `attestation` and keeps the whole record as the next quarter's prior attestation. Names no income source and carries no figure."
      required:
        - signer
        - signature
        - digest
        - chain
        - seriesId
        - periodId
        - priorIncomeCommitment
        - incomeCommitment
        - tier
        - liquidityEvent
      additionalProperties: false
      properties:
        signer:
          type: string
          pattern: ^0x[0-9a-f]{40}$
        signature:
          type: string
          pattern: ^0x[0-9a-f]{130}$
        digest:
          $ref: "#/components/schemas/Hash32"
        chain:
          type: string
        seriesId:
          type: string
        periodId:
          type: string
          pattern: ^\d{4}Q[1-4]$
        priorIncomeCommitment:
          $ref: "#/components/schemas/Hash32"
        incomeCommitment:
          $ref: "#/components/schemas/Hash32"
        tier:
          type: integer
          const: 2
        liquidityEvent:
          type: boolean
    SignerKeyRecord:
      type: object
      description: "A key as a chain's registry holds it (Stage 1's attestor or verifier key record): public onchain data."
      required:
        - address
        - active
        - revokedAt
        - graceUntil
      additionalProperties: false
      properties:
        address:
          type: string
          pattern: ^0x[0-9a-f]{40}$
        active:
          type: boolean
        revokedAt:
          type:
            - integer
            - "null"
          description: unix seconds of its forward-only revocation; null for a key never revoked or registered again since
        graceUntil:
          type:
            - integer
            - "null"
          description: "revokedAt + 45 days: report and FX signatures of periods that ended by revokedAt stay valid onchain until then"
    SignerKeyLink:
      type: object
      description: An attestor key linked to the caller's account (S4 WP7), with its indexed registration on every chain that has one. Visible to the account and admins only.
      required:
        - address
        - linkedAt
        - registrations
      properties:
        address:
          type: string
          pattern: ^0x[0-9a-f]{40}$
        linkedAt:
          type: string
        registrations:
          type: array
          items:
            type: object
            required:
              - chain
              - active
              - registeredAt
              - revokedAt
              - graceUntil
            properties:
              chain:
                type: string
              active:
                type: boolean
              registeredAt:
                type:
                  - integer
                  - "null"
              revokedAt:
                type:
                  - integer
                  - "null"
              graceUntil:
                type:
                  - integer
                  - "null"
    SignerKeyLinkResult:
      type: object
      required:
        - key
        - created
        - token
      properties:
        key:
          $ref: "#/components/schemas/SignerKeyLink"
        created:
          type: boolean
        token:
          type: string
          description: a refreshed session token (its roles are informational; access is read live)
    AttestorIdentityCheck:
      type: object
      description: "The account's attestor identity check (A-SIG-7): the provider's check id and status only, never documents or extracted data. Every field but status is null while the account has none (status not_started)."
      required:
        - provider
        - checkId
        - status
        - startedAt
        - updatedAt
      properties:
        provider:
          type:
            - string
            - "null"
          description: the identity provider
        checkId:
          type:
            - string
            - "null"
          description: the provider's reference for the check
        redirectUrl:
          type:
            - string
            - "null"
          description: where the account completes a check just started (POST only); null when an existing check is returned
        status:
          type: string
          enum:
            - not_started
            - pending
            - passed
            - failed
        startedAt:
          type:
            - string
            - "null"
        updatedAt:
          type:
            - string
            - "null"
          description: when the stored status last changed
    ReportVerifierInfo:
      type: object
      description: "The report verifier a device talks to (S4 WP6): its URL, the 20-byte address of its secp256k1 key (the address each chain registers as a verifier key; GET /chains and the chains' registries are public) and the chains it signs for, each with the signing domain it holds (the device can compare it with GET /chains). Public data."
      required:
        - url
        - address
        - chains
      properties:
        url:
          type: string
        address:
          type: string
          pattern: ^0x[0-9a-f]{40}$
        chains:
          type: array
          items:
            type: object
            required:
              - chain
              - domain
            properties:
              chain:
                type: string
              domain:
                $ref: "#/components/schemas/SigningDomain"
    AccountingFeeRow:
      type: object
      required:
        - chain
        - seq
        - seriesId
        - stablecoin
        - kind
        - payer
        - amount
        - blockTime
        - txId
      properties:
        chain:
          type: string
        seq:
          type: integer
        seriesId:
          type: string
        stablecoin:
          type:
            - string
            - "null"
          enum:
            - USDC
            - USDG
            - null
        kind:
          type: string
          enum:
            - auction
            - payout
            - curveTrading
            - nonReveal
          description: 1% auction fee on cleared bids, 5% payout fee at pay-in (C5), Merces' (the partner's) share of a curve's 1% trading fee, collected from the pool by collectCurveProceeds, or the non-reveal charge kept from a bid never revealed when its raise settled (the series' nonRevealChargeBps on the deposit, Stage 1 process_bid)
        payer:
          type: string
          description: the bidder (auction, nonReveal), the issuer's wallet the fee was taken from at pay-in (payout), or the curve's pool (curveTrading)
        amount:
          $ref: "#/components/schemas/Money"
        blockTime:
          type: integer
          description: unix seconds
        txId:
          type: string
    AccountingFeeSeriesTotal:
      type: object
      required:
        - seriesId
        - chain
        - stablecoin
        - auction
        - payout
        - curveTrading
        - nonReveal
        - total
        - count
      properties:
        seriesId:
          type: string
        chain:
          type: string
        stablecoin:
          type:
            - string
            - "null"
        auction:
          $ref: "#/components/schemas/Money"
        payout:
          $ref: "#/components/schemas/Money"
        curveTrading:
          $ref: "#/components/schemas/Money"
        nonReveal:
          $ref: "#/components/schemas/Money"
        total:
          $ref: "#/components/schemas/Money"
        count:
          type: integer
    AccountingFeesReport:
      type: object
      required:
        - filter
        - rows
        - rowCount
        - truncated
        - totals
      properties:
        filter:
          type: object
          properties:
            chain:
              type:
                - string
                - "null"
            seriesId:
              type:
                - string
                - "null"
            from:
              type:
                - integer
                - "null"
            to:
              type:
                - integer
                - "null"
            limit:
              type: integer
        rows:
          type: array
          items:
            $ref: "#/components/schemas/AccountingFeeRow"
        rowCount:
          type: integer
          description: rows matching the filter (before the limit)
        truncated:
          type: boolean
        totals:
          type: object
          required:
            - total
            - count
            - byKind
            - bySeries
          properties:
            total:
              $ref: "#/components/schemas/Money"
            count:
              type: integer
            byKind:
              type: object
              required:
                - auction
                - payout
                - curveTrading
                - nonReveal
              properties:
                auction:
                  $ref: "#/components/schemas/Money"
                payout:
                  $ref: "#/components/schemas/Money"
                curveTrading:
                  $ref: "#/components/schemas/Money"
                nonReveal:
                  $ref: "#/components/schemas/Money"
            bySeries:
              type: array
              items:
                $ref: "#/components/schemas/AccountingFeeSeriesTotal"
    AccountingPeriodLine:
      type: object
      required:
        - periodId
        - paymentDue
        - accrual
        - paid
        - splitReceived
        - reportAccepted
        - settled
      properties:
        periodId:
          type: string
        tier:
          type:
            - integer
            - "null"
        paymentDue:
          $ref: "#/components/schemas/Money"
        accrual:
          $ref: "#/components/schemas/Money"
        paid:
          $ref: "#/components/schemas/Money"
        splitReceived:
          $ref: "#/components/schemas/Money"
        reportAccepted:
          type: boolean
        settled:
          type: boolean
        liquidityEvent:
          type: boolean
    AccountingStatement:
      type: object
      description: Per-series statement from the read model. Amounts, kinds, counts and statuses only; never an income figure.
      required:
        - seriesId
        - chain
        - issuer
        - stablecoin
        - phase
        - status
        - feeRates
        - cap
        - payments
        - fees
        - payouts
        - refunds
        - treasury
        - redemption
        - tail
        - extinguishment
        - burns
        - periods
        - moneyEventTotals
      properties:
        seriesId:
          type: string
        chain:
          type: string
        issuer:
          type: string
        stablecoin:
          type: string
          enum:
            - USDC
            - USDG
        phase:
          type: string
          enum:
            - Draft
            - Open
            - Reveal
            - Settling
            - Settled
            - Failed
            - Cancelled
        status:
          type: string
          enum:
            - OnTime
            - InGrace
            - Late
            - Paused
            - Retired
            - Redeemed
            - Extinguished
        settledAt:
          type:
            - integer
            - "null"
        feeRates:
          type: object
          properties:
            auctionFeeBps:
              type: integer
            payoutFeeBps:
              type: integer
            nonRevealChargeBps:
              type:
                - integer
                - "null"
              description: the series' non-reveal charge (null on a row indexed before S2)
        cap:
          type: object
          description: "C6: cap per whole unit = floor(m × P0 / 1e18) (Stage 1 capPerUnit, live after an amendment); remaining per whole unit = Stage 1's C_remaining at the series' unit scale = max(capPerUnit − ceil(paidPerUnitWad / (1e18 / unitScale)), 0). Unit counts are per accounting unit (base lamports on a curve series), per-unit figures per whole unit"
          properties:
            capMultipleWad:
              $ref: "#/components/schemas/Wad"
            issuePrice:
              type:
                - string
                - "null"
            perUnit:
              type:
                - string
                - "null"
              description: cap per whole unit
              base units; null before settlement: null
            unitScale:
              type: string
              enum:
                - "1"
                - "1000000"
              description: accounting units per whole unit (1000000 base lamports on a curve series)
            unitsSold:
              type: string
              description: accounting units
            unitsOutstanding:
              type: string
              description: accounting units
            total:
              type:
                - string
                - "null"
              description: perUnit × unitsSold / unitScale
            paidPerUnitWad:
              $ref: "#/components/schemas/Wad"
              description: gross paid per accounting unit
              WAD-scaled: null
            paidPerUnit:
              $ref: "#/components/schemas/Money"
              description: "gross paid per whole unit: floor(paidPerUnitWad × unitScale / 1e18)"
            remainingPerUnit:
              type:
                - string
                - "null"
              description: "Stage 1's C_remaining at the unit scale: the paid amount rounded up, never more room than the chain accepts"
            remainingTotal:
              type:
                - string
                - "null"
              description: remainingPerUnit × unitsOutstanding / unitScale
            progressBps:
              type:
                - integer
                - "null"
              description: paid / cap in basis points
        payments:
          type: object
          description: Regular payments only (pay-ins and tier-1 split receipts into the payout vault); the tail and the extinguishment are shown under their own keys, never here.
          properties:
            grossPaidTotal:
              $ref: "#/components/schemas/Money"
              description: lifetime gross accepted into the payout vault (cap refunds excluded)
            netDistributed:
              $ref: "#/components/schemas/Money"
              description: gross minus payout fees
              distributable to holders: null
            feesTaken:
              $ref: "#/components/schemas/Money"
              description: payout fees on regular payments
            count:
              type: integer
        fees:
          type: object
          properties:
            auction:
              $ref: "#/components/schemas/Money"
            payout:
              $ref: "#/components/schemas/Money"
            curveTrading:
              $ref: "#/components/schemas/Money"
            nonReveal:
              $ref: "#/components/schemas/Money"
              description: non-reveal charges kept from bids never revealed when the raise settled
            total:
              $ref: "#/components/schemas/Money"
            vaultFeesTotal:
              $ref: "#/components/schemas/Money"
              description: payout fees as accumulated on the series row (should equal fees.payout)
        payouts:
          type: object
          properties:
            claimed:
              $ref: "#/components/schemas/Money"
              description: "what holders claimed from the three pools: byPool.payout + byPool.tail + byPool.final (redemption principal excluded: redemption.claimed)"
            unclaimed:
              $ref: "#/components/schemas/Money"
              description: payments.netDistributed + tail.net + extinguishment.returnedToHolders − claimed
            count:
              type: integer
              description: claims that paid more than 0 (payout, tail and final claims)
            byPool:
              type: object
              description: "claimed per pool, one per claim of Stage 1's family (S3): the net payout (claimPayout, and the pending payout and tail catch-up a redemption pays), the tail (claimTail) and the final claim (claimFinal: the pending payout and the final-pool share)"
              properties:
                payout:
                  $ref: "#/components/schemas/Money"
                tail:
                  $ref: "#/components/schemas/Money"
                final:
                  $ref: "#/components/schemas/Money"
        refunds:
          type: object
          properties:
            total:
              $ref: "#/components/schemas/Money"
            bids:
              $ref: "#/components/schemas/Money"
              description: bid deposit refunds claimed
            payments:
              $ref: "#/components/schemas/Money"
              description: pay-in refunds (cap
              overpayment): null
        treasury:
          type: object
          properties:
            total:
              $ref: "#/components/schemas/Money"
            released:
              $ref: "#/components/schemas/Money"
            balance:
              $ref: "#/components/schemas/Money"
            releasesPaused:
              type: boolean
        redemption:
          type: object
          properties:
            price:
              type:
                - string
                - "null"
            redeemedAt:
              type:
                - integer
                - "null"
            deposit:
              $ref: "#/components/schemas/Money"
            claimed:
              $ref: "#/components/schemas/Money"
        tail:
          type: object
          description: Tail payments after a redemption (Stage 1's tail state, capped per unit at the tail cap; kept outside the payout vault's per-unit figures)
          properties:
            total:
              $ref: "#/components/schemas/Money"
              description: tail gross accepted (the excess over the tail cap is refunded to the issuer)
            fees:
              $ref: "#/components/schemas/Money"
            net:
              $ref: "#/components/schemas/Money"
              description: distributable to the holders that redeemed
            count:
              type: integer
        extinguishment:
          type: object
          properties:
            extinguishedAt:
              type:
                - integer
                - "null"
            returnedToHolders:
              $ref: "#/components/schemas/Money"
              description: the unvested proceeds only (proceeds − vested at the extinguishment), paid to holders through the final pool with no fee; the vested part stays in the treasury, drawable by the issuer
        burns:
          type: object
          properties:
            units:
              type: string
        periods:
          type: array
          items:
            $ref: "#/components/schemas/AccountingPeriodLine"
        moneyEventTotals:
          type: object
          description: count and total per money_events kind (payment, fee, payout, refund, release, treasury, redemption, redemption_claim, tail, burn, extinguishment, split)
          additionalProperties:
            type: object
            properties:
              count:
                type: integer
              total:
                type: string
