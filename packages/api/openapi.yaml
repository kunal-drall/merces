                  - "null"
                description: unix seconds of the forward-only revocation
              graceUntil:
                type:
                  - integer
                  - "null"
                description: "revokedAt + 3,888,000 s: tier-2 attestations of periods that ended by revokedAt stay valid onchain until then"
