          content:
            application/json:
              schema:
                type: object
        "400":
          description: Malformed or unknown fields
        "409":
          description: Period not ended, already reported, not the next expected period (detail.stage1 WrongPeriod) or a previous due unpaid (detail.stage1 PaymentOutstanding)
        "422":
          description: Proof
          attestation: null
