    NotificationPreferencesUpdate:
      type: object
      required:
        - email
        - mutedKinds
      properties:
        email:
          type: boolean
        mutedKinds:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 64
        emailAddress:
          type:
            - string
            - "null"
          format: email
          maxLength: 320
