            type: string
        command:
          type: object
        payload:
          type: string
        encoding:
          type: string
        summary:
          type: string
        expiresAt:
          type:
            - integer
            - "null"
    RedemptionQuote:
      type: object
      description: "Stage 1's redemptionQuote at the chain's now, over the live cap, paidPerUnitWad and the tagged year ring: price = min(C_remaining, max(P_hurdle, k × D_avg)), deposit = price × units outstanding (no fee)."
      required:
        - seriesId
        - now
        - pricePerUnit
        - deposit
        - decidedBy
        - boundBy
        - terms
        - tailCapPerUnit
        - blockers
        - blockedBy
        - redeemable
        - outcome
      properties:
        seriesId:
          type: string
        now:
          type: integer
        lockupEndsAt:
          type:
            - integer
            - "null"
        unitsOutstanding:
          type: string
        pricePerUnit:
          $ref: "#/components/schemas/Money"
        deposit:
          $ref: "#/components/schemas/Money"
        decidedBy:
          type: string
          enum:
            - cap_remaining
            - hurdle
            - payout_multiple
          description: Stage 1's label for the term that set the price (a tie between the floor terms reports hurdle)
        boundBy:
          type: string
          enum:
            - cap
            - hurdle
            - payout
          deprecated: true
          description: the version-1 label of decidedBy
        terms:
          type: object
          properties:
            capRemaining:
              $ref: "#/components/schemas/Money"
              description: C_remaining = max(capPerUnit − ceil(paidPerUnitWad / 1e18), 0)
            hurdlePrice:
              $ref: "#/components/schemas/Money"
              description: P0 compounded at the hurdle rate per whole year
              then pro rata: null
              floored each step: null
            payoutTerm:
              type:
                - string
                - "null"
              description: k × D_avg; null before a full settlement year
            dAvg:
              type:
                - string
                - "null"
              description: average annual gross per unit over the trailing min(years
              3) settlement years (payments tagged with the settlement year of their report deadline): null
            kTimesDavgYears:
              type: integer
              description: whole years since settlement
            hurdleWad:
              $ref: "#/components/schemas/Wad"
            payoutMultipleK:
              type: integer
        tailCapPerUnit:
          $ref: "#/components/schemas/Money"
          description: C_remaining − price; the tail room per unit after a redemption
        blockers:
          type: array
          items:
            type: string
          description: "why redeem would be refused now, in the order Stage 1 checks (empty: redeemable)"
        blockedBy:
          type: array
          items:
            type: string
            enum:
              - TerminalStatus
              - SeriesLate
              - LockupActive
              - PaymentOutstanding
              - TrueUpOutstanding
              - UnreportedPeriods
          description: Stage 1 error names of the blockers
          same order: null
        redeemable:
          type: boolean
        outcome:
          type: string
          enum:
            - redeem
            - retire
          description: "retire: nothing is left of the cap (C_remaining = 0), so redeem retires the series instead and takes no deposit"
        note:
          type:
            - string
            - "null"
    RedemptionView:
      type: object
      description: The redemption and its tail, from Stage 1's tail state
      required:
