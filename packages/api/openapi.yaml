      responses:
        "200":
          description: The commitment hash (nothing stored; prefer computing it client-side)
          content:
            application/json:
              schema:
                type: object
        "400":
          description: The bidder is not an address of the series' chain
        "422":
          description: The salt is not 32 bytes, or the price or quantity is outside u64 (detail.stage1 AmountOutOfRange); no value is named
  /series/{seriesId}/bids/build-commit:
    post:
      operationId: buildCommitBid
