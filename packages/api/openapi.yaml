      properties:
        email:
          type: boolean
        mutedKinds:
          type: array
          maxItems: 200
          items:
            type: string
            minLength: 1
            maxLength: 64
        emailAddress:
          type:
            - string
            - "null"
          format: email
          maxLength: 320
          description: omitted leaves the stored address unchanged; null clears it
    OutboxRow:
      type: object
      required:
        - id
        - topic
        - kind
        - attempts
        - lastError
        - createdAt
      properties:
        id:
          type: integer
        topic:
          type: string
        kind:
          type:
            - string
            - "null"
        payload:
          type: object
          description: the raw outbox payload (admin-only; may carry amounts owed to issuers or holders)
        attempts:
          type: integer
        lastError:
          type:
            - string
            - "null"
        createdAt:
          type: string
          format: date-time
        dispatchedAt:
          type:
            - string
            - "null"
          format: date-time
    OutboxBacklog:
      type: object
      required:
        - counts
        - failed
        - recent
      properties:
        counts:
          type: object
          required:
            - pending
            - failed
            - dispatched
          properties:
            pending:
              type: integer
            failed:
              type: integer
              description: pending rows whose last attempt failed
            dispatched:
              type: integer
        failed:
          type: array
          items:
            $ref: "#/components/schemas/OutboxRow"
          description: up to 50 pending rows with a last_error
        recent:
          type: array
          items:
            $ref: "#/components/schemas/OutboxRow"
          description: the last 50 rows
    EmailOutboxRow:
      type: object
      required:
        - emailId
        - to
        - subject
        - body
        - createdAt
      properties:
        emailId:
          type: string
        to:
          type: string
        subject:
          type: string
        body:
          type: string
        createdAt:
          type: string
          format: date-time
    ThresholdRow:
      type: object
      required:
        - country
        - year
        - currency
        - medianFullTimeIncome
        - inflationIndexBps
        - source
        - retrievedAt
        - placeholder
      properties:
        country:
          type: string
          description: ISO 3166-1 alpha-2
        year:
          type: integer
        currency:
          type: string
          description: ISO 4217
        medianFullTimeIncome:
          $ref: "#/components/schemas/Money"
          description: annual median full-time income in currency base units (6 decimals)
        inflationIndexBps:
          type: integer
          description: year-over-year CPI change in basis points
        source:
          type: string
        sourceUrl:
          type:
            - string
            - "null"
        retrievedAt:
          type: string
          format: date
        placeholder:
          type: boolean
          description: true until a real statistic with a source replaces the seed
    ThresholdAdminRow:
      allOf:
        - $ref: "#/components/schemas/ThresholdRow"
        - type: object
          properties:
            updatedBy:
              type:
                - string
                - "null"
            updatedAt:
              type: string
              format: date-time
            historyCount:
              type: integer
    ThresholdUpsert:
      type: object
      required:
        - currency
        - medianFullTimeIncome
        - inflationIndexBps
        - source
        - retrievedAt
        - placeholder
      properties:
        currency:
          type: string
          pattern: ^[A-Z]{3}$
        medianFullTimeIncome:
          $ref: "#/components/schemas/Money"
        inflationIndexBps:
          type: integer
          minimum: -10000
          maximum: 100000
        source:
          type: string
          minLength: 1
          maxLength: 2000
        sourceUrl:
          type:
            - string
            - "null"
          format: uri
        retrievedAt:
          type: string
          format: date
        placeholder:
          type: boolean
    ThresholdHistoryEntry:
      allOf:
        - $ref: "#/components/schemas/ThresholdRow"
        - type: object
          required:
            - id
            - at
            - op
            - changedBy
          properties:
            id:
              type: integer
            at:
              type: string
              format: date-time
            op:
              type: string
              enum:
                - insert
                - update
                - delete
            changedBy:
              type: string
    ThresholdCountrySummary:
      type: object
      required:
        - country
        - latestYear
        - currency
        - placeholder
        - source
      properties:
        country:
          type: string
        latestYear:
          type: integer
        currency:
          type: string
        placeholder:
          type: boolean
        source:
          type: string
    IndexingCandidate:
      type: object
      required:
        - seriesId
        - chain
        - issuer
        - status
        - draftId
        - country
        - inflationIndexBps
        - indexPlaceholder
        - notified
      properties:
        seriesId:
          type: string
        chain:
          type: string
        issuer:
          type: string
        status:
          type: string
        draftId:
          type: string
        country:
          type: string
        vaultVersion:
          type: integer
        inflationIndexBps:
          type: integer
        indexPlaceholder:
          type: boolean
        source:
          type: string
        notified:
          type: boolean
        notifiedAt:
          type:
            - string
            - "null"
          format: date-time
    IndexingNotifyResult:
      type: object
      required:
        - year
        - candidates
        - notified
        - alreadyNotified
      properties:
        year:
          type: integer
        candidates:
          type: integer
        notified:
          type: array
          items:
            type: string
          description: series ids nudged by this call
        alreadyNotified:
          type: array
          items:
            type: string
          description: series ids nudged by an earlier call for this year
  responses:
    Unauthorized:
      description: No or invalid session
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Session lacks the required tier
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
paths:
  /health:
    get:
      operationId: getHealth
      x-access: public
      tags:
        - public
      responses:
        "200":
          description: Health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /chains:
    get:
      operationId: listChains
      x-access: public
      tags:
        - public
      responses:
        "200":
          description: Chain catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChainCatalogue"
  /issuers:
    get:
      operationId: listIssuers
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/chainQuery"
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Issuers
          content:
            application/json:
              schema:
                type: object
                properties:
                  issuers:
                    type: array
                    items:
                      type: object
  /issuers/{issuerId}:
    get:
      operationId: getIssuer
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/issuerId"
      responses:
        "200":
          description: Issuer with series
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /series:
    get:
      operationId: listSeries
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/chainQuery"
        - name: status
          in: query
          schema:
            type: string
        - name: issuer
          in: query
          schema:
            type: string
        - $ref: "#/components/parameters/limit"
        - $ref: "#/components/parameters/offset"
      responses:
        "200":
          description: Series list
          content:
            application/json:
              schema:
                type: object
                properties:
                  series:
                    type: array
                    items:
                      $ref: "#/components/schemas/Series"
  /series/{seriesId}:
    get:
      operationId: getSeries
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Series
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeriesDetail"
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{seriesId}/auction:
    get:
      operationId: getAuction
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Auction state (phase
          counts: null
          clearing price once settled): null
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{seriesId}/status:
    get:
      operationId: getSeriesStatus
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Status
          period standings and history without amounts: null
          content:
            application/json:
              schema:
                type: object
        "404":
          $ref: "#/components/responses/NotFound"
  /series/{seriesId}/activity:
    get:
      operationId: getSeriesActivity
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/seriesId"
        - $ref: "#/components/parameters/limit"
        - name: before
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: Activity without amounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
  /activity:
    get:
      operationId: getActivity
      x-access: public
      tags:
        - public
      parameters:
        - $ref: "#/components/parameters/chainQuery"
        - $ref: "#/components/parameters/limit"
      responses:
        "200":
          description: Global activity without amounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  activity:
                    type: array
                    items:
                      $ref: "#/components/schemas/Activity"
  /arena:
    get:
      operationId: getArena
      x-access: public
      tags:
        - public
      responses:
        "200":
          description: Live series ranked for the landing page
          no amounts: null
          content:
            application/json:
              schema:
                type: object
  /series/{seriesId}/periods:
    get:
      operationId: getSeriesPeriods
      x-access: holder-or-issuer
      tags:
        - public
      security:
        - session: []
      parameters:
        - $ref: "#/components/parameters/seriesId"
      responses:
        "200":
          description: Periods with amounts and the series' reporting ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  periods:
                    type: array
                    items:
                      $ref: "#/components/schemas/Period"
                  reporting:
                    oneOf:
                      - $ref: "#/components/schemas/SeriesReporting"
