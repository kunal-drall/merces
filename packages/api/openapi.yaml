      security:
        - session: []
      description: "The caller's curve position (staking is first-class, amendment M8), read live from the chain for each linked wallet on the series' chain, or the one wallet names: its units in the wallet and in the stake vault, whether it earns, its pending payout and claimable, what it can stake now (stakable, with the registration and census steps the stake builder adds) or Stage 1's name for what stops it (stakeBlockedBy), what it can unstake, and its tender at a redemption. A wallet that bought and never registered or staked reads too. Unit counts in base lamports."
      parameters:
        - $ref: "#/components/parameters/seriesId"
        - name: wallet
          in: query
          schema:
            type: string
          description: "one of the caller's wallets (an admin session may name any wallet: the position holds no income data); all of the caller's on the series' chain when absent"
      responses:
        "200":
          description: One position per wallet, with no cap and the buyer notice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CurveNoCap"
                  - type: object
                    required:
                      - seriesId
                      - unitScale
                      - status
                      - phase
                      - redeemed
                      - positions
                    properties:
                      seriesId:
                        type: string
                      unitScale:
                        type: string
                        enum:
                          - "1000000"
                      status:
                        type: string
                      phase:
                        type: string
                      redeemed:
                        type: boolean
                        description: the series redeemed (tenders are open while the quota lasts)
                      positions:
                        type: array
                        items:
                          $ref: "#/components/schemas/CurveWalletPosition"
        "403":
          description: The wallet is not linked to the caller (and the caller is not an admin)
        "409":
          description: Not a curve-mode series (detail.stage1 NotCurveMode)
        "422":
          description: Not a Solana series
  /series/{seriesId}/curve/build-stake:
    post:
      operationId: buildCurveStake
      x-access: account
      tags:
        - curve
      security:
        - session: []
      description: "Stake base lamports from one of the caller's wallets (Stage 1 stake_units): only staked units earn. Ordered unsigned steps to sign in turn: registerHolder when the wallet is not a registered holder, syncCurveUnits when the last census cannot cover the stake and a census now can (never while the issuer has an assembled, unsubmitted report for the next expected period: its proof binds the current census, amendment H1), then stakeUnits. The stake earns from the next payment; unstaking is open at any time."
      parameters:
        - $ref: "#/components/parameters/seriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wallet
                - units
              properties:
                wallet:
                  type: string
                  description: one of the caller's wallets; it signs every step
                units:
                  type: string
                  pattern: ^\d+$
                  description: base lamports
      responses:
        "200":
          description: The steps and the stake after them, with no cap and the buyer notice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CurveNoCap"
                  - type: object
                    required:
                      - seriesId
                      - wallet
                      - units
                      - steps
                      - stakedAfter
                    properties:
                      seriesId:
                        type: string
                      wallet:
                        type: string
                      units:
                        type: string
                      steps:
                        type: array
                        items:
                          type: object
                          required:
                            - step
                            - tx
                          properties:
                            step:
                              type: string
                              enum:
                                - registerHolder
                                - syncCurveUnits
                                - stakeUnits
                            tx:
                              $ref: "#/components/schemas/UnsignedTx"
                      stakedAfter:
                        type: string
        "403":
          description: "The wallet is not linked to the caller, or it is not on the chain's allowlist (detail.stage1 NotAllowlisted: only an approved wallet registers and stakes; it can still sell)"
        "409":
          description: "In Stage 1's order: the raise is not Open or Settled (detail.stage1 RaiseNotOpen), the series is terminal (TerminalStatus), 0 units (ZeroUnits), the stakes would pass the units outstanding even after a census now, or a census is held by the issuer's assembled report (StakeExceedsOutstanding; detail.reason report-pending; detail.stakable), the wallet holds fewer units (detail.code InsufficientFunds); not a curve-mode series (NotCurveMode)"
        "422":
          description: Not a Solana series
  /series/{seriesId}/curve/build-unstake:
    post:
      operationId: buildCurveUnstake
      x-access: account
      tags:
        - curve
      security:
        - session: []
      description: "Unstake base lamports to one of the caller's wallets and claim, in ONE transaction, all or nothing: [unstakeUnits, claimPayout] (UnsignedTx.commands). Stage 1's unstake_units credits what the stake earned into the holder's pending payout and moves no stablecoin; the bundled claimPayout pays exactly that pending payout, so unstaking pays. A holder that unstakes through another tool without claiming keeps the credit as pending (claimable later, never lost). Never refused but for 0 units or more than the stake: no allowlist and no status check."
      parameters:
        - $ref: "#/components/parameters/seriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wallet
                - units
              properties:
                wallet:
                  type: string
                  description: one of the caller's wallets; it signs
                units:
                  type: string
                  pattern: ^\d+$
                  description: base lamports
      responses:
        "200":
          description: The one transaction and what its claim pays at the chain's current state, with no cap and the buyer notice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CurveNoCap"
                  - type: object
                    required:
                      - seriesId
                      - wallet
                      - units
                      - tx
                      - commands
                      - payout
                      - stakedAfter
                    properties:
                      seriesId:
                        type: string
                      wallet:
                        type: string
                      units:
                        type: string
                      tx:
                        $ref: "#/components/schemas/UnsignedTx"
                      commands:
                        type: array
                        items:
                          type: string
                          enum:
                            - unstakeUnits
                            - claimPayout
                      payout:
                        $ref: "#/components/schemas/Money"
                        description: "what the bundled claimPayout pays at the chain's current state: the pending payout plus what the stake earned since the holder's cursor"
                      stakedAfter:
                        type: string
        "403":
          description: The wallet is not linked to the caller
        "409":
          description: 0 units (detail.stage1 ZeroUnits) or more than the stake (InsufficientStake); not a curve-mode series (NotCurveMode)
        "422":
          description: Not a Solana series
  /series/{seriesId}/curve/build-tender:
    post:
      operationId: buildCurveTender
      x-access: account
      tags:
        - curve
      security:
        - session: []
      description: "Tender at a curve redemption (Stage 1 tender_units): fromStake staked and fromWallet wallet base lamports burn and the holder is paid floor(P_redeem × units / 10^6) (principal) plus its pending payout (payout). Staked units are reserved; wallet units share what is left of the count taken at redemption (quotaLeft). No allowlist check: a registered holder taken off the allowlist still tenders."
      parameters:
        - $ref: "#/components/parameters/seriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - wallet
              properties:
                wallet:
                  type: string
                  description: one of the caller's wallets; it signs
                fromStake:
                  type: string
                  pattern: ^\d+$
                  default: "0"
                fromWallet:
                  type: string
                  pattern: ^\d+$
                  default: "0"
      responses:
        "200":
          description: The tender and what it pays, with no cap and the buyer notice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CurveNoCap"
                  - type: object
                    required:
                      - seriesId
                      - wallet
                      - tx
                      - fromStake
                      - fromWallet
                      - units
                      - pricePerUnit
                      - principal
                      - payout
                      - total
                      - quotaLeft
                      - quotaLeftAfter
                    properties:
                      seriesId:
                        type: string
                      wallet:
                        type: string
                      tx:
                        $ref: "#/components/schemas/UnsignedTx"
                      fromStake:
                        type: string
                      fromWallet:
                        type: string
                      units:
                        type: string
                      pricePerUnit:
                        $ref: "#/components/schemas/Money"
                        description: the redemption price per whole unit
                      principal:
                        $ref: "#/components/schemas/Money"
                        description: floor(pricePerUnit × units / 10^6)
                      payout:
                        $ref: "#/components/schemas/Money"
                        description: the pending payout the tender also pays (its own PayoutClaimed)
                      total:
                        $ref: "#/components/schemas/Money"
                      quotaLeft:
                        type: string
                        description: "what is left of the wallet units' quota: units at redemption − tendered − staked"
                      quotaLeftAfter:
                        type: string
        "403":
          description: The wallet is not linked to the caller
        "409":
          description: "In Stage 1's order: no redemption yet (detail.stage1 NotRedeemed), 0 units (ZeroUnits), more than the stake (InsufficientStake), the wallet units would pass the quota (TenderQuotaExhausted; detail.quotaLeft), not a registered holder (HolderNotRegistered), the wallet holds fewer units (detail.code InsufficientFunds); not a curve-mode series (NotCurveMode)"
        "422":
          description: Not a Solana series
  /series/{seriesId}/curve/build-sync:
    post:
      operationId: buildCurveSync
      x-access: account
      tags:
        - curve
      security:
        - session: []
      description: "The curve's census (syncCurveUnits, Stage 1 sync_curve_units; permissionless) for one of the caller's wallets: units outstanding = the unit mint's supply less what protocol accounts hold (the DBC pool's and the DAMM v2 pool's base vaults, the locker escrow, the leftover receiver; never the stake vault). It is the vault's N, the bound on the stakes and the report proof's public input: a regular report needs one taken after its period ended. Never built while the issuer has assembled the report for the series' next expected period and not submitted it (its proof is over the current census)."
      parameters:
        - $ref: "#/components/parameters/seriesId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - signer
              properties:
                signer:
                  type: string
                  description: one of the caller's wallets
      responses:
        "200":
          description: The unsigned census, what it would count now beside the count stored last, and whether it changes it, with no cap and the buyer notice
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/CurveNoCap"
                  - type: object
                    required:
                      - seriesId
                      - tx
                      - census
                      - changes
                    properties:
                      seriesId:
                        type: string
                      tx:
                        type: object
                      census:
                        oneOf:
                          - $ref: "#/components/schemas/CurveCensus"
                          - type: "null"
                      changes:
                        type: boolean
        "403":
          description: The signer is not one of the caller's wallets
        "409":
          description: The raise is not Open or Settled (detail.stage1 RaiseNotOpen), the series is Retired, Redeemed or Extinguished (detail.stage1 TerminalStatus), or the issuer has an assembled report waiting to be submitted (detail.reason report-pending, with its periodId and reportId); not a curve-mode series
        "422":
          description: Not a Solana series
  /admin/curves/monitor:
    post:
      operationId: monitorCurves
      x-access: admin
      tags:
        - admin
      security:
        - session: []
      description: "A manual trigger of the keepers' lifecycle job (curve.lifecycle, every minute): for every curve-mode series, Stage 1's permissionless completeCurve once the pool filled while the raise is Open, then collectCurveProceeds once after it filled (the proceeds) and at most weekly on the chain's clock while the partner's trading fees wait in the pool. A step another sender already took is skipped."
      responses:
        "200":
          description: What the pass did; a series or chain that failed is listed with a code (a Stage 1 error name or a ChainError code), never a message
          content:
            application/json:
              schema:
                type: object
                required:
                  - checked
                  - completed
                  - collected
                  - errors
                properties:
                  checked:
                    type: integer
                  completed:
                    type: array
                    items:
                      type: string
                  collected:
                    type: array
                    items:
                      type: string
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - target
                        - error
                      properties:
                        target:
                          type: string
                          description: a series or chain
                        error:
                          type: string
                          description: a code
