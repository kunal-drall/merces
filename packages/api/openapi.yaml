                  pattern: ^\d{4}Q[1-4]$
                tier:
                  type: integer
                  enum:
                    - 1
                    - 2
                    - 3
                    - 4
                source:
                  type: string
                  description: the income source (kept offchain; shown to the issuer only)
                paymentStable:
                  $ref: "#/components/schemas/Money"
                priorIncomeCommitment:
                  $ref: "#/components/schemas/Hash32"
                incomeCommitment:
                  $ref: "#/components/schemas/Hash32"
                proof:
                  $ref: "#/components/schemas/ReportProof"
                attestation:
                  oneOf:
                    - $ref: "#/components/schemas/VerifierAttestation"
                    - type: "null"
                attestorRate:
                  type:
                    - object
                    - "null"
                  properties:
                    attestor:
                      type: string
                    rateWad:
                      $ref: "#/components/schemas/Wad"
                attestor:
                  type:
                    - string
                    - "null"
                  description: tier 3 co-signer
                liquidityEvent:
                  type: boolean
