          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "The key is not active on the chain (detail.reason key-not-active: revoked or never registered; Solana KeyAlreadyRevoked or AccountNotInitialized, EVM KeyNotRegistered), it is the chain's last active attestor key (detail.reason last-active-key: rotate to a new key instead; Solana LastKeyOfKind, EVM LastActiveKey), or the idempotency key was reused with a different body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/attestors/rotate:
    post:
      operationId: adminRotateAttestor
      x-access: admin
      tags:
        - admin
      security:
        - session: []
      summary: Build Stage 1's rotateAttestor{from, to} for the multisig (register to, revoke from, one transaction) and open a tx request; to must be linked to the account from is linked to; audited
      parameters:
        - $ref: "#/components/parameters/adminIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRotateAttestor"
      responses:
        "201":
          description: The tracked request and the UnsignedTx for the multisig
          content:
