          description: Simulator clocks
          content:
            application/json:
              schema:
                type: object
  /dev/advance-time:
    post:
      operationId: devAdvanceTime
      x-access: public
      x-dev-only: true
      tags:
        - dev
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - seconds
              properties:
                seconds:
                  type: integer
      responses:
        "200":
          description: New simulator clocks
          content:
            application/json:
              schema:
                type: object
  /dev/faucet:
    post:
      operationId: devFaucet
      x-access: public
      x-dev-only: true
      tags:
        - dev
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - wallet
                - stablecoin
                - amount
              properties:
                chain:
                  type: string
                wallet:
                  type: string
                stablecoin:
                  type: string
                  enum:
                    - USDC
                    - USDG
                amount:
                  $ref: "#/components/schemas/Money"
      responses:
        "200":
          description: New balance
          content:
            application/json:
              schema:
                type: object
  /auth/nonce:
    post:
      operationId: authNonce
      x-access: public
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - address
              properties:
                chain:
                  type: string
                address:
                  type: string
      responses:
        "200":
          description: A nonce and the exact message to sign
          content:
            application/json:
              schema:
                type: object
                properties:
                  nonce:
                    type: string
                  message:
                    type: string
                  expiresAt:
                    type: string
  /auth/verify:
    post:
      operationId: authVerify
      x-access: public
      tags:
        - auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - address
                - message
                - signature
              properties:
                chain:
                  type: string
                address:
                  type: string
                message:
                  type: string
                signature:
                  type: string
      responses:
        "200":
          description: Session token
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  account:
                    type: object
                  created:
                    type: boolean
        "401":
          $ref: "#/components/responses/Unauthorized"
  /me/wallets/link:
    post:
      operationId: linkWallet
      x-access: account
      tags:
        - auth
      security:
        - session: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - chain
                - address
                - message
                - signature
              properties:
                chain:
                  type: string
                address:
                  type: string
                message:
                  type: string
                signature:
                  type: string
      responses:
        "200":
          description: Updated session token
          content:
            application/json:
              schema:
                type: object
        "401":
          $ref: "#/components/responses/Unauthorized"
