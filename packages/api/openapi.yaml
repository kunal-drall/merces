      security:
        - session: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Submitted
          content:
            application/json:
              schema:
                type: object
        "409":
          description: Not in draft state
  /applications/{applicationId}/identity/start:
    post:
      operationId: startIdentityCheck
      x-access: account
      tags:
        - applications
      security:
        - session: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Provider check id and redirect URL
          content:
            application/json:
              schema:
                type: object
  /applications/{applicationId}/identity/refresh:
    post:
      operationId: refreshIdentityCheck
      x-access: account
      tags:
        - applications
      security:
        - session: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Current identity status
          content:
            application/json:
              schema:
                type: object
  /applications/{applicationId}/readiness:
    get:
      operationId: getReadiness
      x-access: account
      tags:
        - applications
      security:
        - session: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Private readiness report (R27)
          content:
            application/json:
              schema:
                type: object
  /admin/applications:
    get:
      operationId: adminListApplications
      x-access: admin
      tags:
        - admin
      security:
        - session: []
      parameters:
        - name: state
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Review queue
          content:
            application/json:
              schema:
                type: object
        "403":
          $ref: "#/components/responses/Forbidden"
  /admin/applications/{applicationId}/decide:
    post:
      operationId: adminDecideApplication
      x-access: admin
      tags:
        - admin
      security:
        - session: []
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: string
        - name: Idempotency-Key
          in: header
          schema:
            type: string
