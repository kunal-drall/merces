        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: "Refused, with detail.stage1: NotSealedBid (a curve-mode series), RaiseNotOpen or BidsExist"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
