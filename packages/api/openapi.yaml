          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - kind
                - chain
                - wallet
                - country
              properties:
                kind:
                  type: string
                  enum:
                    - issuer
                    - backer
                chain:
                  type: string
                wallet:
                  type: string
                stablecoin:
                  type: string
                  enum:
                    - USDC
                    - USDG
                persona:
                  type: string
                  enum:
                    - artist
                    - engineer
                    - freelancer
                    - founder
                country:
                  type: string
                  minLength: 2
