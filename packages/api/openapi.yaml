  - name: me
  - name: auth
    description: Wallet sign-in (E2)
  - name: applications
    description: Issuer and backer onboarding (E2)
  - name: drafts
    description: Series drafts
    terms vault and contract signing (E3: null
    E4): null
  - name: terms
    description: Terms validation
    disclosure and amendments (E4): null
  - name: tx
    description: Relay of user-signed transactions
  - name: reporting
    description: ProofOfIncome (E5)
  - name: bids
    description: Sealed-bid auction service (E6)
  - name: admin
  - name: attestor
  - name: dev
    description: Mock-mode only (simulator)
  - name: curve
    description: Meteora curve-mode raises (E14
    Solana only): null
  - name: thresholds
    description: Curated median-income and inflation table and yearly indexing (E9)
