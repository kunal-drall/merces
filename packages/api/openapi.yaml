  /admin/attestors:
    get:
      operationId: adminListAttestors
      x-access: admin
      tags:
        - admin
      security:
        - session: []
      summary: Attestor key proposals beside the indexed onchain registry, by key; only an indexed active registration of a key linked to an account gives that account attestor access
      responses:
        "200":
          description: One row per (chain, key) proposed or registered
          content:
            application/json:
              schema:
                type: object
                required:
                  - attestors
                properties:
                  attestors:
                    type: array
                    items:
                      type: object
                      required:
                        - chain
                        - attestor
                        - status
                        - onchainActive
                        - registeredAt
                        - revokedAt
                        - graceUntil
                      properties:
                        chain:
                          type: string
                        attestor:
                          type: string
                          pattern: ^0x[0-9a-f]{40}$
                          description: the attestor key's 20-byte address (S4 WP7; was `wallet`)
                        accountId:
                          type:
                            - string
                            - "null"
                          description: the account the key is linked to now (the one that gets access); admin views only
                        identityStatus:
                          type:
                            - string
                            - "null"
                          enum:
                            - not_started
                            - pending
                            - passed
                            - failed
                            - null
                          description: that account's attestor identity check as stored (A-SIG-7; registration needs passed); null when no account holds the key
                        status:
                          type: string
                          enum:
                            - registered
                            - pending-onchain
                            - deactivation-pending
                            - inactive
                        onchainActive:
                          type: boolean
                        registeredAt:
                          type:
                            - integer
                            - "null"
                          description: unix seconds the key last became active (indexed AttestorRegistered); null before it was indexed or for rows indexed before S4
                        revokedAt:
                          type:
                            - integer
                            - "null"
                          description: unix seconds of its forward-only revocation (indexed AttestorRevoked); null while active
                        graceUntil:
                          type:
                            - integer
                            - "null"
                          description: "revokedAt + 45 days: until then report and FX signatures of periods that ended by revokedAt stay valid onchain (Stage 1's grace); attestor access ended at revokedAt"
                        proposal:
                          type:
                            - object
                            - "null"
                          description: "the last proposal for the key on this chain: active (a registration, or the new key of a rotation) or not (a revocation, or the old key of a rotation), the account the key was linked to then, the tx request, who proposed it and when"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      operationId: adminRegisterAttestor
      x-access: admin
      tags:
        - admin
      security:
        - session: []
      summary: Build Stage 1's registerAttestor of a key linked to a separately verified account for the multisig and open a tx request; records the proposal but grants nothing (access starts when the registration is indexed, A-M5-2); the registry's rules are checked against the chain first, then the owner's rule (A-SIG-7); audited
      parameters:
        - $ref: "#/components/parameters/adminIdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminRegisterAttestor"
      responses:
        "201":
          description: The tracked request and the UnsignedTx for the multisig
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminTxProposal"
        "400":
          description: Unknown chain
          an address that is not a 20-byte key: null
          or an unknown field: null
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: The account does not exist
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: "Refused before anything is built, value-free: the registry refuses it on this chain (detail.reason key-already-active: the EVM reverts KeyAlreadyActive, Solana would re-emit); the key's account has not passed the attestor identity check (identity-not-verified: it completes POST /me/attestor/identity-check first; A-SIG-7); another key linked to the account is active or proposed on this chain (account-already-attestor: one attestor key per verified account and chain, rotate instead); or the idempotency key was reused with a different body"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          description: The key is linked to no account, or to another account than the one named (detail.reason key-not-linked)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/attestors/revoke:
    post:
      operationId: adminRevokeAttestor
      x-access: admin
      tags:
        - admin
      security:
        - session: []
      summary: Build Stage 1's revokeAttestor for the multisig (forward-only) and open a tx request; access ends once it is indexed; audited
      parameters:
        - $ref: "#/components/parameters/adminIdempotencyKey"
      requestBody:
