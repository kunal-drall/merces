[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
# Compilers are resolved from ~/.svm (0.8.17 for the T-REX unit, 0.8.30 for Merces). Offline: no downloads.
auto_detect_solc = true
offline = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
# The Merces 0.8.30 contracts are compiled through the IR pipeline: MercesIncome and MercesVault exceed the
# EIP-170 limit with legacy codegen. The 0.8.17 unit (vendored T-REX / ONCHAINID and the Merces compliance
# module + token factory that import them) stays on the legacy pipeline Tokeny built and audited with.
via_ir = true
additional_compiler_profiles = [{ name = "legacy", via_ir = false }]
compilation_restrictions = [
  { paths = "lib/t-rex/**", via_ir = false },
  { paths = "lib/onchain-id/**", via_ir = false },
  { paths = "lib/oz4/**", via_ir = false },
  { paths = "lib/oz4-upgradeable/**", via_ir = false },
  { paths = "src/token/**", via_ir = false },
]
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "../packages/vectors" }, { access = "read", path = "./out" }, { access = "read-write", path = "./deployments" }]
ffi = false
# Tests that fill an auction to max_bids_per_auction (4096 wallets) need more than the default 2^30 gas.
gas_limit = "18446744073709551615"
gas_reports = ["MercesRegistry", "MercesAuction", "MercesTreasury", "MercesIncome", "MercesVault", "MercesWindow", "Groth16Verifier"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/",
  # T-REX, ONCHAINID and Merces' own 0.8.17 compliance module use OpenZeppelin 4.9.6 under an explicit prefix.
  "@oz4/=lib/oz4/",
  "@oz4-upgradeable/=lib/oz4-upgradeable/",
  "@tokenysolutions/t-rex/=lib/t-rex/",
  "@onchain-id/solidity/=lib/onchain-id/",
]

[profile.default.fuzz]
runs = 512
max_test_rejects = 131072

[profile.default.invariant]
runs = 128
depth = 64
fail_on_revert = false

# Fast iteration profile: legacy codegen (seconds instead of minutes) with the test EVM's code-size limit lifted,
# because MercesIncome / MercesVault only fit under 24 KB through the IR pipeline. Never deploy from it.
[profile.dev]
via_ir = false
code_size_limit = 4000000
out = "out-dev"
cache_path = "cache-dev"
fs_permissions = [{ access = "read", path = "../packages/vectors" }, { access = "read", path = "./out-dev" }, { access = "read-write", path = "./deployments" }]

[profile.ci]
fuzz = { runs = 4096 }
invariant = { runs = 512, depth = 128 }

[lint]
# Narrowing casts in the Merces libraries are deliberate and range-checked (uint64 money domain, period ids);
# every phase boundary in SPEC is defined on block time, so block.timestamp comparisons are intended.
exclude_lints = ["unsafe-typecast", "block-timestamp"]

[fmt]
line_length = 120
tab_width = 4
bracket_spacing = false
int_types = "long"

[rpc_endpoints]
monad_testnet = "${MONAD_TESTNET_RPC_URL}"
anvil = "http://127.0.0.1:8545"
