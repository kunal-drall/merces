[package]
name = "merces_hook"
version = "0.1.0"
description = "Merces Token-2022 transfer hook: window-only transfers, allowlist and wallet cap for sealed-bid unit mints (SPEC §4.1)."
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "merces_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "merces_registry/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
spl-discriminator = { workspace = true }
spl-transfer-hook-interface = { workspace = true }
spl-tlv-account-resolution = { workspace = true }
merces-common = { path = "../../crates/merces-common" }
merces-onchain = { path = "../../crates/merces-onchain" }
merces_registry = { path = "../merces_registry", features = ["no-entrypoint"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
