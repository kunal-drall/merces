[workspace]
members = ["programs/*", "tests", "crates/*"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.89.0"
license = "SEE LICENSE IN ../LICENSE.md"

[workspace.dependencies]
anchor-lang = { version = "1.2.1", features = ["init-if-needed", "event-cpi"] }
anchor-spl = { version = "1.2.1", features = ["token_2022", "token_2022_extensions", "metadata"] }
spl-token-2022 = "11.1.0"
spl-transfer-hook-interface = "2.1.0"
spl-tlv-account-resolution = "0.11.4"
spl-pod = "0.7.4"
spl-token-metadata-interface = "1.0.1"
groth16-solana = "0.2.0"
pyth-solana-receiver-sdk = "2.0.0"
litesvm = "0.17.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
