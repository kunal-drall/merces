[package]
name = "merces-tests"
version = "0.1.0"
description = "Integration and parity tests for the Merces Solana programs, run against LiteSVM with the compiled .so files."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
path = "src/lib.rs"

[dependencies]
anchor-lang = { workspace = true }
anchor-spl = { workspace = true }
litesvm = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
merces_registry = { path = "../programs/merces_registry", features = ["no-entrypoint"] }
merces_hook = { path = "../programs/merces_hook", features = ["no-entrypoint"] }
merces_protocol = { path = "../programs/merces_protocol", features = ["no-entrypoint"] }
mock_usdg_hook = { path = "../programs/mock_usdg_hook", features = ["no-entrypoint"] }
merces-common = { path = "../crates/merces-common" }
solana-keccak-hasher = { workspace = true }
spl-token-2022 = { workspace = true, features = ["no-entrypoint"] }
spl-token-interface = "2"
spl-associated-token-account-interface = "2"
spl-transfer-hook-interface = { workspace = true }
solana-address = "2.7"
solana-keypair = "3.1"
solana-signer = "3.0"
solana-instruction = "3.5"
solana-message = "4.6"
solana-transaction = "4.3"
solana-hash = "4.6"
solana-clock = "3.2"
solana-system-interface = "3.3"
solana-compute-budget-interface = "3.1"
solana-sdk-ids = "3.1"
k256 = { version = "0.13", features = ["ecdsa"] }
base64 = "0.22"
hex = "0.4"
