name: Monad testnet deployment artifacts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [stage1, '.github/workflows/monad-artifacts.yml']
permissions:
  contents: read
jobs:
  evm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - name: Install and verify pinned Solidity compilers
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          # The official solc-bin repository serves the same binaries as Solidity's CDN.
          # These SHA-256 pins were checked against its linux-amd64/list.json.
          base = 'https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/linux-amd64/'
          compilers = [
              ('0.8.17', 'solc-linux-amd64-v0.8.17+commit.8df45f5f', '0x99f2070b776e9714f1f76c43c229cf99b8978a92938ee8d2364c6de11c1a03d4'),
              ('0.8.30', 'solc-linux-amd64-v0.8.30+commit.73712a01', '0xf3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7'),
          ]
          for version, name, expected in compilers:
              data = urllib.request.urlopen(base + name, timeout=120).read()
              assert '0x' + hashlib.sha256(data).hexdigest() == expected
              target = pathlib.Path.home() / '.svm' / version / ('solc-' + version)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              target.chmod(0o755)
          PY
      - name: Build deployment bytecode using the production compiler profile
        working-directory: stage1/evm
        env:
          FOUNDRY_PROFILE: default
        run: forge build --sizes
      - name: Package artifacts and source provenance
        run: |
          mkdir monad-artifacts
          git rev-parse HEAD > monad-artifacts/backend-commit.txt
          git -C stage1 rev-parse HEAD > monad-artifacts/stage1-commit.txt
          forge --version > monad-artifacts/foundry-version.txt
          tar -czf monad-artifacts/evm-out.tar.gz -C stage1/evm out
          cd monad-artifacts
          sha256sum evm-out.tar.gz > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: monad-bytecode-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: monad-artifacts/
