name: Monad testnet deployment artifacts
on:
  workflow_dispatch:
    inputs:
      prepare_deployment:
        description: Simulate the authorized Stage 5 testnet deployment and export unsigned transactions
        type: boolean
        default: false
  push:
    branches: [main]
    paths: [stage1, '.github/workflows/monad-artifacts.yml']
permissions:
  contents: read
jobs:
  evm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: foundry-rs/foundry-toolchain@v1
        with: { version: v1.7.1 }
      - name: Install and verify pinned Solidity compilers
        run: |
          python3 - <<'PY'
          import hashlib, pathlib, urllib.request
          # The official solc-bin repository serves the same binaries as Solidity's CDN.
          # These SHA-256 pins were checked against its linux-amd64/list.json.
          base = 'https://raw.githubusercontent.com/ethereum/solc-bin/gh-pages/linux-amd64/'
          compilers = [
              ('0.8.17', 'solc-linux-amd64-v0.8.17+commit.8df45f5f', '0x99f2070b776e9714f1f76c43c229cf99b8978a92938ee8d2364c6de11c1a03d4'),
              ('0.8.30', 'solc-linux-amd64-v0.8.30+commit.73712a01', '0xf3e987dc6ecebd4bd350c48edcbc320b46cf9e3109bd3fc3d88f1acaf4c428f7'),
          ]
          for version, name, expected in compilers:
              data = urllib.request.urlopen(base + name, timeout=120).read()
              assert '0x' + hashlib.sha256(data).hexdigest() == expected
              target = pathlib.Path.home() / '.svm' / version / ('solc-' + version)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(data)
              target.chmod(0o755)
          PY
      - name: Build deployment bytecode using the production compiler profile
        working-directory: stage1/evm
        env:
          FOUNDRY_PROFILE: default
        run: forge build --sizes
      - name: Prepare unsigned Stage 5 deployment transactions
        if: github.event_name == 'workflow_dispatch' && inputs.prepare_deployment
        working-directory: stage1/evm
        env:
          FOUNDRY_PROFILE: default
          MERCES_ADMIN: '0x05478199526A3D40428492bea389fe5A625F0d3F'
          MERCES_TIMELOCK_PROPOSER: '0x05478199526A3D40428492bea389fe5A625F0d3F'
          MERCES_ALLOWLIST_MANAGER: '0x50E2244ee5fcDF3E15433dd4ADb0Eb5F6b7C01b6'
          MERCES_TIMELOCK_DELAY: '60'
          MERCES_NETWORK: monad-testnet
        # No signing key, --broadcast, or remote signer: the exported transactions are reviewed and signed locally.
        run: |
          forge script script/DeployMonadTestnet.s.sol:DeployMonadTestnet \
            --rpc-url https://testnet-rpc.monad.xyz \
            --sender 0x62A7e92ba8F36860b54c43e39b3c4BC20eA8cCeE \
            --gas-estimate-multiplier 120 --non-interactive
      - name: Package artifacts and source provenance
        run: |
          mkdir monad-artifacts
          git rev-parse HEAD > monad-artifacts/backend-commit.txt
          git -C stage1 rev-parse HEAD > monad-artifacts/stage1-commit.txt
          forge --version > monad-artifacts/foundry-version.txt
          tar -czf monad-artifacts/evm-out.tar.gz -C stage1/evm out
          if [ -f stage1/evm/broadcast/DeployMonadTestnet.s.sol/10143/dry-run/run-latest.json ]; then
            cp stage1/evm/broadcast/DeployMonadTestnet.s.sol/10143/dry-run/run-latest.json monad-artifacts/unsigned-deployment.json
            cp stage1/evm/deployments/monad-testnet.json monad-artifacts/planned-deployment.json
          fi
          cd monad-artifacts
          sha256sum *.tar.gz *.txt > SHA256SUMS
          if [ -f unsigned-deployment.json ]; then sha256sum *.json >> SHA256SUMS; fi
      - uses: actions/upload-artifact@v4
        with:
          name: monad-bytecode-${{ github.sha }}
          retention-days: 14
          if-no-files-found: error
          path: monad-artifacts/
