name: stage1-sync
# Stage 1 is the pinned `stage1` submodule. This job re-runs stage1:sync against it on a schedule and on demand;
# with the repository variable STAGE1_TRACK_REMOTE=true it first moves the submodule to the head of its tracked
# branch (.gitmodules), so a new Stage 1 commit is caught before anyone bumps the pin. The sync's curve-port step runs
# the ported curve math against Stage 1's figures and Stage 1's own Rust, so it needs a Rust toolchain (below).
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    paths: ['stage1', 'stage1.map.json', '.gitmodules']
jobs:
  sync:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: merces_test }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/merces_test
      STAGE1_PATH: ${{ github.workspace }}/stage1
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - name: Track the Stage 1 branch head (if STAGE1_TRACK_REMOTE is set)
        if: ${{ vars.STAGE1_TRACK_REMOTE == 'true' }}
        run: git submodule update --remote stage1
      # the curve-port gate builds Stage 1's merces-common (tools/stage1-oracle) with Stage 1's pinned toolchain, read
      # after the submodule may have moved; GitHub's ubuntu runners ship rustup. No cargo fails the gate.
      - name: Rust toolchain (Stage 1's pin, stage1/solana/rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' stage1/solana/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup run "$channel" cargo --version
          rustup run "$channel" rustc --version
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      # the lockfile may not match a moved submodule, so this job installs without --frozen-lockfile
      - run: pnpm install
      - run: pnpm stage1:sync
        env:
          SOLANA_RPC_URL: ${{ vars.SOLANA_RPC_URL }}
          EVM_RPC_URL: ${{ vars.EVM_RPC_URL }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage1-sync-report
          path: |
            packages/stage1-sync/out/
            INTERFACE_DRIFT.md
          if-no-files-found: ignore
