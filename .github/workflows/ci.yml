name: ci
on:
  push:
    branches: ['**']
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: merces_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/merces_test
      MERCES_TEST_DB: '1'
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }
      - uses: pnpm/action-setup@v4
        with: { version: 10.28.0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # stage1:sync's curve-port gate (and its tests in `pnpm test`) builds Stage 1's merces-common into
      # tools/stage1-oracle with Stage 1's pinned toolchain; GitHub's ubuntu runners ship rustup. No cargo fails the gate.
      # The oracle builds in seconds, so its target/ is not cached.
      - name: Rust toolchain (Stage 1's pin, stage1/solana/rust-toolchain.toml)
        run: |
          channel="$(sed -n 's/^channel *= *"\(.*\)"/\1/p' stage1/solana/rust-toolchain.toml)"
          test -n "$channel"
          rustup toolchain install "$channel" --profile minimal --no-self-update
          rustup run "$channel" cargo --version
          rustup run "$channel" rustc --version
      - run: pnpm typecheck
      - run: pnpm openapi:check
      - run: pnpm openapi:client && git diff --exit-code -- packages/client/src/generated packages/api/openapi.yaml
      - run: pnpm docs:events && git diff --exit-code -- DOMAIN_EVENTS.md packages/domain/schema
      - run: pnpm test
      - run: pnpm test:conformance
        env: { CONFORMANCE_CHAIN: simulator }
      - run: pnpm test:canary
      - name: stage1:sync against the pinned submodule (the curve-port gate included)
        run: pnpm stage1:sync --no-conformance
